const NARR = {"hadisUsul":["I. Hadis Usulü Edebiyatı Müstakilleri olmasa bile bazı hadis Usûlü kaideleri daha önceki dönemlere ait eserlerde de yer almıştır. Meselâ îmanı Şâfıî (204i819)'nin er-Risâle.'si Ahmed b.Hanbel (241/855) 'in, kendisine sorulan suallere verdiği cevaplar, Müslim (261 874)'in Sahihinde yazdığı mukaddime, Ebu Davud (275/888)'un Mekkelilere yazdığı mektub, Tirmizi (279/892)'nin Câmi'i ve sonundaki Kitâbu'l-ilel'z' bu konuda ilk anda sayılabilecek olan eserlerdir. Yine Buhârî (256/870)'nin üç tarihi, cerh ve ta'dil bilginlerinin değerlendirmeleri de hadis usûlü kaidelerinin ilk kaynaklarıdır.","A. Mütekaddimûn'a Aît Usûl Eserleri","1. er-Râmehurmüzi ve el-Muhaddisu'l-fâsıl'ı Ebu Muhammed, el-Hasen b. Abdirrahman b.Hallâd er-Râmhürmuzî (360/971)'","• 265 (879) yılı civarında İran’ın güneybatısında Ahvaz’a bağlı Râmhürmüz’de doğdu.","• Eserleri:","• Ems̱ âlü’l-ḥadîs̱ : hadislerde geçen va’d-vaîd, helâl-haram, iman-küfür gibi konularda emsale benzer 140 meseli yedi cüz halinde toplayıp âyet, hadis ve şiirlerle şerhettiği bir çalışmadır.","• el-Muḥaddis̱ ü’l-fâṣıl beyne’r-râvî ve’l-vâʿî’:","• Ashâbü’l-hadîsi kötüleyen bir grupla hadis ehlinin âdâbına riayet etmeden hadis meclisi akdeden bazı şeyhlerin ortaya çıkması üzerine hadis talebelerini bunların etkisinden korumak amacıyla rivayet sistemine göre kaleme alınmıştır.","• Mukaddimede öncelikle ashâbü’l-hadîsi tenkit edenlere cevap verilmiş, ehl-i hadîsin değerine dair rivayetler bir araya getirilmiştir. Bu da müellifin bir usul kitabı yazmaktan çok ehl-i hadîse yöneltilen eleştirileri cevaplandırmak istediğini göstermektedir.","• el-Muḥaddis̱ ü’l-fâṣıl’da yirmi iki konu ele alınmış olup her konu önce Hz. Peygamber’den gelen rivayetler, ardından sahâbe ve tâbiînin görüş ve uygulamaları, daha sonra ulemânın görüşleri ışığında ele alınmıştır.","• Önceki devirlerin usule dair birikiminin bu kitapta bir araya getirilmesi onun bu sahada kaleme alınan ilk eser olduğu kanaatini güçlendirmektedir.","• eserde pek çok hadise, bu arada bazı zayıf ve mevzû rivayetlere de yer verilmiştir.","• usul konularının önemli bir kısmını ele almasa bile sadece hadis usulüne tahsis edilmesi sebebiyle ilk olma özelliğini taşıdığı, daha önce Tirmizî ve Şâfiî gibi âlimlerin eserlerinde usul meselelerine yer verilmekle beraber başka ilim dallarına ait konuların da bu kitaplarda yer aldığı ileri sürülmüş ve bu çalışmanın alanın ilk eseri olduğu görüşü savunulmuştur.","• Muhammed Acâc el-Hatîb, kütüphanelerde ondan fazla nüshası bulunan eseri dört nüshasını esas alıp çeşitli fihristler eklemek suretiyle neşretmiştir. Accâc' in 148 sahife tutan mukaddimesinden sonra müellifin önsözüyle başlayan eser, bablar halinde devam etmektedir.","2. el-Hakîm en-Neysâbûrî ve Ma'rifetu ulûmi'l-hadîs'i Ebû Abdillâh Muhammed b. Abdillâh b. Muhammed el-Hâkim en-Nîsâbûrî (ö. 405/1014) el-Müstedrek adlı eseriyle tanınan hadis hâfızı.","Diğer Eserleri:","• Kitâbü’l-İklîl, el-Medḫal ilâ (maʿrifeti) Kitâbi’l-İklîl (el-Medḫal ilâ maʿrifeti’ṣ-ṣaḥîḥ ve’s-saḳīm mine’l-aḫbâri’l-merviyye).","• Maʿrifetü ʿulûmi’l-(uṣûli’l-) ḥadîs̱","• Hâkim en-Nîsâbûrî, sünnet ilimleri konusunda insanların bilgisizce konuşmasını ve bid‘atlara dalmasını önlemek amacıyla telif etmiştir.","• Hadis usulü konularının tam mânasıyla şekillenmediği bir dönemde kaleme alınan eserde birtakım usul meselelerine yer vermeyen müellif bunları el-Medḫal fî ʿilmi’l-ḥadîs̱ (Beyrut-Halep 1352/1932) ve el-Medḫal ilâ maʿrifeti’ṣ-Ṣaḥîḥayn gibi eserlerinde ele almıştır.","• Maʿrifetü ʿulûmi’l-ḥadîs̱ ’te her konu “nev‘” başlığı altında açıklanmış ve sened, metin, ricâl ilmi, hadis rivayet âdâbı gibi meseleler büyük ölçüde düzensiz bir şekilde sıralanmış, daha sonraları usul konuları içinde yer almayan Hz. Peygamber’in gazveleri, çeşitli itikadî fırka mensuplarının değerlendirilmesi meseleleri de birer bölüm kabul edilmiştir.","• \"Ulûmu'l-hadîs\" teriminin ilk kez kullanıldığı kitab, 52 nevi'den oluşmaktadır. İlk nevi', âli isnâd'm tanımına tahsis edilmiştir. En son nevi' ise, arz, semâ1 ve kitabet gibi hadis öğrenim yollarına ayrılmıştır. Konuların işlenmesinde yer yer müellifin görüşlerine de rastlamak mümkündür.","• İbn Hacer, tertib bakımından eserin mükemmel sayılamayacağını söylerken İbn Haldun, (808/1405) \"hadis ilminin güzelliklerini ortaya koyduğu görüşündedir. Ma'rifetu ulûmi'l-hadîs, Tahîr el-Cezâirî (1338/1920) tarafından Tevcihu'n-nazar'da Özetlenmiştir.","• Seyyid Muazzam Hüseyin sekiz nüshayı karşılaştırarak Hindistan'da neşretmiştir.","• Ebû Nuaym el-İsfahânî’nin el-Müstaḫrec ʿalâ kitâbi ʿUlûmi’l-ḥadîs̱ li’l-Ḥâkim adlı bir kitap kaleme aldığı belirtilmektedir. Abdullah b. Süleym b. Selâme es-Sâidî Menhecü’l-Ḥâkim en-Nîsâbûrî fî kitâbihî Maʿrifeti ʿulûmi’l-ḥadîs̱ ve taḫrîci’l-eḥâdîs̱ i’l-merfûʿa adıyla bir yüksek lisans tezi hazırlamış","3. Hatîb el-Bağdâdi ve el-Kifâye fî ilmi'r-rivâye'si. 23 Cemâziyelâhir 392’de (9 Mayıs 1002) (Târîḫu Baġdâd, XI, 266) Mekke-Medine yolu üzerindeki Vâdilmelel’in Guzeyye kasabasında dünyaya geldi.","Eserleri:","• el-Câmiʿ li-aḫlâḳı’r-râvî* ve âdâbi’s-sâmi, Şerefü aṣḥâbi’l-ḥadîs̱ , Naṣîḥatü ehli’l-ḥadîs̱","• Tarihu Bağdad","• el-Kifâye fî ilmi'r-rivâye:","• Hemen hepsi senedli rivayetleri ihtiva eden 137 bab ve dokuz fasıldan oluşan eserde hadis usulünün kural ve prensipleri tesbit edilirken farklı görüşler gerekçeleriyle zikredilip tartışılmış, bazan konular soru-cevap şeklinde incelenmiştir. Sünnetin dindeki yeri, Kur’an’ın genel ifadelerini tahsisi, mücmelini tefsiri ve hadisler arasında görülen teâruz ve tercih gibi daha ziyade fıkıh usulünde tartışılan konulara da yer verilmiştir.","• Açık bir gerçektir ki, Hatîb, el-Hakim'in Ma'rifetu uîûmi'l-hadîs'inin hemen hemen iki misli bir hacme sahip olan el-Kifâye'de, usûl konularını daha teknik ve daha geniş olarak incelemiştir.","• Dinî meselelerde haber-i vâhidi kabul etmeyenlerin görüşlerinin eleştirildiği eserde ahkâmla ilgili meselelerde haber-i vâhidin gerektirdiğiyle amel edileceği, ancak inançla ilgili konularda kabul edilmeyeceği belirtilmiştir.","• el-Kifâye’yi Hâşim en-Nedvî, Muhammed Tâhâ en-Nedvî ve Ahmedullah en-Nedvî (Haydarâbâd 1357/1938), Muhammed el-Hâfız et-Ticânî (Kahire 1392/1972, 1976) ve Ahmed Ömer Hâşim (Beyrut 1405/1984, 1406/1986) yayımlamışlardır.","B. Müteahhirûna Ait Usûl Eserleri","1. Kadı îyaz ve el-İlma'ı Hakkında \"îyaz olmasaydı, mağribin adını kimse anmazdi\" denilen Ebu'l-Fazl İyaz b.Musa el-Yahsûbî Sebte'de 494/1102'de doğmuştur.","Eserleri:","• Meşânkü’l-envâr, İkmalu'l-Mu'lim, eş-Şifa","• el-İlmâʿ ilâ maʿrifeti uṣûli’r-rivâye ve taḳyîdi’s-semâʿ","• Müellif el-îlma'da konuları, \"bab\"lara ayırarak ve genellikle, senedsiz değerlendirmelerle işlemektedir. Senedli olarak verdiği bilgiler ekseriyetle delil olmak üzere sevkettiği hadislerdir.","• Her babın konusu müellif, kendi ifadeleriyle takdim etmekte, görüş ve rivayetleri değerlendirmektedir. Kadı İyaz, yukarıda tanıttığımız üç hadis usûlü eserinden bol bol istifâde etmiş bulunmaktadır.","• Kadı İyaz, hadis öğrenim yollarından olan icâzet'in altı çeşidini açıkladıktan sonra bu kısmı kendisinin ilk kez ortaya koyduğunu belirtmektedir. Eseri tahkik eden Sakr da Kadı'yı bu noktada başarılı görmekte ve verdiği bilgiler dolayısıyla takdir etmektedir. İbn Hacer de el-îlma' için \"kitâbun latif değerlendirmesini yapmakta, kitapta birçok konunun bulunmamasını da \"küçük hacimli\" olmasına bağlamaktadır.","• Usûl konularının belli bir bölümünü incelemiş olmasına rağmen, meselenin Özünü ifâdede gösterdiği başarı, kendisinden sonraki usûl yazarlarını etkilemiştir. İbnu's-Salah, Kadı İyaz'ı taklid ettiğini açıkça söylemekte ve fakat her iktibastan sonra onun adını zikretmemektedir.","• El-îlma' mağribte yazılmış olan ilk hadis usûlü eseridir.","• Üç yazma nüshasından yararlanılarak es-Seyyid Ahmed Sakr'ın tahkiki ile ilk kez Kahire'de 1389/1970 yılında basılmıştır. Detaylı fihristler de ihtiva eden bu baskı oldukça kullanışlıdır.","2. el-Meyancî ve Mâ lâ yese'u'l-muhaddise Cehluh'u Ebû Hafs, Ömer b. Abdülmecîd el-Kuraşî el-Meyancî/ el-Meyyânişî (580/1184)","• Meyyânişî’nin ayrıca Şîrûye b. Şehredâr ed-Deylemî’nin Firdevsü’l-aḫbâr’ı üzerine yazdığı Taʿlîḳāt ʿale’l-Firdevs (Chester Beatty Library, nr. 5169) ve el-İḫtiyâr fi’l-mülaḥ ve’l-aḫbâr (Chester Beatty Library, nr. 4971) adlı eserleri bulunmaktadır.","• Hadis tahammül yolları, mânâ ile hadis rivayetinin cevazı konusu, lahn, kendisinden hadis rivayet edilecek-edilmeyecek kişiler, sahih hadislerin tarifi ve Buharı, Müslim ve Muvatta'da kaç sahih hadis bulunduğu, Hasen, Meşhur, Garîb, Mursel, Mevkuf, Munkatı1 ve Mu'dal hadislerin kısa tarifleri yer almaktadır. 10 sayfalık bir hacme sahip olan bu küçük cüz, \"rivayet ilmini öğrenmek isteyenlerin şevkini artırmak maksadıyla kaleme alınmıştır. Risale, Suphi Sâmerrâî tarafından 1967 yılında Bağdat'ta neşredilmiştir.","• Eser üzerinde Ebû Ca‘fer Ömer b. Abdülmecîd el-Makdisî’nin Îżâḥu Mâ lâ yeseʿu’l-muḥaddis̱ e cehlüh adıyla yaptığı bir şerhten söz edilmektedir","3. İbnu's-Salah ve Ulûmu'l-hadis'i Îbnu's-Salah diye meşhur olan Ebû Amr Takiyyuddin Osman b.Abdirrah-man eş-Şehrizûri eş-Şâfi'î 577/1181 de Şerehan köyünde doğmuştur. Eserleri:","• Ṣıyânetü Ṣaḥîḥi Müslim mine’l-iḫlâli (ḫaleli) ve’l-ġalaṭ ve himâyetühû mine’l-isḳāti ve’s-saḳaṭ. On bölümden meydana gelen eserde Ṣaḥîḥ-i Müslim hakkında genel bilgiler verilmiş, kitaba yöneltilen bazı tenkitler cevaplandırılmış ve Ṣaḥîḥ-i Müslim’in mukaddimesiyle bazı hadislerdeki garîb kelimeler açıklanmıştır.","• Ṭabaḳātü’l-fuḳahâʾi’ş-Şâfiʿiyye.","• Mukaddimetü ibnü’s-Salah","• Tam adı Maʿrifetü envâʿi ʿilmi’l-ḥadîs̱ olup ʿUlûmü’l-ḥadîs̱ ve Aḳṣa’l-emel ve’ş-şevḳ fî ʿulûmi ḥadîs̱ i’r-Resûl diye de bilinen","• Hâkim en-Nîsâbûrî’nin elli iki bölüm halinde ele aldığı hadis konularını altmış beşe çıkarmış ve bu çalışma yazıldığı dönemde usûl-i hadîsin yeniden ihyası olarak kabul edilmiştir.","• İbnü’s-Salâh daha önceki usulcülerin aksine bilgileri senedsiz olarak nakletmiştir.","• Zeynüddin el-Irâkī’nin usûl-i hadîse dair en değerli çalışma kabul ettiği, buna karşılık İbn Hacer el- Askalânî’nin daha önceki eserleri güzel özetlemekle birlikte tertibinin iyi olmadığını söylediği Muḳaddime, sahasında ilk derli toplu eser olduğu için büyük ilgi görmüş, üzerinde şerh, ihtisar, ikmal vb. çalışmalar yapılmıştır. Bu çalışmaların bir kısmı şerh diye anılmakla beraber bunların önemli bir bölümü hâşiye mahiyetindedir.","• İbnu's-Salah, önceki müelliflerin temas etmediği konuları ilk kez belli bir tarife kavuşturmuş, öncekilerin ifâdelerini kendi üslûbu içinde tehzib etmiştir. Karşı çıktığı hususları açıkça belirtmiştir. Genellikle kendi görüşlerine, konuların sonunda \"kültü\" ifadesiyle yer vermiştir. O hemen her konuyu büyük bir ilmî ihtiyat ve tevazu ifâdesi olarak \"Allahu a'lem\" diye bitirmiştir.","• Müellif, ele aldığı konuları misallendirmiş ve uzun uzun anlatım yoluna gitmemiştir. Bu da Ulûmu'l- hadîs'in gerektiğinde ezberlenebilecek bir ders kitabı olarak düşünüldüğünü göstermektedir.","• Yazıldığı günden beri hemen hemen yegâne hadis usûlü kaynağı olarak büyük rağbet görmüş olan Ulûmu'l-hadîs, yazma-basma 5 nüshadan istifade edilerek Nurettin İtr tarafından tahkikli olarak Haleb'te 1386/1966'da yayınlanmıştır.","a. en-Nevevî ve et-Takrîb'i Nevevî (676/1277), Ulûmu'l-hadîs'i önce \"îrşâd\" adıyla ihtisar etmiş sonra bunu da ikinci kez ihtisar ederek et-Takrîb ve't-teysîr li ehâdisi'l-beşîr ve'n-nezîr\" adını vermiştir.","• et-Taḳrîb ve’t-teysîr li(fî)-maʿrifeti süneni’l-beşîri’n-neẕîr. Nevevî, İbnü’s-Salâh’ın Muḳaddime’sinden ihtisar ettiği İrşâdü ṭullâbi’l-ḥaḳāʾiḳ’ı yeterince okunmadığı düşüncesiyle bir defa daha kısaltmış 64 sayfaya indirilmiştir.","• Nevevî'nin ihtisarda gösterdiği başarı ve kendisinin hadis ilmindeki tartışılmaz otoritesi, Takrîb'in başlı başına müstakil bir esermiş gibi Usûl konularında kaynak olarak kullanılması sonucunu vermiştir. Hatta o kadar ki, Suyutî (911/1505) ona Tedribu'r-râvî adıyla daha sonra tanıtacağımız muteber bir şerh yazacaktır.","• Takrîbu'n-Nevevî diye meşhur olan gerek müstakillen gerekse Tedrîb ile birlikte basılmıştır. Takrîb, el-Kirmânî'nin Buhâri şerhi başına da mukaddime olarak konulmuş bulunmaktadır. Takrîb'in şöhreti, aynı müellifin \"lrşâd\"ını unutturmuştur.","b. İbn Kesîr ve İhtisâru Ulûmi'l-hadis'i Ebu'l-Fidâ İmâduddin İsmail b.Kesir 701/1301'de doğmuştur.","Eserleri:","• el-Bidâye ve’n-nihâye, Tefsîrü’l-Ḳurʾâni’l-ʿazîm","• Câmiʿu’l-mesânîd ve’s-süneni’l-hâdî li-aḳvâmi’s-senen (el-Hedy ve’s-senen fî eḥâdîs̱ i’l-mesânîd ve’s-sünen). Eserde, Kütüb-i Sitte ve Ahmed b. Hanbel, Ebû Ya‘lâ el-Mevsılî, Ahmed b. Amr el- Bezzâr’ın müsnedleriyle Taberânî’nin iki mu‘ceminde mevcut hadisler ele alınmış, bu eserlerde rivayeti bulunan sahâbeler alfabetik olarak sıralanıp bütün rivayetleri bir araya getirilmiş, sahâbî ve diğer hadis râvilerinin hayatı hakkında bilgi verilmiştir.","• İhtisâru Ulûmi'l-hadis'i","• Ukaddimenin tertibini bozmadan özetlemiş, dağınık bulduğu konuları bir araya getirmiş, Beyhakî (458/1066)'nin el-Medhal'inden de yararlanarak ihmal edilmiş gördüğü bazı fevâidi de ikmal etmiştir.","• İbn Kesir, İbnu's-Salâh'a çokça itiraz etmiştir. Kendi görüşlerini çok açık bir şekilde ifâde etmiştir.","• İbn Kesir'in bu ihtisarına XX. asrın sünnet hadimlerinden Ahmed Mu-hammed Şâkir (1958) tarafından el-Bâisu'l-hasîs adıyla kısa ve pek değerli bir şerh yazılmıştır. Eser, gerek metin olarak gerekse el-Baisu'l-hasîs ile beraber birkaç kez basılmıştır.","c. İbn Hacer ve Nuhbetü'l-fiker'i 22 Şâban 773’te (28 Şubat 1372) eski Mısır’da doğdu. Adı veya lakabı Hacer olan yedinci dedesine nisbetle İbn Hacer diye meşhur oldu.","• Nuhbetü'l-fiker fî mustalahı ehlil eser","• Nüzhetü'n-nazar fî tavzihi Nuhbeti'l-fiker","• Hacmi küçük, değeri büyük eser, her ne kadar değişik ve geliştirilmiş bir tertibe sahip ise de temelde İbnu's-Salah'm Ulûmu'l-hadîs'inin bir ihtisarıdır. Nitekim kendisi bu durumu şöyle dile getirmektedir:","• Kendisi ihtisar sırasında bazı faydalı ilâveler yapmış ve kendine göre bir şekil vermiştir. Daha sonra, hadis öğrenmeye yeni başlayanlar için zor gelebilecek yerlerini açıklamak, müşkillerini halletmek için bir şerh yazmıştır.","• Nevevî ve İbn Kesir ihtisarlarında İbnu's-Salah'ın tertibine uymuşlardı. İbn Hacer ise, konuların tertibini kendine göre bir sıralamaya tâbi tutmuştur. Bu tertibi Talat Koçyiğit çok beğendiğini söylemiştir.","• Öte yandan ibn Hacer, sadece tertibini değiştirmekle de kalmamış, konuların anlatımı esnasında Îbnu's-Salah'a iîmî itirazlarda da bulunmuştur. Onun küçük hacimli bir ihtisar olmasına rağmen, müstakil bir Usûl eseri gibi rağbet görmüş olması, herhalde tertibi ve ibn Hacer'e ait bu değerlendirmeler sebebiyledir.","• Nuhbe ve şerhi Nüzhetü'n-nazar Prof.Dr.Talat Koçyiğit tarafından \"Hadis Istılahları Hakkında Nuhbetü'l-fiker Şerhi\" adıyla ve faydalı dipnotlar ilâvesiyle tercüme ve neşredilmiştir.","• Özellikle Osmanlı ilim muhitlerinde büyük bir rağbet görmüş ve ders kitabı olarak okutulmuş olan Nuhbetul-fiker ve şerhi Nüzhetun-Nazar üzerinde muhtelif âlimler tarafından şerh, tercüme ve haşiye çalışmaları yapılmıştır.","5. es-Suyûti ve Tedrîbu'r-râvî'si","• İbnu's- Salah'ın Ulûmu'l-hadis'ini bin beyitte anlatmış (\"Elfiye\") olan Suyûti, aynı eserin Nevevî tarafından yapılmış ihtisarına şerh yazmıştır.","• Takrîb'e, mânâlarını yeterince açıklayan, lafızlarını doğru olarak tesbit eden, aslı (\"ülûmu'l-hadîs\") ile arasındaki -fazlalık veya noksanlık kabilinden- görülen farklılıkları ihmal etmeyen, i'tirazları dikkate alan, gerekiyorsa müdâfaa eden ve ona başka yerde toplu halde bulunmayan bir takım mebahis ve fevaidi ekleyen, daha önce kimsenin ortaya koymadığı bir şerhtir.","• Bizzat Suyûti tarafından dile getirilen bu muhtevasından Ötürü Tedrîb, muteber hadis usûlü eserleri arasındaki yerini almış bulunmaktadır.","• Suyûti, \"fevâid\" dediği hadis ilmi ile ilgili tarifler, hadisçiler, Usûl kitapları ve yazarları, ve hadis ilmine ait neviler ile alakalı mülahazalardan oluşan mu-kaddime'den sonra şerhe başlamaktadır.","• Suyûtî, Tedrib'in son kısmına da hadis ilimlerinin nevilerini 65'den 93'e iblağ eden değerlendirmelerini eklemiş bulunmaktadır.","• Tedrîb, Abdulvahhab Abdüllatifin tahkiki ile ilk kez Kahire'de 1379/1959'da basılmıştır.","6. el-Kasımî ve Kava'idü't-tahdis'i Cemâleddin b.Muhammed Said b.Kâsım eî-Kâsımî Şam'da 1282/1866'da doğmuş, orada büyümüş ve öğrenim görmüştür. Mehâsinü’t-teʾvîl adında tefsiri vardır.","Kava'idu't-tahdîs min fünûni mustalahı'l-hadîs:","• Müellif, on bölüm halinde kaleme aldığı eserin girişinde tanınmış şahsiyetlerin gelecek nesiller için kitap yazmasının önemi konusundaki görüşlerini açıklamakta, kitaplarda nakledilen fikirlerin kaynağını zikretmenin önemi üzerinde durmakta, İbn Hacer el-Askalânî’ye dayanarak başlangıçtan itibaren usûl-i hadîse dair eser yazanların çalışmalarını tanıtmaktadır.","• el-Kâsımî, hadis usûlü ile ilgili her konuyu en iyi işlemiş olan müelliflerden seçme parça ve bölümler nakletmek suretiyle Kavâidu't-tahdîs'i oluşturmuştur. Müellifin şahsî fikrine rastlamak hemen hemen mümkün değildir. Buna rağmen tertib ve seçme (\"intihab\")daki başarısı ile muteber hadis usûlü kaynakları arasına girmiştir.","• Fıkhul-hadîs konusunu, etraflıca (yaklaşık 1/3 oranında) inceleyen eser, hadis usûlü ile ilgili mevzulara gayet açık bir şekilde temas etmiş bulunmaktadır.","• Kavaidu't-tahdis, usûl gibi teknik bir konuda dahi iyi bir seçimle orijinal eser ortaya konulabileceğinin delili olmak bakımından ayrıca bir önem taşımaktadır.","7.Tâhir el-Cezâirî ve Tevcih u'n-nazar'ı Tahir b.Salih el-Cezâirî (1268/1852) Şam'da doğmuş dil ve edebiyat âlimi bir zattır. Tefsîrü’l-Ḳurʾân adında Beyzavi haşiyesi vardır.","\"Tevcihu'n-nazar ilâ ilmi'l-eser\" hadis usûlüne dairdir. Tevcihu'n-nazar, muteber hadis usûlü eserlerinin en son yazılanlarından biridir.","Muhtevasında Hâkim en-Neysâbûrî'nin \"Ma'rifetu ulûmi'l-hadis'inin bir özeti de yer alan Tevcihu'n-nazar, müellifin talebesi müsteşrik Goldziher (1921) tarafından Almanca'ya tercüme edilmiştir.","II. Yeni Hadis Usûlü Çalışmaları Cemâleddin el-Kasımî (1332/1914) ile başlayan bu yeni dönem usûl çalışmaları,","• Tahir el-Cezâiri (1338/1920)'nin Tevcihu'n-nazar'ı,","• Abdülaziz el-Hûlî'nin Miftâhu's-sünne ev tarihu funûni'l-hadîs'i","• Muhammed Accac el-Hatîb'in \"es-Sünne kable't-tedvîn'i,","• Ebû Zehv'in el-Hadis ve'l-muhad-disûn'u,","• Mustafa Sıbâî'nin \"es-Sünhe ve mekânetühâ fi't-teşri'i'l-isîâmî'si,","• Suphi Salih'in Ulûmu'l-hadîs ve mustalahuh'u","• Muhammed es-Semâhi'nin el-Menhecu'î-hadis fi ulûmi'l-hadîs'i,","• Abdülhayy el-Leknevî'nin Zafru’l-Emani ve diğer hadis ilimleri ile ilgili eserleri","• Abdulfettah Ebû Gudde tarafından yapılan tahkikleri,","• Ahmed Muhammed Şâkir'in çalışmaları,","• Nureddin İtr'in Menhecu'n-nakd fî ulûmi'l-hadîs'i, Mu'cemu'l-mustalahâtı'l-hadisiyye\"si gibi değerli edebiyata kavuşmuş bulunmaktadır.","• Nâsıruddin el-Albânî, Yusuf el-Uş ve Mustafa el-A'zamî gibi daha birçok müellifin ilmî gayretleri sürmektedir.","Hadis usûlü çalışmaları Türkiye'de, ciddî şekilde Ahmed Naim (1934) Bey'in Tecrid Tercemesi'ne yazdığı gerçekten kıymetli mukaddime ile başlamıştır.","Ahmed Naim Bey, usûl konularını daha önce tanıttığımız usûl edebiyatından en çok Nuhbetu'l-fiker'e benzerlik gösteren bir tertib içinde 58 ana başlık altında, klasik Usûl edebiyatında bulunmayan konuları (\"metodolojiden bir bahis\" gibi...), asrın münakaşa ettiği noktaları da ilâve ederek kendine has güzel bir Osmanlı Türkçesi ile dile getirmektedir.","Ahmed Naim'in bu çalışmasının çok rahatlıkla, şimdiye kadar kaleme alınmış Türkçe hadis usûlü eserlerinin muhteva açısından en zengini olduğunu söyleyebiliriz. Tecrid Mukaddimesi'nin iyi anlaşılması, hadis usûlüne dair temel noktaların kavranmasına yetecektir.","Ahmed Naim Bey'den sonra Türkçe Hadis Usûlü çalışmalarının \"kaynak\" değeri taşıyan eseri, \"Bazı Hadis Meseleleri Üzerinde Tetkikler\"dir. Merhum Prof.Dr.Tayyib Okiç Bey'in \"hayat eseri\" denebilecek kitap, ele aldığı konular hakkında verdiği zengin bibliyografya ile bilhassa dikkat çekmektedir. Daha sonra, genellikle ders kitabı ihtiyacını karşılamak maksadıyla Usûl eserleri kaleme alınmıştır. Bu arada özellikle zikredilmesi gerekli olan bir eser de Prof.Dr.Fuad Sezgin'in Buhârî'nin Kaynakları adlı araştırmasıdır. Usûl eseri olmamasına rağmen konusu gereği hadis ilminin başlangıç dönemine ait pek önemli meselelere temas etmiş olması ve bilhassa konu etrafındaki müsteşrik ididalârım çürütmesi açısından önem arzetmektedir, ilmî araştırmalara örnek niteliktedir.","Özellikle son yıllarda İlahiyat Fakültelerinde yapılan ve yapılmakta olan tezler, hadis usûlü ve ilimleri sahasında Türkçe çalışmaların seviyesini ve sayısının yükseldiğini göstermektedir. Hadis tarihi ve edebiyatına dâir yayınların giderek artış göstermesi ve hadîs kaynaklarının -başarılı olmayan tercümelerle de olsa- Türkçe'ye kazandırılması herhalde özel konulara yönelik ciddi araştırmaları da peşinden getirecektir."],"tefsirUsul":["Tefsir Usulü Eserleri","1. Haris el-Muhâsibî (öl.243/857), el-Akl ve Fehmu'l-Kur'ân. Yapılan araştırmalar, birden çok Kur'ân ilmini bir araya toplayıcı mahiyette kaleme alınan bu eserin sahasında yazılan ilk eser olduğunu ortaya koymaktadır. Hüseyin Kuvvetli tarafından tahkik edilerek \"Dâru'l-fikr\" yayınevi tarafından neşredilen söz konusu eser 245 sayfadan ibaret olup, belli başlı usûl konularını ihtiva etmektedir. Bunlar, Kur'ân'ın faziletleri, üslûbu, muhkem-müteşâbih, nesih ve halku'l-Kur'ân gibi konulardan ibarettir.","2. el-Hûfî (öl.430/1038), el-Burhân fî Ulûmi'l-Kur'ân. Ali b. İbrahim b. Sa'îd el-Hûfî tarafından yazılan bu eser, görebildiğimiz kadarıyla \"ulûmu'l- Kur'ân\" tâbirinin ilk olarak kullanıldığı eserdir. Subhî es-Sâlih1[2] ve ez-Zerkânî2[3] gibi bazı araştırmacıların belirttiğine göre, bu eser esasen 30 cilt olarak kaleme alınmış, ancak günümüze yalnızca 15 cildi yazma olarak ulaşabilmiştir. Bunlar da Kahire, Dâru'l-kütüb, No: 59 da kayıtlı bulunmaktadır. Otuz cilt olduğu söylenen bu eser bizim kanaatimize göre, zaman zaman İcâzu'l-Kur'ân, Garîbu'l-Kur'ân, İ'râbu'l-Kur'ân gibi ilimlere yer veren bir Kur'ân tefsiri olmalıdır. Çünkü usûl konusundaki bilgilerin bu kadar geniş bir hacim oluşturması mümkün değildir.","3. İbnu'l-Cevzî (öl.597/1200), Fünûnu'l-Efnân. Tefsir usûlü ilminin önemli eserlerinden birisidir. Çünkü onda usûlün önemli konuları büyük bir titizlikle ele alınmıştır. Eser iki ana bölüm ve otuz başlıktan oluşmaktadır. Birinci bölümde mushaf bilgileri yanında, müteşâbih, müşkil, nâsih-mensûh, garîbu'l-Kur'ân, el-vücûh ve'n- nezâir gibi Kur'ân ilimleri ve tefsirle ilgili bilgiler verilmiş, ikinci bölümde ise dil kuralları incelenmiştir.","kaleme alındığı günden beri ilim erbabının büyük ölçüde istifade ettiği bu eserin yazma bir nüshası Köprülü Kütüphanesi 208 numarada kayıtlıdır. Bu nüsha, VII. asırda nesih hattıyla kaleme alınmış 225 varaklık bir kitaptır. Ancak Hasan Ziyâuddîn Itr tarafından edisyon kıritiği yapılarak 1408/1987 senesinde Beyrut'ta neşredilmiştir.","4. et-Tûfî (öl.716/1316), el-İksîr fî İlmi't-Tefsîr. Tam adı Süleyman b. Abdu'I-Kâvî et-Tûfî olan müellif bu eserinde daha ziyade meânî ve beyân ilimleri üzerinde durmuştur. İçine aldığı konular arasında, Kur'ân'ın ihtiva ettiği ilimler, Kur'ân'ın üslûbu, müfred ve mürekkep lafızlar, meânî, fesahat ve belagat, beyân ilminin türleri gibi konuları saymak mümkündür. el-İksîr, Abdulkadir Hüseyn tarafından tahkik edilip 1977 yılında Kahire'de basılmıştır. Tek ciltlik bir eserdir.","5. İbn Teymiyye (öl.728/1327), Mukaddime fî Usûli't-Tefsîr. İbn Teymiyye'nin bu eseri, sadece tefsir tarihiyle ilgili değerli bilgiler verir. Söz konusu eser altı bölümden oluşmaktadır. Bunlar:","a. Hz. Peygamber'in Kur'ân'a dair açıklamaları,","b. Sahabe ve selef âlimlerinin tefsirdeki tercihleri,","c. Tefsirde nakle ve istidlal yollarına dayalı ihtilâflar,","d. İstidlal yollarına dayalı ihtilâfların beyânı,","e. Kur'ân'ı Kerîm'i doğru tefsir etmenin yöntemi,","f. Tabiilerin görüşlerine dayanarak Kur'ân'ı tefsir etme meselesi. Dımaşk'ta 1355/1936 yılında tab edilen bu Mukaddime, Harun Ünal tarafından 'Tefsir Üzerine\" ismiyle 1985’de Türkçe'ye çevrilmiştir.","6. ez-Zerkeşî (öl.794/1392), el-Burhân fî Ulûmi'l-Kur'ân. Müellif, söz konusu kitabın mukaddimesinde, kendisinden önceki âlimlerin, Kur'ân ilimlerinin bütün konularını bir araya toplayıcı mahiyette kapsamlı eserler kaleme almadıklarından söz ederek, kendisinin ihtiyaca cevap vermek üzere bu kitabı yazdığını ifade etmektedir. ez-Zerkeşî, söz konusu eserini \"nev\"' adını verdiği 47 bölüm olarak ele alıp, önemli gördüğü her bir Kur'ân ilmini müstakil bir bölümde ve oldukça ayrıntılı bir şekilde incelemeye çalışmıştır. Genellikle her bölümün giriş kısmında, daha önce aynı konuda yazılmış önemli eserler hakkında da kısa bilgiler vermiştir. Ayrıca ez-Zerkeşî bu eserinde sık sık, \"fasıl\" (veya fasıla), \"fâide\", \"tenbih\", \"mesele\" gibi yan başlıklar kullanmıştır. Fakat bunların çoğunda konu adına yer vermemiştir. Bu yüzden söz konusu kitabın naşiri köşeli parantez içinde verdiği birtakım başlıklarla bu eksikliği gidermeye çalışmıştır3[4]. Burada şuna da işaret edelim ki, bu eserde en geniş yer, Kur'ân'ın üslûp özellikleri, ulûmu'l-Kur'ân, Kur'ân'daki harf ve edatlar için ayrılan bölümlere tahsis edilmiştir. el-Burhân, muhtevasındaki zenginlik, üslûbundaki letafet, kaynakların çokluğu ve konuların işleniş tarzı bakımından, tefsir usûlü sahasında kaleme alınan eserler içerisinde ilk sırayı almaktadır. Birçok baskısı bulunan söz konusu eser, Muhammed Ebu'l-Fadl İbrahim tarafından tahkik edilerek dört cilt halinde neşredilmiş, böylece araştırmacıların fayadalanacağı, inceleme, araştırma ve karşılaştırma yapabilecekleri en elverişli hale getirilmiştir.","7. el-Kâfiyecî (öl.879/1478), et-Teysîr fî Kavâidi İlmi't-Tefsir. Muhammed b. Süleyman el-Kâfiyecî, Türklerin İslâm âlimleri arasında kendisiyle iftihar edebilecekleri kudretli bir ilim adamıdır. Süyûtî’nin de hocası olan el-Kâfiyeci, söz konusu eserini iki bölüm olarak kaleme almıştır. Birinci bölümde tefsir ve te'vil kavramları üzerinde durmuş, ardından dirayet tefsirinin hükmü, müfessirin muhtaç olduğu ilimler, tefsire duyulan ihtiyacın sebepleri, muhkem-müteşâbih, lafzın delâleti ve nüzul sebepleri gibi konuları ele almıştır.","İkinci bölümde ise, Kur'ân lafızlarının delâlet ettiği anlam zenginliği, nesih meselesi, müşkilu'l-Kur'ân gibi konular yanında sahabe tefsirinden başlanmak suretiyle kısaca tefsir tarihine de yer verilmiştir. Söz konusu eser, İsmail Cerrahoğlu tarafından tercüme edilerek metin-tercüme bir arada 1974 senesinde Ankara'da neşredilmiştir,","8. es-Suyûtî (öl.911/1505), el-İtkân fî Ulûmi'l-Kur'ân. Muhteva bakımından oldukça zengin olan bu eserin tertibi kendi zamanındaki alışılagelmiş usullere uygundur. Müellif, söz konusu kitabının mukaddimesinde böyle bir eserin zaruretine daha öğrenci iken inandığını dile getirerek, konuyla ilgili ilk eserini, hocası Muhyiddin el- Kâfiyeci (öl.879/1478)'nin yukarıda sözünü ettğimiz \"et-Teysîr fî kavâidi ilmi't-tefsır\" adlı eseriyle, Celâlu'd-dîn el-Bulkînî (öl.824/1421)'nin \"Mevâkiu'l-Ulûm min mevâkii'n-nücûm\" adıyla te'lif etmiş olduğu eseri gördükten sonra \"et-Tahbîr fî ulûmi't-tefsir\" ismiyle kaleme aldığını ifade etmektedir4[5]. Ancak kısa bir zaman sonra ez-Zerkeşî'nin \"el-Burhân fî ulûmi'l- Kur'ân\" ına muttali olup onu inceleyince, daha önce yazdığı eserin yetersiz olduğu kanaatine varmış olmalı ki, bu incelemenin ardından \"el-İtkân\" ı yazmaya başlamıştır. Bu yüzden müellif, el-Burhân'dan çok iktibasda bulunmuştur. Hatta onun metodunu bile aynen uygulamaya çalışarak ele aldığı konularla ilgili yazılan müstakil eserlere de yer vermiştir. Böylece bir anlamda tefsir usûlü tarihini de yer yer kitabında işlemiştir. es-Suyûtî, naklettiği bilgileri rivayetlerle desteklemeye gayret etmiş bazen de ele aldığı görüşleri bizzat kaynak göstererek kuvvetlendirmeye çalışmıştır. Ekseriya konularda ayrıntılara girmekle birlikte bazen de son derece kısa tuttuğu göze çarpmaktadır. İki ciltten oluşan bu eser, tefsir usûlü sahasına ilgi duyanlar için el-Burhân'dan sonra önemli bir kaynaktır. Bu özelliğinden dolayıdır ki, Sakıp Yıldız ve Hüseyin Avni Çelik \"Kur'ân ilimleri Ansiklopedisi\" adı altında onu Türkçeye tercüme ederek 1987 yılında İstanbul'da neşretmişlerdir.","9. ed-Dihlevî (öl.1176/1764), el-Fevzu'l-Kebîr fî Usûli't-Tefsîr. Şah Veliyyullah ed-Dihlevî'nin söz konusu eseri, beş bölümden oluşmaktadır. Bunlar şöyle sıralanabilir:","a. Kur'ân ilimleri ve sapık mezheplerle mücâdele metodları,","b. Garîbul-Kur'ân, nâsih-mensûh, muhkem-müteşâbih,","c. Kur'ân'ın üslûbu ve icazı,","d. Tefsir çeşitleri ve vehbî ilimlerin Kur'ân'ın anlaşılmasmdaki rolü.","e. Genel bilgiler. Muhtasar bir kaynak olan el-Fevzü'l-kebîr, Mehmet Sofuoğlu tarafından Türkçe'ye çevrilerek 1982 tarihinde İstanbul'da yayımlanmıştır.","10. ez-Zerkânî (öl.1367/1948), Menâhilu'l-İrfân fî Ulûmi'l-Kur'ân. Menâhil, esas itibariyle Mısır Üniversitesi Usûlü'd-dîn Fakültesi öğrencileri için bir ders kitabı olarak kaleme alınmıştır. Ancak ilk olarak 1943 senesinde yayımlandıktan sonra müellif tarafından üzerinde yeniden çalışılarak, bilimsel araştırma yapma durumunda olan kimselerin akademik düzeydeki ihtiyaçlarını karşılayacak seviyeye getirilmiştir. Kur'ân tarihi ve önemli görülen bazı Kur'ân ilimlerinin ele alındığı bu eser, her fırsatta ilimle din arasındaki ilgiyi tesbit etmeye, İslâm hukukunun bir takım sır ve hikmetlerini açıklamaya, irşâd ve davet açısından Kur'ân'ın mesajını gözler önüne sermeye çalışmaktadır. Eserin, kendinden önce yazılanlardan farklı sayılabilecek iki özelliğinden biri, ele aldığı konuları ayrıntılara inerek anlatması, diğeri de birtakım muhtemel şüphe ve itirazlara yer vererek onları, yerine göre naklî yerine göre de aklî delillerle cevaplandırmasıdır. Söz konusu eser iki ciltten ibarettir ve birden çok baskısı yapılmıştır.","11. ez-Zehebî (öl.1399/1978), et-Tefsîr ve'l-Müfessirûn. Muhammed Hüseyn ez-Zehebî'nin bu eseri iki ciltten meydana gelmektedir. Birinci ciltte Hz. Peygamber, ashâb ve tabunun tefsirdeki yeri ele alınarak bazı meşhur müfessirlerin hayatları anlatılmış ve tefsirlerinden örnekler verilmiştir. Bu ciltte ayrıca tefsirin tedvin ve te'lif dönemine yer verilmek suretiyle rivayet ve dirayet tefsirinin özellikleri ele alınmış, bunların içerisinden örnek olarak seçilen bir kısım tefsirler geniş bir biçimde tanıtılmıştır. Söz konusu eserin ikinci cildinde de, ağırlıklı olarak Şia, İmamiyye, Bâtıniyye, Bâbiyye, Bahâiyye, Zeydiyye ve Havâric gibi bir kısım mezheplerin kendi eğilimleri doğrultusunda yazmış oldukları tefsirleri, mutasavvifenin tefsirleri için de bir bahis açılarak işârî tefsir ekolü incelenmiştir. Ayrıca filozofların ve fakihlerin tefsirlerine de yer verilerek bu tefsirlerle ilgili olarak bir takım tesbitlerde bulunulmuştur.","İkinci ciltte ele alman konulardan biri de, ilmî tefsir hareketidir. Bu hareket hakkında bilgi verildikten sonra temsilcileri Muhammed Abduh, Reşid Rızâ ve Mustafa el-Merâğî'nin tefsirleri de oldukça geniş bir tenkid ve tahlile tabi tutulmuştur. et-Tefsîr ve'l-müfessirûn, 1396/1976 senesinde Mısır'da yayımlanmıştır.","12. Subhî es-Sâlih (öl.1399/1978), Mebâhis fî Ulumi'l-Kur'ân. Müellif bu eserinde vahiy, Kur'ân'ın cemi, istinsahı ve el-ahrufu's-seb'a gibi konuları inceleyerek Kur'ân tarihine, ardından da esbâbu'n-nüzûl, ilmu'l-Mekkî ve'l-Medenî, fevâtihu's-suver, kıraat, nâsih ve mensûh, resmu'l-Kur'ân, muhkem-müteşâbih gibi konulan ele alarak Kur'ân ilimlerine yer vermiştir. Mebâhis de ayrıca tefsir usûlünün önemli bir bölümü olan tefsir tarihi üzerinde de durularak, ilk dönemlerden itibaren tefsirin geçirdiği merhaleler, rivayet ve dirayet sahasında yazılan tefsirler söz konusu edilmiştir. Mezhebî, işârî, ilmî, içtimaî ve edebî tefsirler hakkında geniş bilgi verildikten sonra da, Kur'ân'ın icazı ve Kur'ân'da yer alan edebî sanatlar üzerinde durulmuştur. Burada şunu da ifade edelim ki, bu eser kendi alanında yazılmış eserlerden farklı bir görünüm arzetmektedir. Mebâhis’i diğer usûl kitaplarından ayıran en önemli faktör, tarihi konuları işlerken müellifin, müsteşriklerin görüşlerine de yer verip zaman zaman onları tenkide tâbi tutmasıdır. 1985 senesinde Beyrut'ta basılan söz konusu kitap, M. Sait Şimşek tarafından \"Kur'ân ilimleri\" adıyla Türkçe'ye tercüme edilmiştir.","13. Mennâu'l-Kattân, Mebâhis fî Ulûmi'l-Kur'ân. Subhî es-Sâlih'in \"mebâhis\" i gibi bu kitap da Kur'ân tarihi, Kur'ân ilimleri ve tefsir tarihi gibi tefsir usûlü ilminin üç temel konusunu ele alıp genişçe inceleyen bir eserdir. İbaresinin kolaylığı ve üslûbunun akıcılığı nedeniyle özellikle İlahiyat Fakültesi öğrencilerinin istifade edebileceği önemli bir kaynaktır. 1407/1986 senesinde Beyrut'ta neşredilmiştir.","14. Ebû Şuhbe, el-Medhal li Dirâseti'l-Kur''âni'l-Kerîm. el-Medhal, ulûmu'l-Kur'ân'ın anlamı, tarihi, tedvini gibi konular yanında, Kur'ân-ı Kerîm'in nüzulü, vahiy, esbâbu'n-nüzûl, yedi harf, Kur'ân'ın Hz. Ebû Bekr zamanında cem'i, Hz. Osman devrinde istinsahı, resmü'l-Mushaf ve Kur'ân nassınm sübûtu gibi konuları genişçe işleyen bir eserdir. Kahire'de 1973 senesinde basılmıştır.","Mübhemâtü’l-Kur’ân:","1. Abdurrahman b. Abdullah es-Süheylî (ö. 581/1185), et-Taʿrîf ve’l-iʿlâm fîmâ (bimâ) übhime mine’l-esmâʾ ve’l-aʿlâm fi’l-Ḳurʾân. Mushaf tertibinin esas alındığı kitapta mübhem kelimelerin delâletleri gösterilmiş, yer yer hadislerden de faydalanılmıştır.","2. Bedreddin İbn Cemâa, et-Tibyân fî (li-) mübhemâti’l-Ḳurʾân. Müellif, bu eserini ihtisar ederek Ġurerü’t-Tibyân li-mübhemâti’l-Ḳurʾân’ı telif etmiştir.","3.Celâleddin es-Süyûtî, Müfhimâtü’l-aḳrân fî mübhemâti’l-Ḳurʾân. Konuyla ilgili en yaygın kitap özelliğini korumakta olup birçok baskısı yapılmıştır","Garibu’lKuran","1.Muhammed b. Uzeyz es-Sicistânî’nin Nüzhetü’l-ḳulûb","2.Râgıb el-İsfahânî’nin el-Müfredât fî ġarîbi’l-Ḳurʾân"]};
</script>
<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/\b(el|er|es|et|ed|ez|en|eş|ş|li|bi)-/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const vText = r => r.v ? (/^\d+$/.test(r.v) ? `ö. ${r.v}${r.vm ? '/' + r.vm : ''}` : r.v) : '';
const ALAN_SIRA = ['Fıkıh','Fıkıh Usulü','Hadis','Hadis Usulü','Tefsir',"Kur'an İlimleri",'Kelam','Mezhepler','Tasavvuf','Diğer'];

/* ---------- kalıcı durum (tarayıcıda) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ema_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ema_' + k, JSON.stringify(v)); } catch {} }
};
let stats = store.get('stats', {});       // id -> {ok, bad}
let boxes = store.get('boxes', {});       // id -> leitner kutusu 1..5
let oral  = store.get('oral', {});        // soru index -> 1 bildim / 0 bilemedim
let secili = store.get('alanlar', []);    // filtre
function record(id, ok) {
  const s = stats[id] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[id] = s; store.set('stats', stats);
}

/* ---------- veri hazırlığı ---------- */
const byAlan = {}; ESERLER.forEach(r => (byAlan[r.a] ||= []).push(r));
const alanlar = ALAN_SIRA.filter(a => byAlan[a]);
const muellifEserleri = {}; ESERLER.forEach(r => (muellifEserleri[r.m] ||= []).push(r));
const titleCount = {}; ESERLER.forEach(r => { const k = norm(r.e); titleCount[k] = (titleCount[k] || 0) + 1; });
const havuz = () => secili.length ? ESERLER.filter(r => secili.includes(r.a)) : ESERLER;
const soruHavuz = () => secili.length ? SORULAR.map((q, i) => ({...q, i})).filter(q => secili.includes(q.alan)) : SORULAR.map((q, i) => ({...q, i}));
const eserEtiket = r => titleCount[norm(r.e)] > 1 ? `${r.e} <span style="color:var(--muted);font-weight:400">(${esc(r.s || r.a)})</span>` : esc(r.e);

/* ---------- yönlendirme ---------- */
/* Tarayıcı geçmişi: telefonda geri kaydırma ve Android geri tuşu bir önceki ekrana döner */
const VIEWS = () => ({home, quiz, match, flash, oralView, browse, progress, study, unitView});
let curView = 'home', curArg = null;
const navStack = [{ view: 'home', arg: null }];
function render(view, arg) {
  curView = view; curArg = arg ?? null;
  $('#backBtn').classList.toggle('hide', view === 'home');
  $('#backBtn').innerHTML = '←<span class="lg"> Geri</span>';
  window.scrollTo(0, 0);
  VIEWS()[view](arg ?? undefined);
}
function go(view, arg) {
  const d = (history.state && history.state.d) || 0;
  const st = { view, arg: arg === undefined ? null : arg };
  // testten çıkarken testi geçmişte bırakma (geri gelince yeni test başlamasın)
  if (curView === 'quiz' && view !== 'quiz') { st.d = d; navStack[d] = st; try { history.replaceState(st, ''); } catch (e) {} }
  else { st.d = d + 1; navStack.length = d + 1; navStack.push(st); try { history.pushState(st, ''); } catch (e) {} }
  render(view, arg);
}
// Üst ekrana dön: geçmişte varsa oraya geri git (geri kaydırmayla uyumlu), yoksa yeni aç
function goUp(view, arg = null) {
  const d = (history.state && history.state.d) || 0, key = JSON.stringify(arg);
  for (let k = d - 1; k >= 0; k--) {
    const e = navStack[k];
    if (e && e.view === view && JSON.stringify(e.arg ?? null) === key) { history.go(k - d); return; }
  }
  go(view, arg ?? undefined);
}
function goBack() {
  if (curView === 'unitView') goUp('study');
  else if (curView === 'quiz' && curArg && curArg.unit !== undefined) goUp('unitView', curArg.unit);
  else goUp('home');
}
window.addEventListener('popstate', e => {
  if (repModal.classList.contains('open')) { repModal.classList.remove('open'); return; }
  const st = e.state || { view: 'home', arg: null };
  if (st.modal) { history.back(); return; }
  render(st.view, st.arg);
});

/* ---------- ana sayfa ---------- */
function home() {
  const n = havuz().length, q = soruHavuz().length;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const oran = tot.ok + tot.bad ? Math.round(100 * tot.ok / (tot.ok + tot.bad)) + '%' : '—';
  $('#app').innerHTML = `
  <section class="hero">
    <h1>İslami İlimler Literatürü</h1>
    <p class="lead">İhtisas, Eğitim Görevlisi Ve Müftülük Sınavlarına Hazırlık İçin Eser–Müellif Çalışma Aracı.</p>
    <div class="stats">
      <div class="stat"><b>${ESERLER.length}</b><span>eser</span></div>
      <div class="stat"><b>${Object.keys(muellifEserleri).length}</b><span>müellif</span></div>
      <div class="stat"><b>${SORULAR.length}</b><span>sözlü soru</span></div>
      <div class="stat"><b>${oran}</b><span>başarı oranın</span></div>
    </div>
  </section>
  <details class="how" id="how" ${store.get('howClosed', false) ? '' : 'open'} ontoggle="store.set('howClosed', !this.open)">
    <summary>Nasıl çalışır?</summary>
    <ol class="steps">
      <li><b>Alanını seç.</b> Aşağıdaki “Çalışılacak alanlar” bölümünden çalışmak istediğin alanlara dokun. Hiçbirini seçmezsen bütün alanlar dahil olur. Seçimin bütün bölümlerde geçerlidir.</li>

}
const modeCard = (v, i, t, d) => `<button class="mode" onclick="go('${v}')"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></button>`;
function setAlan(a) {
  if (a === null) secili = []; else secili = secili.includes(a) ? secili.filter(x => x !== a) : [...secili, a];
  store.set('alanlar', secili); home();
}

/* ---------- soru üretici ---------- */
function makeQuestion(r) {
  const yon = Math.random() < 0.6 ? 'eser' : 'muellif';
  if (yon === 'eser' || titleCount[norm(r.e)] > 1) {
    // "X kimin eseridir?" — aynı başlıklı eseri olan müellifler çeldirici olamaz
    const yasak = new Set(ESERLER.filter(x => norm(x.e) === norm(r.e)).map(x => x.m));
    let aday = [...new Set(ESERLER.filter(x => x.a === r.a && x.s === r.s && !yasak.has(x.m)).map(x => x.m))];
    if (aday.length < 3) aday = [...new Set([...aday, ...ESERLER.filter(x => x.a === r.a && !yasak.has(x.m)).map(x => x.m)])];
    if (aday.length < 3) aday = [...new Set([...aday, ...ESERLER.filter(x => !yasak.has(x.m)).map(x => x.m)])];
    const yanlis = pick(aday, 3);
    return { r, tip: 'eser', soru: `<em>${eserEtiket(r)}</em> adlı eser kime aittir?`,
      secenek: shuffle([r.m, ...yanlis]), dogru: r.m };
  }
  // "Y'nin eseri hangisidir?" — Y'nin eserlerine benzeyen ya da birden fazla müellifte geçen başlıklar çeldirici olamaz
  const k2 = t => norm(t).split(' ').slice(0, 2).join(' ');
  const kendi = new Set((muellifEserleri[r.m]).flatMap(x => [norm(x.e), k2(x.e)]));
  const uygun = x => x.m !== r.m && titleCount[norm(x.e)] === 1 && !kendi.has(norm(x.e)) && !kendi.has(k2(x.e));
  let aday = ESERLER.filter(x => x.a === r.a && x.s === r.s && uygun(x));
  if (aday.length < 3) aday = aday.concat(ESERLER.filter(x => x.a === r.a && uygun(x)));
  if (aday.length < 3) aday = aday.concat(ESERLER.filter(uygun));
  const goruldu = new Set(); const yanlis = [];
  for (const x of shuffle(aday)) { const k = norm(x.e); if (!goruldu.has(k)) { goruldu.add(k); yanlis.push(x.e); } if (yanlis.length === 3) break; }
  return { r, tip: 'muellif', soru: `Aşağıdakilerden hangisi <em>${esc(r.m)}</em> tarafından yazılmıştır?`,
    secenek: shuffle([r.e, ...yanlis]), dogru: r.e };
}
// zayıf eserlere ağırlık ver
function weightedPick(list, n) {
  const w = list.map(r => { const s = stats[r.id]; return s ? 1 + s.bad * 2 - Math.min(s.ok, 3) * 0.25 : 1.5; });
  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let t = 0; w.forEach((x, i) => { if (!used.has(i)) t += Math.max(x, .2); });
    let rnd = Math.random() * t;
    for (let i = 0; i < list.length; i++) { if (used.has(i)) continue; rnd -= Math.max(w[i], .2); if (rnd <= 0) { used.add(i); out.push(list[i]); break; } }
  }
  return out;
}

/* ---------- test ---------- */
let Q = null;
function quiz(opts = {}) {
  const kaynak = opts.ids ? ESERLER.filter(r => opts.ids.includes(r.id)) : havuz();
  const adet = opts.adet || 10;
  Q = { list: weightedPick(kaynak, adet).map(makeQuestion), i: 0, dogru: 0, yanlislar: [], unit: opts.unit };
  renderQ();
}
function renderQ() {
  const q = Q.list[Q.i];
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * Q.i / Q.list.length}%"></i></div><span class="count">${Q.i + 1} / ${Q.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">${esc(q.r.a)}${q.r.s ? ' · ' + esc(q.r.s) : ''}</span><button class="rep" data-e="${q.r.id}" title="Bu kayıttaki bir hatayı bildir" onclick="event.stopPropagation();openReport('e',${q.r.id})">⚑ Bildir</button></div>
    <div class="q">${q.soru}</div>
    <div class="opts">${q.secenek.map((s, i) => `<button class="opt" data-v="${esc(s)}" onclick="answer(this)"><span class="k">${'ABCD'[i]}</span><span>${esc(s)}</span></button>`).join('')}</div>
    <div class="explain" id="exp"></div>
    <div class="actions"><button class="btn" id="next" disabled onclick="nextQ()">${Q.i + 1 < Q.list.length ? 'Sonraki →' : 'Sonucu gör'}</button></div>
  </div>`;
}
function answer(el) {
  const q = Q.list[Q.i], ok = el.dataset.v === q.dogru;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === q.dogru) b.classList.add('ok'); });
  if (!ok) el.classList.add('bad');
  ok ? Q.dogru++ : Q.yanlislar.push(q.r);
  record(q.r.id, ok);
  const r = q.r, digerleri = (muellifEserleri[r.m] || []).filter(x => x.id !== r.id).slice(0, 4).map(x => x.e);
  $('#exp').innerHTML = `<b>${ok ? 'Doğru.' : 'Yanlış.'}</b> <i>${esc(r.e)}</i> — ${esc(r.m)}${r.v ? ` (${vText(r)})` : ''}. ${esc(r.n)}${digerleri.length ? `<br><span style="color:var(--muted)">Müellifin diğer eserleri: ${digerleri.map(esc).join(', ')}</span>` : ''}`;
  $('#exp').classList.add('show');
  $('#next').disabled = false; $('#next').focus();
}
function nextQ() { Q.i++; Q.i < Q.list.length ? renderQ() : quizEnd(); }
function quizEnd() {
  if (Q.unit !== undefined) return unitQuizEnd();
  const n = Q.list.length, p = Math.round(100 * Q.dogru / n);
  $('#app').innerHTML = `
  <div class="card result" style="margin-top:24px">
    <div class="big">${Q.dogru}/${n}</div>
    <p class="lead">%${p} başarı · ${p >= 80 ? 'Çok iyi gidiyorsun.' : p >= 50 ? 'Fena değil, yanlışları tekrar et.' : 'Bu alana biraz daha çalışmak gerekiyor.'}</p>
    ${Q.yanlislar.length ? `<div class="list" style="text-align:left;margin-top:18px">${Q.yanlislar.map(rowHTML).join('')}</div>` : ''}
    <div class="actions" style="justify-content:center">
      ${Q.yanlislar.length ? `<button class="btn sec" onclick="quiz({ids:[${Q.yanlislar.map(r => r.id)}],adet:${Q.yanlislar.length}})">Yanlışları tekrar et</button>` : ''}
      <button class="btn" onclick="quiz()">Yeni test</button>
    </div>
  </div>`;
}

/* ---------- eşleştirme ---------- */
let M = null;
function match() {
  const list = []; const mu = new Set(), ti = new Set();
  for (const r of weightedPick(havuz(), 40)) { if (mu.has(r.m) || ti.has(norm(r.e))) continue; mu.add(r.m); ti.add(norm(r.e)); list.push(r); if (list.length === 5) break; }
  M = { list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now() };
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <div class="card">
    <div class="match">
      <div class="col"><h4>Eser</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''} ${M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${eserEtiket(r)}</button>`).join('')}</div>
      <div class="col"><h4>Müellif</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${esc(r.m)}</button>`).join('')}</div>
    </div>
    <p class="lead" style="font-size:.85rem;margin-top:12px">Önce soldan bir eser, sonra sağdan müellifini seç.</p>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  const r = ESERLER[M.sel];
  if (id === M.sel || ESERLER[id].m === r.m) { M.done.add(M.sel); record(M.sel, true); M.sel = null;
    if (M.done.size === M.list.length) return mEnd(); renderM();
  } else { M.hata++; record(M.sel, false); const el = $('#mr' + id); el.classList.add('wrong'); setTimeout(() => renderM(), 350); }
}
function mEnd() {
  const s = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${s} sn</div>
    <p class="lead">${M.hata ? M.hata + ' hata ile tamamladın.' : 'Hatasız tamamladın!'}</p>
    <div class="list" style="text-align:left;margin-top:16px">${M.list.map(rowHTML).join('')}</div>
    <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

/* ---------- bilgi kartları (Leitner) ---------- */
let F = null;
function flash() {
  const list = havuz();
  // önce düşük kutular; aynı kutudakiler karışık
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);
  F = { list: shuffle(sirali), i: 0, bildim: 0 };
  renderF();
}
function renderF() {
  const r = F.list[F.i], kutu = boxes[r.id] || 0;
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" id="fc" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">${esc(r.a)}${r.s ? ' · ' + esc(r.s) : ''}</span><div class="t">${esc(r.e)}</div><div class="s">Müellifi kim?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>
    <div class="face back"><div class="t">${esc(r.m)}</div><div class="s">${r.v ? vText(r) + ' · ' : ''}${esc(r.n)}</div></div>
  </div></div>
  <div class="actions" style="justify-content:center">
    <button class="btn red" onclick="fAns(false)">Bilemedim</button>
    <button class="btn" onclick="fAns(true)">Bildim</button>
  </div>
  <div style="text-align:center;margin-top:10px"><button class="rep" data-e="${r.id}" title="Bu kayıttaki bir hatayı bildir" onclick="event.stopPropagation();openReport('e',${r.id})">⚑ Bildir</button></div>`;
}
function fAns(ok) {
  const r = F.list[F.i];
  boxes[r.id] = ok ? Math.min((boxes[r.id] || 0) + 1, 5) : 1; store.set('boxes', boxes);
  record(r.id, ok); if (ok) F.bildim++;
  F.i++;
  if (F.i < F.list.length) renderF();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${F.bildim}/${F.list.length}</div><p class="lead">Kart destesi bitti. Bilemediklerin bir sonraki destede önce gelecek.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="flash()">Yeni deste</button></div></div>`;
}

/* ---------- sözlü mülakat ---------- */
let O = null;
function oralView() {

  if (!list.length) { $('#app').innerHTML = `<p class="empty">Seçili alanlarda sözlü soru yok.</p>`; return; }

}
function renderO() {
  const q = O.list[O.i], d = oral[q.i];
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * O.i / O.list.length}%"></i></div><span class="count">${O.i + 1} / ${O.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">${esc(q.alan)}${q.alt ? ' · ' + esc(q.alt) : ''}${d === 1 ? ' · daha önce bildin' : d === 0 ? ' · daha önce bilemedin' : ''}</span><button class="rep" data-s="${q.i}" title="Bu sorudaki bir hatayı bildir" onclick="openReport('s',${q.i})">⚑ Bildir</button></div>
    <div class="q">${esc(q.soru)}</div>

/* ---------- ara ve göz at ---------- */
const rowHTML = r => `<div class="row"><button class="rep" data-e="${r.id}" title="Bu kayıttaki bir hatayı bildir" onclick="event.stopPropagation();openReport('e',${r.id})">⚑ Bildir</button><div class="e">${esc(r.e)}<span class="p">${esc(r.a)}${r.s ? ' · ' + esc(r.s) : ''}</span></div><div class="m">${esc(r.m)} <small>${vText(r)}</small></div>${r.n ? `<div class="n">${esc(r.n)}</div>` : ''}</div>`;
function browse() {
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Ara ve göz at</h2>
  <div class="rowctl" style="margin-bottom:10px">
    <input class="search" id="s" placeholder="Eser, müellif ya da not ara… (ör. Hidâye, Nesefî, şerhi)" oninput="doSearch()" style="flex:1;min-width:220px">
    <select class="select" id="sort" onchange="doSearch()"><option value="a">Alana göre</option><option value="v">Vefat tarihine göre</option><option value="m">Müellife göre</option></select>
  </div>

}
function doSearch() {
  const t = norm($('#s').value), so = $('#sort').value;

/* ---------- ilerleme ---------- */
function progress() {
  const satir = alanlar.map(a => {
    let ok = 0, bad = 0; byAlan[a].forEach(r => { const s = stats[r.id]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span>${esc(a)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const zayif = Object.entries(stats).filter(([, s]) => s.bad > 0).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 15).map(([id]) => ESERLER[id]).filter(Boolean);
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Sözlü sorular: ${oralN} / ${SORULAR.length} çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="weak">${zayif.map(rowHTML).join('')}</div>
    <div class="actions"><button class="btn" onclick="quiz({ids:[${zayif.map(r => r.id)}],adet:${zayif.length}})">Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {}; store.set('units', uStat); store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); progress();
}

/* ---------- çalış: ünite ünite öğrenme yolu ---------- */
let uStat = store.get('units', {});   // ünite index -> en iyi mini test sonucu (0-5)
const GECME = 4;
const uDone = () => UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
function study() {
  const gruplar = {}; UNITELER.forEach((u, i) => (gruplar[u.alan] ||= []).push(i));
  const goster = Object.keys(gruplar).filter(a => !secili.length || secili.includes(a));
  const ilkEksik = UNITELER.findIndex((u, i) => (uStat[i] || 0) < GECME && goster.includes(u.alan));
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Çalış</h2>
  <p class="lead">Her ünitede önce konu anlatımını oku, sonra ${GECME}/5 ile geçilen mini testi çöz. Geçtiğin üniteler ✓ alır.</p>
  ${ilkEksik >= 0 ? `<div class="actions" style="justify-content:flex-start"><button class="btn" onclick="go('unitView',${ilkEksik})">Kaldığım yerden devam et →</button></div>` : ''}
  ${goster.map(a => {
    const ix = gruplar[a], d = ix.filter(i => (uStat[i] || 0) >= GECME).length;
    return `<div class="ahead"><h3>${esc(a)}</h3><span class="count">${d}/${ix.length}</span></div>
    <div class="ulist">${ix.map(i => { const u = UNITELER[i], ok = (uStat[i] || 0) >= GECME;
      return `<button class="unit ${ok ? 'done' : i === ilkEksik ? 'next' : ''}" onclick="go('unitView',${i})"><span class="st">${ok ? '✓' : ix.indexOf(i) + 1}</span><span class="ut"><b>${esc(u.t)}</b><small>${u.q.length} konu · ${u.ids.length} eser${uStat[i] !== undefined ? ` · en iyi: ${uStat[i]}/5` : ''}</small></span><span style="color:var(--muted)">›</span></button>`; }).join('')}</div>`;
  }).join('')}`;
}
const NARR_BASLIK = { hadisUsul: 'Hadis usulü eserleri ayrıntılı tanıtım', tefsirUsul: 'Tefsir usulü eserleri ayrıntılı tanıtım' };
function fmtPara(p) {
  p = esc(p).replace(/([:.)])\s+o\s+/g, '$1<br>◦ ');
  const m = p.match(/^\(?\s*(Mülakat[^:]{0,30}|Not|NOT|Önemli Not|İpucu)\s*:\s*/);
  if (m) return `<div class="tipbox"><b>${m[1].replace(/^NOT$/, 'Not')}</b>${p.slice(m[0].length).replace(/\)\s*$/, '')}</div>`;
  const bold = t => t.replace(/^([^:<]{2,45}):\s/, '<b>$1:</b> ');
  if (/^•\s/.test(p)) return `<p class="li">${bold(p.slice(2))}</p>`;
  const n = p.match(/^(\d+|[a-eA-E])[.)]\s*/);
  if (n) { const r = p.slice(n[0].length); return `<p class="li num"><span class="nn">${n[1]}.</span>${r.length < 60 && !r.includes(':') ? `<b>${r}</b>` : bold(r)}</p>`; }
  return `<p>${bold(p)}</p>`;
}
function unitView(i) {
  const u = UNITELER[i], ok = (uStat[i] || 0) >= GECME;
  const uzun = u.q.filter(qi => SORULAR[qi].cevap.join(' ').length >= 90);
  const kisa = u.q.filter(qi => SORULAR[qi].cevap.join(' ').length < 90);
  const kelime = u.q.reduce((t, qi) => t + SORULAR[qi].cevap.join(' ').split(/\s+/).length, 0);
  $('#app').innerHTML = `
  <button class="backlink" onclick="goUp('study')">‹ Ünitelere dön</button>
  <div class="bar" style="margin-top:6px"><span class="count">${esc(u.alan)} · Ünite ${i + 1}/${UNITELER.length} · yaklaşık ${Math.max(2, Math.round(kelime / 180))} dk okuma</span><div class="spacer"></div>${ok ? '<span class="tag" style="margin:0;background:var(--green-soft);color:var(--green)">✓ Tamamlandı</span>' : ''}</div>
  <h2>${esc(u.t)}</h2>
  <p class="intro">${esc(u.intro)}</p>
  <div class="lesson">
    ${uzun.map((qi, k) => { const q = SORULAR[qi];
      return `<section class="ls"><h3><span class="no">${k + 1}</span>${esc(q.soru)}<button class="rep" data-s="${qi}" title="Bu bölümdeki bir hatayı bildir" onclick="openReport('s',${qi})">⚑</button></h3>${q.cevap.map(fmtPara).join('')}</section>`; }).join('')}
  </div>
  ${kisa.length ? `<div class="section-title">Kısa bilgiler</div><div class="quick">${kisa.map(qi => `<div class="qk"><span>${esc(SORULAR[qi].soru)}</span><b>${esc(SORULAR[qi].cevap.join(' '))}</b></div>`).join('')}</div>` : ''}
  ${u.narr ? `<details class="oq" style="margin-top:18px"><summary>Ek okuma: ${NARR_BASLIK[u.narr]}</summary><div class="lesson" style="margin-top:8px">${NARR[u.narr].map(fmtPara).join('')}</div><p class="count" style="margin-top:8px">Kaynak: Servet Hayma, Literatür Çalışması</p></details>` : ''}
  <details class="oq" style="margin-top:12px"><summary>Bu ünitenin eser–müellif tablosu (${u.ids.length} eser)</summary>
    <div class="study-list" style="margin-top:10px">${u.ids.map(id => { const r = ESERLER[id];
      return `<div class="srow"><div class="e">${esc(r.e)}</div><div class="v">${vText(r)}</div><div class="m">${esc(r.m)}</div>${r.n ? `<div class="n">${esc(r.n)}</div>` : ''}</div>`; }).join('')}</div></details>
  <p class="count" style="margin-top:14px">Kaynak: Servet Hayma & Coşkun Çekinmez, Eser-Müellif (İhtisas sözlü sınavına hazırlık)</p>
  <div class="sticky-go"><button class="btn" onclick="go('quiz',{ids:[${u.ids}],adet:5,unit:${i}})">Okudum, mini teste geç →</button></div>`;
}
function unitQuizEnd() {
  const i = Q.unit, n = Q.list.length, gecti = Q.dogru >= GECME;
  uStat[i] = Math.max(uStat[i] || 0, Q.dogru); store.set('units', uStat);
  const sonraki = i + 1 < UNITELER.length ? i + 1 : null;
  $('#app').innerHTML = `
  <div class="card result" style="margin-top:24px">
    <div class="big">${Q.dogru}/${n}</div>
    <p class="lead">${gecti ? '✓ Üniteyi tamamladın.' : `Geçmek için en az ${GECME} doğru gerekiyor. Üniteyi bir kez daha okuyup tekrar dene.`}</p>
    ${Q.yanlislar.length ? `<div class="list" style="text-align:left;margin-top:18px">${Q.yanlislar.map(rowHTML).join('')}</div>` : ''}
    <div class="actions" style="justify-content:center">
      <button class="btn sec" onclick="go('study')">Ünite listesi</button>
      <button class="btn sec" onclick="go('unitView',${i})">Üniteye dön</button>
      ${gecti && sonraki !== null ? `<button class="btn" onclick="go('unitView',${sonraki})">Sonraki ünite →</button>` : `<button class="btn" onclick="go('quiz',{ids:[${UNITELER[i].ids}],adet:5,unit:${i}})">Tekrar dene</button>`}
    </div>
  </div>`;
}

/* ---------- hata bildirimi (Muhtâr ile aynı sistem) ---------- */
const MAIL = 'alpkiraymehmet@gmail.com';
const RTYPES_E = ['Müellif yanlış (eser başkasına ait)', 'Vefat tarihi yanlış', 'Eser ya da müellif adının yazımı hatalı', 'Açıklama / not hatalı', 'Soru veya şıklar hatalı', 'Diğer'];
const RTYPES_S = ['Cevap yanlış ya da eksik', 'Cevap metni bozuk / karışık', 'Soru hatalı', 'Yazım hatası', 'Diğer'];
const repModal = $('#repModal'), repBox = $('#repBox'), btnReports = $('#btnReports');
const getList = () => store.get('reports', []);
const setList = l => { store.set('reports', l); syncReports(); };
function syncReports() { const n = getList().length; btnReports.classList.toggle('has', n > 0); btnReports.innerHTML = `⚑<span class="lg"> Bildirimlerim</span> (${n})`; }
function locOf(kind, id) {
  if (kind === 'e') { const r = ESERLER[id]; return { kind, id, yer: `${r.a}${r.s ? ' / ' + r.s : ''}`, baslik: `${r.e} – ${r.m}${r.v ? ' (' + vText(r) + ')' : ''}` }; }
  const q = SORULAR[id]; return { kind, id, yer: `Sözlü · ${q.alan}${q.alt ? ' / ' + q.alt : ''}`, baslik: q.soru };
}
const subj = r => `[Atlas Hata] ${r.kind === 'e' ? 'Eser #' + r.id : 'Sozlu soru #' + r.id}`;
const TR = {'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u','Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U','Â':'A','Î':'I','Û':'U'};
const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
const plain2 = t => t.split('\n').map(plain).join('\n');
const bodyOne = r => `Yer: ${plain(r.yer)}\nKayit: ${plain(r.baslik)}\nKayit no: ${r.kind === 'e' ? 'E' : 'S'}${r.id}\nHata turu: ${plain(r.type)}\nNot: ${plain(r.note) || '-'}`;
const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(plain2(bo))).replace(/%0A/g, '%0D%0A')}`;
const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
function copyText(t, msgEl) {
  const done = () => { msgEl.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, () => fallback()); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msgEl.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); }
}
function openModal(html) { repBox.innerHTML = html; if (!repModal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, { modal: true }), ''); } catch (e) {} } repModal.classList.add('open'); const f = repBox.querySelector('input,textarea,button'); f && f.focus(); }
function closeModal() { if (history.state && history.state.modal) history.back(); else repModal.classList.remove('open'); }
repModal.addEventListener('click', e => { if (e.target === repModal || e.target.closest('[data-x="close"]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && repModal.classList.contains('open')) closeModal(); });
function markReported() {
  const l = getList();
  document.querySelectorAll('.rep').forEach(b => {
    const k = b.dataset.e !== undefined ? 'e' : 's', id = +(b.dataset.e ?? b.dataset.s);
    b.classList.toggle('on', l.some(x => x.kind === k && x.id === id));
  });
}
new MutationObserver(markReported).observe($('#app'), { childList: true });
function openReport(kind, id) {
  const r = locOf(kind, id), T = kind === 'e' ? RTYPES_E : RTYPES_S;
  openModal(`<h3 id="repTitle">Hata bildir</h3>
    <div class="loc">${esc(r.yer)}</div>
    <div class="qbox">${esc(r.baslik)}</div>
    ${T.map((t, i) => `<label class="t"><input type="radio" name="rt" value="${i}" ${i === 0 ? 'checked' : ''}> ${esc(t)}</label>`).join('')}
    <textarea id="rnote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
    <div class="mbtns">
      <button class="pri" data-a="mail">E-posta ile gönder</button>
      <a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a>
      <button data-a="copy">Metni kopyala</button>
      <button data-a="add">Listeye ekle</button>
      <button data-x="close">Kapat</button>
    </div>
    <div class="ok" id="rmsg" aria-live="polite"></div>
    <div class="hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
  const get = () => Object.assign({}, r, { type: T[+repBox.querySelector('input[name=rt]:checked').value], note: repBox.querySelector('#rnote').value.trim() });
  const msg = repBox.querySelector('#rmsg');
  repBox.querySelector('[data-a=mail]').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(bodyOne(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), bodyOne(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
  repBox.querySelector('[data-a=gmail]').onclick = function () { const x = get(); this.href = gmail(subj(x), bodyOne(x)); };
  repBox.querySelector('[data-a=copy]').onclick = () => { copyText(bodyOne(get()), msg); };
  repBox.querySelector('[data-a=add]').onclick = () => { const l = getList(); l.push(get()); setList(l); markReported(); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
}
function openList() {
  const l = getList();
  const su = `[Atlas Hata] Toplu bildirim (${l.length} hata)`;
  const bo = l.map((r, i) => `--- ${i + 1} ---\n${bodyOne(r)}`).join('\n\n');
  openModal(`<h3 id="repTitle">Bildirimlerim (${l.length})</h3>
    ${l.length ? `<ul class="rlist">${l.map((r, i) => `<li><div><b>${esc(r.baslik.slice(0, 90))}</b><br><small>${esc(r.yer)} · ${esc(r.type)}${r.note ? ' — ' + esc(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
    <div class="mbtns">
      ${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}
      <button data-x="close">Kapat</button>
    </div>
    <div class="ok" id="rmsg" aria-live="polite"></div>
    <div class="hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
  const msg = repBox.querySelector('#rmsg');
  repBox.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { const L = getList(); L.splice(+x.dataset.del, 1); setList(L); markReported(); openList(); });
  const q = a => repBox.querySelector(`[data-a=${a}]`);
  if (!l.length) return;
  q('mail').onclick = () => { const u = mailto(su, bo); if (u.length > 1900) msg.textContent = `Liste uzun; e-posta uygulaması metni kesebilir. Kesilirse “Gmail'de aç” veya “Metni kopyala”yı kullan.`; location.href = u; };
  q('gmail').href = gmail(su, bo);
  q('copy').onclick = () => copyText(bo, msg);
  q('clear').onclick = () => { setList([]); markReported(); openList(); };
}
syncReports();

try { history.replaceState({ view: 'home', arg: null, d: 0 }, ''); } catch (e) {}
render('home');
</script>
