<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eser–Müellif Atlası</title>
<meta name="description" content="İhtisas, eğitim görevlisi ve müftülük sınavları için İslami ilimler literatürü çalışma aracı.">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;font-size:1rem}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.3rem;margin:4px 0 18px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* flash */
.flash{perspective:1200px;min-height:260px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--muted);font-size:.9rem;margin-top:10px;max-width:520px}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
/* oral */
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.answer p{margin:0 0 8px}
/* browse */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem}
.row .m{color:var(--green);font-weight:600}
.row .m small{color:var(--muted);font-weight:400}
.row .n{color:var(--muted);font-size:.88rem;margin-top:4px}
.row .p{font-size:.72rem;color:#7a5c1e;background:var(--gold-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.empty{color:var(--muted);text-align:center;padding:30px}
/* progress page */
.meter{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
.meter .progress{height:10px}
.weak{display:grid;gap:8px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.rep{border:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--sans);font-size:.72rem;padding:2px 8px;border-radius:999px;cursor:pointer;opacity:.7;white-space:nowrap}
.rep:hover,.rep:focus{opacity:1;border-color:var(--line)}
.rep.on{opacity:1;color:var(--red);border-color:var(--red)}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.row{position:relative}.row .rep{position:absolute;top:8px;right:8px}
.row .e{padding-right:70px}
#btnReports{display:none}
#btnReports.has{display:inline-flex;color:var(--red);border-color:var(--red)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px;font-size:.9rem;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 4px;font-size:1.05rem}
.mbox .loc{color:var(--muted);font-size:.8rem;margin-bottom:8px}
.mbox .qbox{background:var(--paper);border-radius:8px;padding:8px 10px;margin:6px 0 10px}
.mbox label.t{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.mbox textarea{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink);font:inherit;box-sizing:border-box}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mbtns button,.mbtns a{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 11px;font:inherit;font-size:.84rem;cursor:pointer;text-decoration:none}
.mbtns .pri{background:var(--green);color:#fff;border-color:var(--green)}
.mbox .hint{color:var(--muted);font-size:.76rem;margin-top:10px}
.mbox .ok{color:var(--green-2);font-size:.82rem;margin-top:8px;min-height:1em}
.rlist{margin:8px 0;padding:0;list-style:none}
.rlist li{border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin:6px 0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.rlist li small{color:var(--muted)}
.rlist li button{border:0;background:none;color:var(--muted)}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.ahead{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 8px}
.ahead h3{font-size:1.1rem;color:var(--green)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:.95rem}
.tipbox b{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.study-list{display:grid;gap:8px;margin-top:6px}
.srow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.srow .e{font-family:var(--serif);font-weight:700;font-size:1.05rem}
.srow .m{color:var(--green);font-weight:600}
.srow .v{color:var(--muted);font-size:.85rem;grid-row:1;grid-column:2;white-space:nowrap}
.srow .n{grid-column:1/-1;color:var(--muted);font-size:.9rem;margin-top:2px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
details.oq p{margin:8px 0 0;font-size:.93rem}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h3 .rep{margin-left:auto;flex:none}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.6}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px}.lesson p.num:before{content:none}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson p b{color:var(--green)}
.lesson .tipbox{margin:10px 0}
.quick{display:grid;gap:6px}
.qk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.92rem;display:grid;gap:2px}
.qk span{color:var(--muted)}.qk b{color:var(--green)}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.how .steps b{color:var(--ink)}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.hide{display:none!important}
@media (max-width:560px){
  .brand{white-space:nowrap;font-size:1.02rem}.lg{display:none}

  h1{font-size:1.4rem}.q{font-size:1.15rem}.card{padding:16px}
  .meter{grid-template-columns:100px 1fr 44px}
  .tile{font-size:.86rem;padding:9px 10px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')"><span class="mark" title="Tarak tamga"><svg viewBox="24 22 152 96" width="22" height="14" aria-hidden="true" fill="currentColor"><rect x="45" y="33" width="112" height="12"/><rect x="45" y="33" width="12" height="62"/><rect x="28" y="80" width="29" height="15"/><rect x="145" y="33" width="12" height="62"/><rect x="145" y="80" width="27" height="15"/><rect x="97" y="33" width="13" height="70"/><rect x="77" y="97" width="53" height="15"/></svg></span><span class="bt">Eser–Müellif Atlası</span></button>
  <div class="spacer"></div>
  <button class="ghost" id="btnReports" title="Listeye eklediğin hata bildirimleri" onclick="openList()">Bildirimlerim</button>
  <button class="ghost hide" id="backBtn" onclick="goBack()">←<span class="lg"> Ana sayfa</span></button>
</div></header>

<main class="wrap" id="app"></main>
<div class="modal" id="repModal" role="dialog" aria-modal="true" aria-labelledby="repTitle"><div class="mbox" id="repBox"></div></div>
<div class="sig"><span>© 2026 Her hakkı saklıdır</span><i>·</i><span>Designed by: <b>M.ALPKİRAY</b></span></div>

const SORULAR = [{"alan":"Fıkıh","alt":"Hanefî","soru":"Ebû Hanîfe’nin fıkhî metodolojisi ve temel eserleri nelerdir?","cevap":["Ebû Hanîfe, fıkhı \"Kişinin lehinde ve aleyhinde olanı bilmesidir\" şeklinde tanımlar. Re'y ekolünün (Kûfe) temsilcisidir. Eserlerini bizzat yazmaktan ziyade talebelerine yazdırmış veya sözlü nakletmiştir.","1. el-Fıkhü’l-Ekber: Mezhebin en temel akide metnidir. Akaid ve kelâma dair en meşhur eseridir.","2. el-Fıkhü’l-Ebsat: Oğlu Hammâd ve talebeleri aracılığıyla nakledilen kelâmî görüşleridir. Akaid konularını soru-cevap tarzında işler","3. el-Âlim ve’l-Müteallim: İtikadi konuları soru-cevap şeklinde işleyen eseridir.Dinî konularda talebesiyle yaptığı münazaraları içerir.","4. er-Risâle: Osman el-Bettî’ye yazdığı, iman ve amel konularını işleyen mektubudur. Ehl-i adalet ve Ehl-i sünnet savunması mahiyetindedir.","5. el-Vasiyye: Akaid ilkelerini bir vasiyetname şeklinde özetler.","(Mülakat Notu: Bu eserler İmam Mâtürîdî öncesi Mâtürîdiyye düşüncesinin temelidir.)"]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Fıkhu’l-Ekber’in içeriği ve önemi nedir ve neden “Fıkıh” denildi?","cevap":["Ebu Hanife’ye nispet edilen en eski akaid metnidir. Allah’ın sıfatları (zâtîsubûtî), kader, kabir azabı, şefaat ve rüyetullah gibi konuları \"selef üslubuyla\" (te'vile kaçmadan) maddeler halinde açıklar.","Ebu Hanife döneminde “fıkıh” terimi sadece namaz, oruç gibi ibadetleri değil, “dinin özünü ve esaslarını bilmek” (el-fıkhü fi’d-dîn) anlamında kullanılıyordu. İnanç konuları dinin temeli olduğu için buna “en büyük fıkıh” (Fıkhu’l-Ekber) denmiştir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"İmam-ı Azam Ebû Hanîfe’nin ilmi silsilesini ve en meşhur talebelerini sayınız.","cevap":["Ebû Hanîfe, Kûfe merkezli re'y ekolünün temsilcisidir.","Hocaları: Hammâd b. Ebî Süleyman > İbrahim en-Nehaî > Alkame b. Kays > Abdullah b. Mes’ud (r.a.).","Talebeleri: Ebû Yûsuf, İmam Muhammed eş-Şeybânî, İmam Züfer ve Hasan b. Ziyâd."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Ebû Hanîfe, Mâtürîdî midir?","cevap":["Hayır, kronolojik olarak bu mümkün değildir. Ebû Hanîfe (ö. 150) vefat ettiğinde İmam Mâtürîdî henüz doğmamıştı. Ancak İmam Mâtürîdî, Ebû Hanîfe’nin itikadi görüşlerini sistemleştiren kişidir. Dolayısıyla Mâtürîdîlik, Ebû Hanîfe’nin Fıkh-ı Ekber’de ortaya koyduğu esasların kelâmî bir ekol haline gelmiş şeklidir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî mezhebi hakkında bilgi veriniz.","cevap":["İmamı: Ebû Hanîfe Nu’mân b. Sâbit (ö. 150).","Metodu: \"Re’y\" ekolünün temsilcisidir. İstihsanı çokça kullanır. Hüküm çıkarmada kıyas ve örfe büyük önem verir. \"Fukahâ Meclisi\" (talebeleriyle istişare) yoluyla sistemleşmiştir.","Bölge: Türkiye, Balkanlar, Orta Asya, Hindistan, Pakistan."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî mezhebinde \"Zâhiru’r-Rivâye\" (asıl rivayetler) denilince hangi alimin altı eseri kastedilir?","cevap":["Hanefî mezhebinin sistemleşmesini sağlayan ve \"Zâhirü'r-Rivâye\" (mezhebin en güvenilir kaynakları) olarak bilinen 6 temel kitabı İmam Muhammed eşŞeybânî'ye aittir","1. el-Asl (el-Mebsût): Mezhebin en hacimli ilk fıkıh kitabıdır.","2. ez-Ziyâdât: el-Asl'a ek olarak yazılan meseleler.","3. el-Câmiu’l-Kebîr: Teknik ve zor fıkıh meselelerini içerir.","4. el-Câmiu’s-Sağîr: Ebû Yûsuf kanalıyla İmam-ı Azam'dan nakledilen temel meseleler.","5. es-Siyeru’l-Kebîr: İslam devletler hukuku ve savaş hukukunun temelidir.","6. es-Siyeru’s-Sağîr: Devletler hukukuna dair daha muhtasar eserdir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Nâdiru’r-Rivâye Nedir?","cevap":["Mezhep imamlarından gelen ancak Zâhiru’r-Rivâye kitapları kadar meşhur ve kesin yollarla nakledilmeyen görüşlerdir.","1. İmam Muhammed b. Hasan eş-Şeybânî’nin Diğer Eserleri İmam Muhammed’in temel altı kitabı (el-Asl, el-Câmiu’s-Sağîr vb.) dışındaki bazı eserleri bu kategoridedir:","el-Keysâniyyât: İmam Muhammed’in öğrencisi Şuayb b. Süleyman elKeysânî tarafından rivayet edilmiştir.","el-Hârûniyyât: Halife Harun Reşid zamanında kaleme alındığı için bu ismi almıştır.","el-Cürcâniyyât: Ali b. Sâlih el-Cürcânî tarafından rivayet edilen meselelerdir.","er-Rakkiyyât: İmam Muhammed’in Rakka’da kadılık yaptığı dönemde verdiği fetvaları içerir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"İmam Ebu Yusuf’un eserleri nelerdir?","cevap":["➢ Hanefi mezhebinin kurucu imamlarından olan Ebu Yusuf’un eserleri şunlardır:","Kitâbü’l-Harâc: Halife Harun Reşid’in isteği üzerine yazılan, devletin mali yapısını, vergi hukukunu ve toprak yönetimini düzenleyen ilk eserdir.","İhtilâfu İbn Ebî Leylâ: Dönemin kadısı İbn Ebî Leylâ ile olan hukuki ihtilaflarını ele alır.","el-Âsâr: Hocası Ebu Hanife’den naklettiği rivayetleri içerir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî mezhebinde muteber üç (temel) kaynak söyler misiniz?","cevap":["Mezhebin hiyerarşisine göre şunlardır:","1. Zâhirü’r-Rivâye: İmam Muhammed’in altı kitabı.","2. el-Hidâye: Mergınânî (Mütekaddimun ve müteahhirun dönemini bağlayan ana metin).","3. Mütûn-u Erbaa: (Mecmaul Bayreyn, Kenz, Muhtâr, Vikāye)."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî literatüründe \"Mütûn-u Erbaa\" (Dört Metin) olarak bilinen dört temel eserleri ve müelliflerini sayabilir misiniz?","cevap":["el-Muhtâr - Mevsılî (v. 683) Mecmâu’l-Bahreyn - İbnü’s-Sââtî (v. 694) Kenzü’d-Dekāik - Ebû’l-Berekât en-Nesefî (v. 710) Vikāyetü’r-Rivâye - Tâcü’ş-Şerîa (v. 8. yy)"]},{"alan":"Fıkıh","alt":"Hanefî","soru":"\"Mütûn-u Selâse\" ve \"Mütûn-u Sitte\" nedir?","cevap":["Mütûn-u Selâse: Kudûrî (Muhtasar), Nesefî (Kenz), Mevsılî (Muhtar).","Mütûn-u Sitte: Yukarıdaki dört metne (Mütûn-u Erbaa) ilaveten Kudûrî ve Mergınânî’nin Bidâyetü’l-Mübtedî eserlerinin eklenmesiyle oluşur."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"“Mecmâu’l-Bahreyn” ismi neden bu esere verilmiştir?","cevap":["Müellif İbnü’s-Sââtî, bu eserinde Kudûrî’nin Muhtasar’ı ile Ebû Hafs enNesefî’nin el-Manzûme’sini bir araya getirdiği (iki denizi birleştirdiği) için bu ismi vermiştir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Mevsılî’nin \"el-Muhtâr\" isimli eserini bizzat kendisinin şerh ettiği kitabın adı nedir?","cevap":["el-İhtiyâr."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Mevsılî'nin \"el-İhtiyâr\"ı hakkında bize teknik bilgi verir misiniz?","cevap":["Tam adı el-İhtiyâr li-Ta’lîli’l-Muhtâr’dır. Müellif, önce Ebû Hanîfe’nin görüşlerini esas alan el-Muhtâr adlı metni yazmış, sonra talebelerin isteği üzerine bu metni bizzat kendisi şerh etmiştir. Eserin en bariz özelliği, hükümlerin aklî ve naklî gerekçelerini (ta'lil) çok öz ve anlaşılır bir dille sunmasıdır."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"\"Kenzü’d-Dekāik\" isimli meşhur metin kime aittir ve en bilinen şerhleri hangileridir?","cevap":["Ebü'l-Berekât en-Nesefî'ye aittir. Başlıca şerhleri:","• Tebyînü'l-hakâik – Zeylaî: Delil odaklı ve mukayeseli.","• el-Bahrü'r-râik – İbn Nüceym: Derinlemesine analiz, fer'î mesele zenginliği.","• en-Nehrü'l-fâik – Ömer b. Nüceym: Teknik ve dakik ibare açıklamaları.","• Remzü'l-hakâik – Bedreddin el-Aynî: Muhtasar ve net açıklamalar.","• Ma'denü'l-hakâik – Molla Miskîn: Eğitim ve tedris odaklı, yaygın."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hâkim eş-Şehîd (Mervezî) tarafından Zâhirü’r-Rivâyeden özetlenerek (ihtisar) oluşturulan eser hangisidir?","cevap":["el-Kâfî."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Serahsî’nin, hapisteyken (zindanda) ezberden dikte ettirerek yazdığı ve \"elKâfî\"nin en meşhur şerhi olan 30 ciltlik dev eser hangisidir?","cevap":["el-Mebsût."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî mezhebinin dev eseri el-Mebsût'u Türkçeye kim kazandırmıştır?","cevap":["İmam Serahsî'ye ait bu eseri, Prof. Dr. Mustafa Cevat Akşit başkanlığındaki bir heyet 31 cilt olarak Türkçeye tercüme etmiştir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî mezhebinde \"el-Kitâb\" denilince hangi eser kastedilir ve bu eserin meşhur bir şerhini söyleyebilir misiniz?","cevap":["İmam Kudûrî’ye ait olan el-Muhtasar kastedilir. En meşhur şerhlerinden biri Meydânî’nin kaleme aldığı el-Lübâb’dır. Mezhepte \"el-Kitâb\" mutlak olarak söylendiğinde bu eser kastedilir; çok sade ve güvenilir bir metindir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Lübab (el-Lübâb fî Şerhi’l-Kitâb) nedir, müellifi kimdir?","cevap":["Kudûrî’nin meşhur metni el-Muhtasar üzerine Abdülganî el- Meydânî tarafından yazılmış en popüler şerhlerden biridir. Dili sade, tertibi güzeldir; Medrese eğitiminde başlangıç ve orta seviye için temel kaynaktır. Yazıldığı günden bu yana Hanefî mezhebi özelinde İslam hukuku eğitiminin gözde eserlerinden biri olmuştur. Klasik fıkıh döneminin tüm özelliklerini taşıyan, dört bölümden oluşan muteber bir şerhtir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Burhaneddin el-Merğinânî kimdir ve eseri el-Hidâye neden \"fıkhın anayasası\" kabul edilir?","cevap":["Müellif: Burhaneddin el-Merğinânî (ö. 593/1197), Orta Asya’nın (Fergana bölgesi) yetiştirdiği en büyük Hanefî fakihlerinden biridir.","Kaynağı: Kudûrî’nin Muhtasar'ı ile İmam Muhammed’in el-Câmiu’s-Sağîr'inin birleşimidir.","Eserin Mahiyeti: Tam adı el-Hidâye şerhu Bidâyeti’l-Mübtedî’dir. Müellif, önce kendi yazdığı Bidâyetü’l-Mübtedî adlı muhtasarı şerh etmek için bu dev eseri kaleme almıştır.","Önemi: * Hanefî mezhebinin en muteber metni kabul edilir.","Metodu: Sadece hükümleri vermez; hükümlerin felsefesini, akli ve nakli delillerini (ta’lîl) harika bir üslupla açıklar. Hilafiyat (mezhepler arası görüş ayrılığı) konularına değinir. Ebû Hanîfe, Ebû Yûsuf ve İmam Muhammed’in görüşlerini zikreder; delilleri verir ve en son zikrettiği delil ile tercihini (sahih/esah) belli eder.","Terminolojisi: \"el-Kitâb\" derken Kudûrî'yi kasteder. Akli delil için \"el-fıkhu fîhi kezâ\", nakli delil için \"li-mâ reveynâ\" gibi özel tabirler kullanır.","Şerhleri: Üzerine yüzlerce çalışma yapılmıştır. Mergınânî’nin el-Hidâye’sine yapılan en muteber dört şerh:","1.","Kifâye: Kurlânî.","2.","İnâye: Bâbertî.","3.","Binâye: Aynî.","4.","Fethu’l-Kadîr: İbnü’l-Hümâm (Müçtehid seviyesinde bir şerhtir).","Tahrici: Hidâye’deki hadislerin kaynağını bulmak için Zeylaî tarafından yazılan Nasbü’r-Râye, hadis tekniği açısından bir şaheserdir. (Tahrîc : Bir fıkıh kitabında geçen hadislerin hangi hadis kaynaklarında yer aldığını, senedini ve sıhhat durumunu araştırma ilmidir. Hidâye, Hanefî fıkhının zirvesi olduğu için hadis yönünden çokça incelenmiştir).","Not:\" Hidâye, fıkıh literatüründe öyle bir yere sahiptir ki; medreselerde 'Hidâye okuyan, hidayet bulur' sözü meşhur olmuştur.\" “Mergınânî’nin Hidâye’yi 13 yılda oruçlu olarak yazdığı rivayet edilir.”"]},{"alan":"Fıkıh","alt":"Hanefî","soru":"İbnü’l-Hümâm’ın \"Fethu’l-Kadîr\" eserini diğer Hidâye şerhlerinden ayıran temel fark nedir?","cevap":["İbnü’l-Hümâm bu eserinde mezhep taassubundan uzak durmuş, hadislerin sıhhatini ve delillerin gücünü bizzat inceleyerek bazen Hanefî mezhebinin resmi görüşünden farklı tercihlerde (tercih ve tahric) bulunmuştur."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Merğinânî’nin el-Hidâye’sindeki hadisleri inceleyen (tahrîc eden) en meşhur eserler hangileridir?","cevap":["1. Zeylaî (v. 762) – Nasbü’r-Râye li-Ahâdîsi’l-Hidâye: * Önemi: Bu sahanın \"şah eseridir\". Zeylaî, sadece Hanefî lehine olan hadisleri değil, muhalif mezheplerin delillerini de büyük bir tarafsızlıkla incelemiştir. Hadis ilmiyle ilgilenen herkesin başvuru kaynağıdır.","2. İbn Hacer el-Askalânî (v. 852) – Dirâyetü’l-Hidâye: o Önemi: Şâfiî bir hadis devidir. Zeylaî'nin devasa eserini özetlemiş (ihtisar etmiş) ve kendi değerlendirmelerini eklemiştir.","3. İbnü’l-Hümâm (v. 861) – Fethu’l-Kadîr içinde yapılan tahrîc: o Önemi: Aslında bir şerh olan bu eserde müellif, her meselenin hadislerini tahrîc ederek fıkıh-hadis bütünlüğünü sağlamıştır.","4. Kâsım b. Kutluboğa (v. 879) – Münyetü’l-Elma’: o Önemi: Zeylaî’nin çalışmasına zeyil (ekleme) ve ikmâl mahiyetindedir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Zeylaî’nin Nasbü’r-Râye'si neden bu kadar kıymetlidir?","cevap":["Müellif sadece kendi mezhebinin delillerini savunmakla kalmamış; 'Karşı tarafın (Şâfiî, Mâlikî vb.) delili şudur, senedi şöyledir' diyerek muazzam bir ilmî dürüstlük ve kuşatıcılık sergilemiştir. Bu yüzden hadis metodolojisi derslerinde tahrîc sanatının zirvesi olarak okutulur.\""]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî mezhebinde \"İbn Âbidîn\" olarak meşhur olan alimin, mezhebin en güvenilir fetva kitabı kabul edilen eserinin tam adı nedir?","cevap":["Reddü’l-Muhtâr ale’d-Dürri’l-Muhtâr. Bu eser, Haskefî’nin ed-Dürrü’l-Muhtâr adlı eserinin şerhidir ve Hanefi mezhebinin en son ve en muteber başvuru kaynaklarından biridir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî fıkıh literatüründeki şu silsileyi açıklayabilir misiniz: Tenvîru’l-Ebsâr > ed-Dürrü’l-Muhtâr -> Reddü’l-Muhtâr?","cevap":["Tenvîru’l-Ebsâr: Timurtâşî tarafından yazılan temel metindir.","ed-Dürrü’l-Muhtâr: Haskefî'nin bu metne yazdığı şerhtir.","Reddü’l-Muhtâr: İbn Âbidîn'in Haskefî'ye yazdığı haşiye/şerhtir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Alâeddin es-Semerkandî’nin, Kudûrî’nin Muhtasar’ını esas alarak yazdığı eser hangisidir?","cevap":["Tuhfetü’l-Fukahâ. (Bu eser, Kudûrî'nin sistemini geliştirmiş ve daha sonra Bedâiu’s-Sanâî’ye temel teşkil etmiştir.)"]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Hanefî fıkhının en sistemli ve mantıkî örgüsü en güçlü eseri kabul edilen \"Bedâiu’s-Sanâî\" kime aittir ve neyin şerhidir?","cevap":["Kâsânî'ye aittir. Hocası Semerkandî’nin Tuhfetü’l-Fukahâ isimli eserinin şerhidir."]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Nevâzil türü eserler neyi ifade eder? Örnek veriniz.","cevap":["Tanım: Klasik fıkıh literatüründe (özellikle Hanefî mezhebinde), mezhep imamlarından (Ebû Hanîfe ve talebeleri) nakledilmeyip, daha sonraki müctehidlerin (Mesaîl-i Müctehidîn) kendi dönemlerinde karşılaştıkları yeni meselelere verdikleri fetvaları ve çözümleri içeren eserlerdir.","Örnekler: en-Nevâzil – Ebü’l-Leys es-Semerkandî Mecmûu’n-Nevâzil ve’l-Vâkıât – Nâtıfî el-Vâkıât – Sadru’ş-Şehîd Fetâvâ --İbnü’l-Hümâm el-Fetâvâ el-Kübrâ – İbnü’l-İmâd el-Câmiu’l-Vecîz – el-Kerderî el-Fetâvâ el-Hâniyye (Hulâsatü’l-Fetâvâ) – Kadıhan (Nevâzil literatürünün zirve noktalarından biri kabul edilir) el-Muhîtü’l-Burhânî – Burhâneddîn el-Mâze (Zâhiru’r-Rivâye, Nâdiru’rRivâye ve Nevâzil'i birleştiren devasa bir eserdir"]},{"alan":"Fıkıh","alt":"Hanefî","soru":"Nevâzil veya Vakıât kitapları neden yazıldı?","cevap":["Nevâzil ve Vakıât kitaplarının yazılma amacını en kısa haliyle şu üç noktada toplayabiliriz:","Güncel Sorunlara Cevap: Kurucu imamlardan sonra ortaya çıkan ve daha önce karşılaşılmamış yeni meselelere (nevâzil) çözüm üretmek.","Hukuki Boşlukları Doldurmak: Temel mezhep kaynaklarında (Zâhirü’rrivâye) açık cevabı bulunmayan konuları netleştirmek.","Uygulama Kolaylığı: Kadı ve müftülerin günlük hayattaki somut olaylar (vakıât) karşısında hızla başvurabilecekleri pratik rehberler sunmak. l"]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"İmam Şâfiî’nin \"Kadîm\" ve \"Cedîd\" dönemlerini temsil eden ilmi hayatı ve eserleri hakkında bilgi veriniz.","cevap":["İmam Şâfiî, hem İmam Mâlik’ten hem de İmam Muhammed’den ders alarak iki ekolü sentezlemiştir.","Hocaları: İmam Mâlik, İmam Muhammed, Süfyân b. Uyeyne.","Talebeleri: Ebû Bekir el-Humeydî, Ebû Sevr, İshak b. Râhûye ve İbn Süreyc.","Eserleri: el-Ümm (Fıkıh), er-Risâle (Usul), Ahkâmu’l-Kur’ân, İhtilâfü’l-Hadîs ve Dîvân."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Şâfii mezhebi hakkında bilgi veriniz.","cevap":["İmamı: Muhammed b. İdris eş-Şâfiî (ö. 204).","Metodu: Ehl-i Re’y ile Ehl-i Hadis arasında köprü vazifesi görmüştür. Usul kaidelerini ilk yazılı hale getiren mezheptir. Kıyası ancak nas varsa kabul eder, istihsanı şiddetle reddeder (\"İstihsan yapan şeriat koymuş olur\" der).","Bölge: Mısır, Güney Arabistan, Doğu ve Güneydoğu Anadolu, Endonezya, Malezya."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"İmam Şafii’nin eserlerini ve İslam hukukundaki yerini açıklayınız.","cevap":["İmam Şâfiî, ehl-i hadis ile ehl-i re’y arasında köprü kurmuştur. İmam Şafii, fıkıh usulünü sistemleştiren ilk alimdir. Temel eserleri:","er-Risâle: Usûl-ü fıkıh alanında yazılan ilk sistemli eserdir. Kitap; Kur’an, Sünnet, İcma ve Kıyas’ın delil değerini ve hüküm çıkarma metodolojisini belirler. (Hem Bağdat hem Mısır dönemi usulünü yansıtır).","el-Ümm: İmamın \"Kavl-i Cedîd\" (Mısır dönemi) görüşlerini içeren devasa fıkıh eseridir. Mezhebin ana kaynağıdır.","el-Hücce: İmamın \"Kavl-i Kadîm\" (Bağdat dönemi) görüşlerini içeren, ancak günümüze parçalar halinde ulaşan eseridir.","Ahkâmu’l-Kur’ân: Kur’an’dan çıkan fıkhî hükümleri ele alır (Beyhakî derlemiştir)."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Fıkıh usulü nedir ve ilk eseri hangisidir?","cevap":["Şer’î delillerden fer'î (pratik) hükümleri çıkarmaya yarayan kurallar bütünüdür. İlk müstakil eser İmam Şafii’nin er-Risâle’sidir."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Şafiî mezhebinde Râfiî tarafından kaleme alınan ve İmam Gazzâlî’nin elVecîz’ine şerh olan meşhur eser hangisidir?","cevap":["Fethu’l-Azîz (eş-Şerhu’l-Kebîr)."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"İmam Nevevî’nin, Râfiî’nin el-Muharrer’ini esas alarak yazdığı ve mezhepte üzerine en çok çalışma yapılan temel metin hangisidir?","cevap":["Minhâcü’t-Tâlibîn.","Nevevî’nin Minhâcü’t-Tâlibîn’i mezhebin \"direği\" gibidir. Bu esere yapılan Tuhfetü'l-Muhtâc (İbn Hacer el-Heytemî) ve Nihâyetü'l-Muhtâc (Remlî) şerhleri mezhepteki fetva birliğini sağlar."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Minhâcü’t-Tâlibîn’in üç büyük şerhini ve müelliflerini sayabilir misiniz?","cevap":["1. Tuhfetü’l-Muhtâc - İbn Hacer el-Heytemî(v. 974/1567). (Özellikle Mısır dışındaki Şafiî coğrafyasında (örneğin Dağıstan ve Yemen) çokça itibar edilen şerhi)","2. Muğni’l-Muhtâc - Hatîb eş-Şirbînî(v. 977/1570). (Minhâc’ın ibarelerini en açık şekilde izah eden ve ders kitabı olarak çokça okutulan şerhi)","3. Nihâyetü’l-Muhtâc – Remlî(v. 1004/1596). (Şafiî mezhebinde “İkinci Şâfiî” olarak anılan Şemseddin er-Remlî’nin, Minhâc üzerine yazdığı ve özellikle Mısır bölgesinde fetvaya esas alınan meşhur şerhi)"]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Şafiî mezhebinde \"Şeyhayn\" (Râfiî ve Nevevî) sonrası dönemin en temel Kiss metni kabul edilen ve İmam Nevevî tarafından telif edilen eser hangisidir?","cevap":["Minhâcü’t-Tâlibîn. (Mülakat Notu: Bu eser, Râfiî'nin el-Muharrer isimli eserinin ihtisarıdır ve mezhepte fetva ağırlığı en yüksek metinlerden biridir.)"]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Minhâc şerhleri arasında bir ihtilaf olduğunda hangi eserlerin görüşü öncelenir?","cevap":["Genellikle Tuhfetü’l-Muhtâc (İbn Hacer el-Heytemî) ve Nihâyetü’l-Muhtâc (Remlî) arasındaki ittifak mezhebin kesin görüşü sayılır. İhtilaf halinde ise bazı bölgeler İbn Hacer'i, bazıları (özellikle Mısır) Remlî'yi tercih eder."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Bu üç müellifin (Heytemî, Şirbînî, Remlî) ortak özelliği nedir?","cevap":["Üçü de 10. hicri yüzyıl alimleridir ve Şafiî mezhebinin \"müteahhirûn\" (son dönem) literatürünün zirvesini temsil ederler"]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"İmam Nevevî’nin Şafiî mezhebindeki yeri nedir ve görseldeki \"Ravzatü’tTâlibîn\" neyin ihtisarıdır?","cevap":["İmam Nevevî, mezhebi yeniden düzenleyen (muhakkik) bir alimdir. Ravzatü’tTâlibîn, Râfiî’nin eş-Şerhu’l-Kebîr (Fethu’l-Azîz) isimli eserinin bir muhtasarı/özetidir."]},{"alan":"Fıkıh","alt":"Şâfiî","soru":"Bir Şafiî olarak bir meselede hangi güncel ve klasik kaynaklara başvurursunuz?","cevap":["Klasik başvuru kaynakları:","• Kurucu metinler: el-Ümm – İmam Şâfiî (mezhebin ana kaynağı, kavl-i cedîd dönemini temsil eder); er-Risâle – İmam Şâfiî (İslam hukuk tarihindeki ilk usul kitabı).","• Temel muhtasarlar: Minhâcü't-tâlibîn – Nevevî (mezhepte fetvaya esas olan görüşlerin merkezi); el-Gāye ve't-takrîb – Ebû Şücâ (eğitimde en meşhur başlangıç metni).","• Büyük şerhler: el-Mecmû' – Nevevî (delilleriyle en geniş kaynak, mukayeseli fıkhın zirvesi); Muğni'l-muhtâc – Hatîb eş-Şirbînî (Minhâc'ın en açık ve sistematik şerhlerinden).","• Nihai kaynaklar: Tuhfetü'l-muhtâc – İbn Hacer el-Heytemî (Hicaz ve Dağıstan'da mezhebin son sözü); Nihâyetü'l-muhtâc – Şemseddin er-Remlî (Mısır ve Şam'da fetvada öncelikli).","• Muasır: el-Fıkhu'l-menhecî – Mustafa el-Hın ve heyet (modern dille, delilleri öne çıkaran ilmihal); el-Fıkhu'l-İslâmî – Vehbe ez-Zuhaylî (Şâfiî ağırlıklı, dört mezhep kıyaslı).","Güncel başvuru kaynakları:","• Şâfiî Fıkhı (2 cilt) – Mehmet Keskin: Diyanet'in en güncel kaynağı; uzmanlık sınavları için resmî terminolojiyi içerir.","• Büyük Şâfiî İlmihali – Halil Gönenç: Türkiye'deki Şâfiîler için en temel başvuru eseri.","• el-Ümm (10 cilt, çev. M. Keskin) – Diyanet yayını; akademik araştırmalar için esas.","• Günümüz Meselelerine Fetvalar – Halil Gönenç: Bankacılık, tıp gibi yeni sorunlara Şâfiî eksenli çözümler.","• Muhtasar Şâfiî İlmihali – Abdurrahman Candan: Diyanet yayını; sade ve pratik.","• Güncel Dinî Meseleler (I-II) – Din İşleri Yüksek Kurulu: Şâfiî görüşlerini de işleyen kurumsal fetvalar.","• İslam İlmihali – Diyanet heyeti: Şâfiî farklarını dipnotlarla gösterir."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İmam Mâlik’in \"Medine İmamı\" olarak öne çıkan özellikleri ve eserleri nelerdir?","cevap":["İmam Mâlik, hayatı boyunca Medine’den ayrılmamaya özen göstermiş ve \"Amel-i Ehl-i Medîne\"yi delil saymıştır.","Hocaları: Nâfî, Yahya b. Said, Rabîatü’r-Re'y ve Cafer-i Sâdık.","Talebeleri: Abdurrahman b. Kasım ve Esed b. Furat.","Eseri: el-Muvatta (Hadis ve fıkhı birleştiren ilk temel eserlerdendir)."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"Mâlikî mezhebi hakkında bilgi veriniz.","cevap":["İmamı: İmam Mâlik b. Enes (ö. 179).","Metodu: **\"Medine Ehlinin Ameli\"**ni (Amel-i Ehl-i Medine) sünnetin yaşayan bir formu olarak görüp delil kabul eder. Maslahat-ı mürsele ve Sedd-i Zerâî (kötülüğe giden yolu kapama) prensiplerini yoğun kullanır.","Bölge: Kuzey ve Batı Afrika (Fas, Tunus, Cezayir), Endülüs (tarihî)."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İmam Mâlik’in en meşhur eseri hangisidir ve özelliği nedir?","cevap":["İmam Mâlik, \"Dâru’l-Hicre\" (Medine) imamıdır.","el-Muvatta: En önemli eseridir. Hem bir hadis hem de bir fıkıh kitabıdır. Medine ehlinin amelini (Amel-i ehl-i Medîne) delil olarak kullanmasıyla meşhurdur.","Mahiyeti: Hadis ve fıkhın iç içe olduğu, konularına göre düzenlenmiş (tasnif edilmiş) ilk büyük hadis-fıkıh eseridir.","İsim Anlamı: \"Üzerinde ittifak edilmiş\" veya \"herkesin onayladığı yol\" demektir.","Temel Kaynağı: Hz. Peygamber’in (sav) sünneti ile birlikte Medine ehlinin amelini (uygulamasını) esas alır.","Tarihî Önemi: İmam Şâfiî’ye göre, Sahih-i Buhârî yazılana kadar \"Kur'an'dan sonraki en sahih kitap\" kabul edilmiştir."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"el-Muvatta’nın en özgün özelliği nedir?","cevap":["Sahabe ve tabiin fetvalarına geniş yer vermesi ve Medine ehlinin kesintisiz uygulamasını (Amel-i Ehl-i Medine) bir hukuk delili olarak sunmasıdır."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"Mâlikî mezhebinin kurucu metni kabul edilen ve İmam Mâlik b. Enes tarafından telif edilen hem hadis hem fıkıh özelliği taşıyan eser hangisidir?","cevap":["el-Muvatta’. (Muvatta’, belli bir bölgenin –Medine’nin– amelini ve hadislerini merkeze alan ilk sistemli eserdir.)"]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İbn Abdilberr’in, İmam Mâlik’in Muvatta’sı üzerine yazdığı iki şerhi hangisidir?","cevap":["et-Temhîd ve el-İstizkâr.","Farkı (Ek Bilgi): Temhîd, hadisleri hocaların isimlerine göre (müsned) düzenlerken; İstizkâr, fıkıh konularına göre (ale’l-ebvâb) düzenlemiştir."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İmam Süyûtî’nin Muvatta’ üzerine yazdığı özlü ve meşhur şerhin ismi nedir?","cevap":["Tenvîru’l-Havâlik."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"Mâlikî mezhebinde \"Ümmü’l-Kitâb\" (Kitapların Anası) kabul edilen ve Sehnûn b. Abdisselâm tarafından son şekli verilen dev fıkıh eseri hangisidir?","cevap":["el-Müdevvene. Bu eser, İmam Mâlik’in öğrencisi İbnü’l-Kāsım’ın rivayetlerini ve İmam Mâlik’in fıkhî görüşlerini içerir.","Mâlikî: Sahnûn’un el-Müdevvene’si mezhebin en temel uygulama kaynağıdır."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"Mâlikî mezhebinde \"Muvatta’\" ve \"el-Müdevvene\" arasındaki temel fark nedir?","cevap":["Muvatta’ daha çok hadis ve Medine ehlini ameli merkezli bir \"asıl\" kaynaktır; elMüdevvene ise mezhebin furu-ı fıkıh (hukuki uygulama) konularındaki en kapsamlı başvuru kaynağıdır"]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"Bidayetü’l-Müctehid eseri hakkında bilgi veriniz.","cevap":["➢ Tam adıyla;Bidayetü’l-Müctehid ve Nihâyetü’l-Muktesid, Endülüslü filozof ve fakih İbn Rüşd el-Hafîd’in (v. 585) (Torun) tarafından kaleme alınmış mukayeseli (karşılaştırmalı) fıkıh eseridir.","Temel Amacı:","Okuyucuya sadece hazır bilgi sunmak değil, fıkhi meselelerde hüküm çıkarma (içtihat) melekesi kazandırmaktır.","Yöntemi:","Bu eser mukayeseli (karşılaştırmalı) bir fıkıh kitabıdır. Sadece bir mezhebin görüşünü değil; dört mezhebin ve diğer müctehidlerin görüşlerini delilleriyle birlikte ele alır. Mezheplerin (Hanefi, Maliki, Şafii, Hanbeli vb.) görüşlerini bir arada verir ve bu görüşlerin neden farklılaştığını (hadis yorumu, dil mantığı, kıyas vb.) bilimsel olarak açıklar.","Kapsamı:","İbadetlerden ticaret hukukuna ve ceza hukukuna kadar tüm fıkıh konularını sistematik bir şekilde ele alır.","Önemi:","Mezhepler arasındaki farkların mantıklı gerekçelerini sunduğu için İslam hukuk tarihinde hukuk felsefesi ve metodolojisi açısından eşsiz kabul edilir.","Diğer Fıkıh kitaplarından farkı:","Bu eser mukayeseli bir fıkıh kitabıdır. Sadece hükümleri değil, mezhepler arasındaki ihtilafların nedenlerini de delilleriyle birlikte analiz eder Kısacası; fıkhın \"neyi\" bildirdiğinden ziyade, o hükme \"nasıl\" varıldığını öğreten bir metodoloji klasiğidir."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İbn Rüşd, bu eserinde fıkhi ihtilafların nedenlerine (esbâbü’l-ihtilâf) inerken nasıl bir yöntem izlemiştir?","cevap":["Müellif, sadece \"kim ne dedi\" bilgisini vermekle yetinmez; ihtilafın dil bilimsel (lafzi), hadislerin sıhhati veya usul prensiplerindeki farklılıklardan kaynaklanan temel nedenlerini analiz eder."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"Eserin isminde geçen \"Bidâyetü’l-Müctehid\" (Müctehidin Başlangıcı) ve \"Nihâyetü’l-Muktesid\" (İktisat Edenin Sonu) ifadeleriyle ne kastedilmektedir?","cevap":["Bu isim, eserin bir müctehid adayı için yolun başı (temel kaynak), fıkıhla yetinen biri için ise ulaşılabilecek en üst nokta (yeterli kaynak) olduğunu sembolize eder."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İbn Rüşd el-Hafîd hangi mezhebe mensuptur ve eseri hangi mezhep ekseninde yazılmıştır?","cevap":["İbn Rüşd bir Mâlikî alimidir. Eserinde Mâlikî mezhebini merkeze almakla birlikte, Şâfiî, Hanefî ve Hanbelî mezheplerinin görüşlerine de tarafsız bir şekilde geniş yer ayırmıştır."]},{"alan":"Fıkıh","alt":"Mâlikî","soru":"İbn Rüşd dendiğinde akla sadece fıkıh mı gelir? Lakabı nedir?","cevap":["Hayır, o aynı zamanda büyük bir filozoftur. Batı dünyasında \"Averroes\" olarak bilinir. Aristoteles şerhleri nedeniyle \"Şârih\" (Yorumcu) lakabıyla da anılır"]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"Ahmed b. Hanbel’in hadis tarihindeki yeri ve yetiştirdiği büyük talebeler kimlerdir?","cevap":["Ahmed b. Hanbel, hadis odaklı fıkıh anlayışının zirvesidir; Kütüb-i Sitte müelliflerinin çoğuna hocalık yapmıştır.","Hocaları: Ebû Yûsuf, Süfyân b. Uyeyne, Vekî b. Cerrâh ve İmam Şâfiî.","Talebeleri: Buhârî, Müslim, Ebû Dâvûd ve Dârimî gibi dev muhaddisler onun öğrencisidir.","Eserleri: el-Müsned (Devasa hadis külliyatı), Kitâbü’l-İlel, Mesâil, Kitâbü’zZühd, Kitâbü’t-Teraccül"]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"Ahmed b. Hanbel’in hadis ve akide sahasındaki eserleri nelerdir?","cevap":["Ehl-i sünnetin \"Mihne\" dönemi kahramanı ve büyük bir hadis otoritesidir.","el-Müsned: Yaklaşık 30.000 hadis içeren devasa bir kaynaktır. Râvi isimlerine göre tasnif edilmiştir.","Kitâbü’s-Sünne: İtikadi konuları ve bidatlere reddiyeleri içerir.","ez-Zühd: Sahabe ve tabiun hayatından zühd örneklerini anlatır.","Kitâbü’l-İlel ve Ma’rifeti’r-Ricâl: Hadis tenkidi ve râvi bilgisi üzerine önemli bir eserdir."]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"Hanbelî Mezhebi mezhebi hakkında bilgi veriniz.","cevap":["İmamı: Ahmed b. Handel (ö. 241).","Metodu: \"Ehl-i Hadis\" ekolünün zirvesidir. Zayıf hadisi bile kıyasa tercih ederler. Naslara bağlılık en üst seviyededir. İbadetlerde muhafazakâr, muamelatta ise (akid özgürlüğü gibi) oldukça esnektirler.","Bölge: Suudi Arabistan ve Körfez ülkeleri"]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"İbn Kudâme’ye ait olan \"el-Muğnî\" isimli eserin literatürdeki önemi nedir?","cevap":["Bu eser, Hırakî’nin (v. 334) el-Muhtasar isimli kitabının şerhidir ve karşılaştırmalı fıkıh açısından Hanbelî mezhebinin en hacimli ve temel kaynaklarından biridir."]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"Hanbelî mezhebinin ilk muhtasar metinlerinden kabul edilen ve Hırakî tarafından telif edilen eserin adı nedir?","cevap":["el-Muhtasar (Muhtasaru'l-Hırakî)."]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"İbn Kudâme’nin, Hırakî’nin muhtasarını şerh ettiği ve karşılaştırmalı fıkhın zirve eserlerinden sayılan dev eseri hangisidir?","cevap":["el-Muğnî. ( Bu eser sadece Hanbelî fıkhını değil, tüm mezheplerin görüşlerini içermesi yönüyle meşhurdur.)"]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"Hanbelî ve Mâlikî usûlüne dair birer örnek veriniz.","cevap":["Hanbelî: İbn Kudâme – Ravzatü’n-Nâzır: Gazâlî’nin el-Mustasfâ adlı eserinin Hanbelî mezhebine bir nevi uyarlaması niteliğindedir. Mezhep içinde en çok okunan ve üzerine şerh yazılan temel metindir.","Mâlikî: Şâtıbî – el-Muvâfakât: Sadece Mâlikî mezhebinin değil, tüm İslam hukuk tarihinin en özgün eserlerinden biridir. \"Makâsıdü’ş-şerîa(dinin amaçları) konusunu sistemli bir şekilde işleyen temel kaynaktır."]},{"alan":"Fıkıh","alt":"Hanbelî","soru":"İbn Teymiyye’nin itikadî ve amelî mezhebi nedir? En önemli (33 ciltlik) eserinin adı nedir?","cevap":["İtikadî Mezhebi: Selefiyye (Ehl-i Hadis) ekolüne mensuptur. Akli tevillerden kaçınıp \"Selef-i Sâlihîn\"in anladığı gibi inanmayı savunur.","Amelî Mezhebi: Hanbelî mezhebine mensuptur (Ancak pek çok konuda dört mezhebin dışına çıkan bağımsız içtihatları da mevcuttur). 33 Ciltlik Dev Eseri: Mecmûu’l-Fetâvâ. (İçinde kelâmdan fıkha, tasavvuftan tefsire kadar her alandaki görüşlerini barındıran muazzam bir külliyattır)."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Fıkıh usulü yazımında kullanılan üç temel metot hangileridir ve temel farkları nelerdir?","cevap":["1. Fukahâ (Hanefî) Metodu: Mezhep imamlarının fer'î (füru) fıkıh içtihatlarından yola çıkarak usul kaidelerini tespit eden, uygulamalı metottur.","2. Mütekellimîn (Şâfiî) Metodu: Füru fıkıh meselelerine bakmaksızın, tamamen aklî ve teorik kurallar koyan, mantıksal tutarlılığı önceleyen metottur.","3. Memzûc (Karma) Metod: Bu iki metodun avantajlı yönlerini birleştiren, hem kural koyan hem de örneklerle açıklayan metottur."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Fukahâ (Hanefî) usul metodunun en meşhur eserleri ve müellifleri kimlerdir?","cevap":["Cessâs (v. 370): el-Füsûl fi’l-Usûl","Debûsî (v. 430): Takvîmü’l-Edille (Sistematik usulün kurucusudur).","Pezdevî (v. 482): Kenzü’l-Vusûl (Mezhebin en temel usul metni kabul edilir).","Serahsî (v. 483): Usûlü’s-Serahsî.","Ebû’l-Berakât en-Nesefî (v. 710): Menârü’l-Envâr (Üzerine çok şerh yazılan ders kitabıdır).","Abdülaziz Buhârî (v. 730): Keşfü’l-Esrâr (Pezdevî’nin en meşhur şerhidir)."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Mütekellimîn metodunun klasikleşmiş başyapıtları hangileridir?","cevap":["İmam Şâfiî (v. 204): er-Risâle (Başlangıç eseridir).","Cüveynî (v. 478): el-Burhân.","Gazzâlî (v. 505): el-Mustasfâ (Usulün en olgun eserlerinden biridir).","Fahreddin er-Râzî (v. 606): el-Mahsûl. Âmidî (v. 631): el-İhkâm fî Usûli’l-Ahkâm.","Beydâvî (v. 685): el-Minhâc."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Şâfiî ve Hanefî usullerini sentezleyen \"Memzûc\" eserler hangileridir?","cevap":["İbnü’s-Sââtî (ö. 694): Bedîu’n-Nizâm (Pezdevî ve Âmidî'yi birleştirmiştir).","Sadru’ş-Şerîa (ö. 747): Tenkîhu’l-Usûl ve şerhi et-Tavdîh.","İbnü’s-Sübkî (ö. 771): Cem’u’l-Cevâmi’.","Şâtıbî (ö. 790): el-Muvâfakât (Makâsıd odaklı özel bir eserdir).","Molla Hüsrev (ö. 885): Mirkātü’l-Vusûl ve şerhi Mir’âtü’l-Usûl (Osmanlı medrese geleneğinin temelidir).","İbnü’l-Hümâm (ö. 861): et-Tahrîr.","Şevkânî (ö. 1250): İrşâdü’l-Fuhûl."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Makāsıdü’ş-Şerîa (Gāyecilik) alanında en önemli eser hangisidir?","cevap":["İmam Şâtıbî’nin el-Muvâfakât adlı eseridir. Usûl ilmine \"makāsıd\" eksenli yeni bir soluk getirmiştir."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Şâtıbî’nin usul sahasındaki meşhur eseri nedir ve bu eseri diğer usul kitaplarından ayıran temel özellikler nelerdir?","cevap":["Eser: el-Muvâfakât.","Ayırıcı Özellikler:","1. Makāsıdü’ş-Şerîa: Bu eseri eşsiz kılan en büyük özellik, fıkıh usulünü \"şeriatın amaçları\" (makāsıd) üzerine inşa etmesidir. Klasik usul kitapları daha çok lafız analizlerine odaklanırken, Şâtıbî \"Allah'ın bu hükümle muradı nedir?\" sorusuna odaklanır.","2. Mesâlih-i Mürsele: İnsanların yararını (maslahat) temel bir ilke olarak merkeze alır.","3. Küllî Kaideler: Hükümlerin cüz'î ayrıntılarından ziyade, dinin küllî (genel) prensiplerini tespit etmeye çalışır.","4. Sentez: Endülüs'ün yetiştirdiği müellif, bu eseriyle Mâlikî fıkhını evrensel bir usul sistemine dönüştürmüştür."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Şâtıbî'nin Makāsıd teorisindeki 'Zarûriyyât-ı Hamse' (Beş Temel İlke) nedir?","cevap":["Canın, dinin, aklın, neslin ve malın korunmasıdır."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Şâtıbî'nin el-Muvâfakât'ını diğer usul eserlerinden ayıran nedir?","cevap":["Sadece teknik kurallar (lâfız-hüküm ilişkisi) üzerinde durmaz; şeriatın amaçlarını (Makāsıdü’ş-Şerîa) usulün merkezine yerleştirir."]},{"alan":"Fıkıh Usulü","alt":"","soru":"el-Müstasfâ kimin eseridir? Eserin Türkçeye tercümesi yapılmış mıdır, kime aittir?","cevap":["Müellif: Büyük İslam alimi İmam Gazzâlî'dir (ö. 505/1111).","Mahiyeti: Şâfiî fıkıh usulünün (Mütekellimîn metodu) en kâmil ve en etkili eserlerinden biridir.","Tercümesi: Evet, eserin Türkçeye çok kıymetli bir tercümesi mevcuttur.","Mütercim: Prof. Dr. Yunus Apaydın tarafından Türkçeye kazandırılmıştır (Türkiye Diyanet Vakfı Yayınları)."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Usûlü’l-Pezdevî’nin Hanefî mezhebindeki konumu nedir?","cevap":["Hanefî usulünün en sağlam ve özlü metni kabul edilir. Abdülaziz Buhârî'nin Keşfü’l-Esrâr şerhiyle birlikte mezhepteki otoritesini pekiştirmiştir."]},{"alan":"Fıkıh Usulü","alt":"","soru":"Şâfiî fıkıh usulünde (Mütekellimîn metodu) \"el-İhkâm\" dendiğinde hangi alimi ve eseri anlıyoruz?","cevap":["Bu eser Seyfiddin el-Âmidî’ye aittir. el-İhkâm fî Usûli’l-Ahkâm, Gazzâlî’nin Müstasfâ’sı üzerine bina edilmiş, mantık ve kelâm ağırlıklı, çok sistemli bir fıkıh usulü kitabıdır."]},{"alan":"Fıkıh","alt":"Genel","soru":"Dört büyük mezhep imamının doğum ve vefat yerleri ile tarihleri hakkında bilgi veriniz.","cevap":["• Ebû Hanîfe (İmâm-ı A'zam): Doğum 80/699 Kûfe – Vefat 150/767 Bağdat.","• İmam Mâlik (İmâmü Dâri'l-hicre): Doğum 93/711 Medine – Vefat 179/795 Medine.","• İmam Şâfiî (Nâsırü'l-hadîs): Doğum 150/767 Gazze – Vefat 204/820 Kahire.","• Ahmed b. Hanbel (İmâmü Ehli's-sünne): Doğum 164/780 Bağdat – Vefat 241/855 Bağdat.","Mülakat notu: Hocalık-talebelik zinciri sorulursa: İmam Şâfiî hem İmam Mâlik'in hem de Ebû Hanîfe'nin talebesi İmam Muhammed'in öğrencisidir; Ahmed b. Hanbel ise İmam Şâfiî'nin öğrencisidir.","Mülakat ipucu: \"Neden dört mezheple sınırlı kaldı?\" sorulursa: Bu imamların metodolojileri sistemlidir ve sistemi devam ettirecek güçlü talebeler yetiştirmişlerdir."]},{"alan":"Fıkıh","alt":"Genel","soru":"Dört büyük mezhebin en belirgin özellikleri nelerdir?","cevap":["• Ebû Hanîfe – Ehl-i re'y – el-Fıkhü'l-ekber: Kıyas ve istihsânı çok kullanması.","• İmam Mâlik – Ehl-i hadis – el-Muvatta': Medine halkının amel ve örfüne önem vermesi.","• İmam Şâfiî – Memzûc (re'y ve hadis) – er-Risâle: Fıkıh usulünü sistemleştirmesi.","• Ahmed b. Hanbel – Ehl-i hadis – el-Müsned: Nassa (hadise) bağlılığı ve zühdü."]},{"alan":"Fıkıh","alt":"Genel","soru":"Zâhirî mezhebinin günümüze ulaşan en büyük kaynağı nedir?","cevap":["İbn Hazm tarafından kaleme alınan el-Muhallâ adlı eserdir. Kıyası reddeden, sadece nasların zâhirine dayanan bu eser, aynı zamanda diğer mezheplerin görüşlerini de yoğun şekilde eleştirir."]},{"alan":"Fıkıh","alt":"Genel","soru":"Diyanet'in hazırladığı ilmihaller ve Şafii ilmihali örnekleri nelerdir?","cevap":["Diyanet'in iki ciltlik İlmihali Diyanet İslam İlmihali (Lütfi Şentürk - Seyfettin Yazıcı) Şafii İlmihali -Mehmet Keskin Muhtasar Şâfiî İlmihali-Abdurrahman Candan Şafii mezhebi için Halil Gönenç'in Büyük Şafii İlmihali en yaygın kaynaktır"]},{"alan":"Fıkıh","alt":"Genel","soru":"\"Ehl-i Rey\" ve \"Ehl-i Hadis\" ekollerini temsilcileriyle açıklayınız.","cevap":["Ehl-i Rey: Nassın ruhuna, akla ve kıyasa önem verir. Temsilcisi: Ebu Hanife.","Ehl-i Hadis: Nassın zahirine ve hadise öncelik verir. Temsilcisi: Ahmed b. Hanbel"]},{"alan":"Fıkıh","alt":"Genel","soru":"Fıkıh literatüründe Muhtasar eserler nelerdir?","cevap":["Muhtasarlar, hacimli eserlerin özünü süzerek ezberlemeyi ve hızlıca hükme ulaşmayı sağlayan eserlerdir. Mezheplere göre başlıcaları:","• Hanefî – el-Muhtasar (el-Kitâb) – Kudûrî: Mezhebin en temel metni; yüzyıllarca ders kitabı.","• Hanefî – Kenzü'd-dekâik – Ebü'l-Berekât en-Nesefî: Son derece veciz; üzerine çok sayıda şerh yazılmış.","• Hanefî – el-Muhtâr li'l-fetvâ – Mevsılî: Fetva odaklı; müellifin kendi şerhi el-İhtiyâr ile okutulur.","• Hanefî – el-Vikâye – Tâcüşşerîa: Merğînânî'nin el-Hidâye'sindeki meselelerin özeti.","• Hanefî – Mülteka'l-ebhur – İbrâhim el-Halebî: Osmanlı'nın yarı resmî kanun metni; dört metnin özeti niteliğinde.","• Şâfiî – el-Gāye ve't-takrîb – Ebû Şücâ el-İsfahânî: Başlangıç seviyesinin en önemli eseri.","• Şâfiî – Minhâcü't-tâlibîn – Nevevî: Orta ve ileri seviye için en güvenilir metin.","• Şâfiî – Safînetü'n-necâ – Sâlim b. Semîr: İbadetlere dair çok küçük bir muhtasar.","• Mâlikî – Muhtasaru Halîl – Halîl b. İshâk el-Cündî: Mezhebin en zor ve kapsamlı metni.","• Mâlikî – er-Risâle – İbn Ebû Zeyd el-Kayrevânî: İnanç ve fıkhı özetler; müellifi \"Küçük Mâlik\" diye anılır.","• Hanbelî – el-Mukni' – İbn Kudâme: Mezhepteki farklı rivayetleri sade bir dille sunar.","• Hanbelî – Zâdü'l-müstakni' – Şerefeddin el-Haccâvî: el-Mukni'in özeti; Körfez ülkelerinde en çok ezberlenen metin.","• Hanbelî – el-Umde – İbn Kudâme: Yeni başlayanlar için tek görüşe odaklanan en basit muhtasar."]},{"alan":"Fıkıh","alt":"Genel","soru":"Osmanlı medreselerinde çok okutulan usul eseri hangisidir?","cevap":["Molla Hüsrev’in Mir’âtü’l-Usûl adlı eseri, memzûc metotla yazılmış ve yüzyıllarca ders kitabı olarak takip edilmiştir."]},{"alan":"Fıkıh","alt":"Genel","soru":"Ahmet Cevdet Paşa kimdir?","cevap":["19. yüzyıl Osmanlı devlet adamı, hukukçu ve tarihçidir. İslam hukukunun kanunlaştırılmış hali olan Mecelle-i Ahkâm-ı Adliyye cemiyetinin başkanlığını yapmıştır. Ayrıca Târîh-i Cevdet ve Kısas-ı Enbiyâ gibi çok yönlü eserleri mevcuttur."]},{"alan":"Fıkıh","alt":"Genel","soru":"Güncel fıkıh problemleri ile ilgili hangi eseri tavsiye edersiniz?","cevap":["• Fetvalar – Diyanet İşleri Başkanlığı Din İşleri Yüksek Kurulu: Toplumun en çok sorduğu sorulara verilen resmî ve güncel cevaplar.","• Günümüz Fıkıh Meseleleri – Osman Enver Kaan: Klasik fıkıh birikimini güncel meselelerle buluşturan kapsamlı çalışma.","• Günümüz Fıkıh Problemleri – Soner Duman: Usul ilkelerinden hareketle modern meselelere akademik ve sistematik bakış.","• Günlük Hayatımızda Helaller ve Haramlar – Hayreddin Karaman: Türkiye'de alanın öncü eserlerinden; borsa, sigorta, aile hayatı.","• Helâl ve Haram – Yusuf el-Karadâvî: Çağdaş meseleleri klasik delillerle ele alan, dünyada çok okunan eser.","• Fetvalarla Çağdaş Hayat – Faruk Beşer: Sosyal hayat ve ibadetlere dair modern sorulara analitik bakış."]},{"alan":"Hadis","alt":"","soru":"Sahîh-i Buhârî'nin tam adı nedir?","cevap":["Eserin tam ve orijinal adı: \"el-Câmiu’s-sahîhu’l-müsnedü’l-muhtasaru min umûri Resûlillâhi sallallâhu aleyhi ve sellem ve sünenihî ve eyyâmih.\"","Anlamı: \"Resûlullah'ın (s.a.v) işlerine, sünnetlerine ve günlerine dair hadislerin içinden seçilmiş, muttasıl/müsned ve muhtasar güvenilir kitap.\"","Önemi: Bu isim, kitabın sadece sahih hadisleri içerdiğini, senedinin kesintisiz olduğunu ve hayatın her alanını kapsayan (Câmi') bir eser olduğunu ifade eder."]},{"alan":"Hadis","alt":"","soru":"Sahîh-i Buhârî üzerine yazılmış en meşhur şerhleri ve özelliklerini sayınız.","cevap":["• A'lâmü'l-hadîs (İ'lâmü's-sünen) – Hattâbî (ö. 388): Buhârî üzerine ilk şerhlerden; fıkhî ve lugavî inceliklere odaklanır.","• el-Kevâkibü'd-derârî – Kirmânî (ö. 786): Kelam, usul ve dil ağırlıklı; sonraki büyük şerhlere zemin hazırlamıştır.","• Fethu'l-bârî – İbn Hacer el-Askalânî (ö. 852): \"Şerhlerin şahı\"; hadis tekniği ve ricâl bilgisinde en otorite eser.","• Umdetü'l-kārî – Bedreddin el-Aynî (ö. 855): Hanefî fıkhı ve derin dil analizleriyle tanınır.","• İrşâdü's-sârî – Kastallânî (ö. 923): Metnin doğru okunmasına (zabt) odaklı, pratik bir şerh."]},{"alan":"Hadis","alt":"","soru":"En meşhur Buhârî ve Müslim şerhleri hangileridir?","cevap":["Buhârî Şerhleri:","1. Fethu’l-Bârî - İbn Hacer el-Askalânî.","2. Umdetü’l-Kārî - Bedreddin el-Aynî.","3. el-Kevâkibü’d-Derârî - el-Kirmânî.","Müslim Şerhleri:","1. el-Minhâc - İmam Nevevî (En meşhur ve yaygın şerhtir).","2. el-İkmâl - Kadı İyâz."]},{"alan":"Hadis","alt":"","soru":"Sahîh-i Müslim şerhleri denilince akla gelen ilk eserler hangileridir?","cevap":["• el-Mu'lim bi-fevâidi Müslim – Mâzerî (ö. 536): Müslim üzerine ilk sistemli şerhlerden; kelâmî ve fıkhî tartışmalara yer verir.","• İkmâlü'l-Mu'lim – Kādî İyâz (ö. 544): Mâzerî'nin eserini tamamlar; ricâl ve dil tahlilleriyle zengin, Mâlikî eksenli.","• el-Müfhim – Kurtubî (ö. 656): Hadislerin anlam ve hükümlerini kolay ve sistemli açıklar.","• el-Minhâc (Nevevî Şerhi) – Nevevî (ö. 676): En meşhur şerh; bugünkü bab başlıklarını Nevevî koymuştur.","• Fethu'l-mülhim – Şebbîr Ahmed Osmânî (ö. 1369/1949): Modern dönemin en kapsamlı şerhlerinden; Hanefî fıkhı ağırlıklı.","Mülakat notu: \"Hattâbî'nin şerhçilikteki önemi nedir?\" sorulursa: Hem Buhârî hem de Ebû Dâvûd üzerine ilk sistemli şerhleri yazan kişidir."]},{"alan":"Hadis","alt":"","soru":"Kütüb-i Sitte içerisinde \"Sahîhayn\" olarak adlandırılan eserler hangileridir ve neden bu özel ismi almışlardır?","cevap":["Buhârî ve Müslim'in \"el-Câmiu’s-Sahîh\" adlı eserleridir. Bu ismi almalarının sebebi, müelliflerinin sadece \"sahih\" hadisleri toplama şartı koşmaları ve İslam ümmetinin bu iki kitabın sıhhati konusunda icma (ittifak) etmiş olmasıdır."]},{"alan":"Hadis","alt":"","soru":"\"Buhârî'nin fıkhı bab başlıklarındadır\" (Fıkhu'l-Buhârî fî Terâcimihî) sözüyle ne kastedilmektedir?","cevap":["Buhârî, hadislerden çıkardığı fıkhî hükümleri ve kendi içtihatlarını doğrudan hadislerin üzerine koyduğu bab başlıklarında (tercüme) zikreder. Bazen bir ayeti, bazen bir hadis parçasını başlık yaparak o konudaki fıkhî duruşunu sergiler. Bu, onun sadece bir muhaddis değil, aynı zamanda büyük bir fakih olduğunu gösterir."]},{"alan":"Hadis","alt":"","soru":"Sahih-i Buhârî ile Sahih-i Müslim arasındaki temel yöntem farkları nelerdir?","cevap":["• Öncelikli odak: Buhârî fıkhî hüküm çıkarmayı, Müslim hadislerin farklı tariklerini bir arada korumayı amaçlar.","• Sıhhat şartı: Buhârî'de liķā (ravilerin yüz yüze görüşmesinin sabit olması) şarttır; Müslim'de muâsara (çağdaşlık ve görüşme imkânı) yeterlidir.","• Hadislerin dizilimi: Buhârî hadisleri fıkıh konularına göre bölerek farklı bölümlerde tekrar eder; Müslim bir hadisin bütün rivayetlerini tek başlık altında verir.","• Bab başlıkları: Buhârî'nin kendi koyduğu, fıkhî görüş içeren başlıklar vardır; Müslim başlık koymamış, mevcut başlıkları şârihler (ör. Nevevî) eklemiştir.","• Mukaddime: Buhârî'de özel bir usul mukaddimesi yoktur; Müslim hadis usulünü anlatan meşhur bir mukaddimeyle başlar.","• Şöhret: Buhârî \"esahhu'l-kütüb\" (en sahih kitap), Müslim tertip ve tasnifi en iyi kitap kabul edilir."]},{"alan":"Hadis","alt":"","soru":"İmam Müslim’in tertip (düzenleme) açısından Buhârî’den üstün görüldüğü nokta nedir?","cevap":["Müslim, bir hadisin bütün geliş yollarını (tariklerini) ve metin farklarını tek bir yerde, arka arkaya zikreder. Buhârî ise hadisleri fıkhî konulara göre parçalara ayırıp farklı bölümlerde tekrar edebilir. Bu yüzden bir hadisi bütün yönleriyle incelemek isteyen araştırmacı için Müslim'in tertibi daha kullanışlıdır."]},{"alan":"Hadis","alt":"","soru":"Son dönemde Sahîh-i Buhârî üzerine yapılan en önemli şerh ve tahlil çalışmaları nelerdir?","cevap":["Muhammed Enver el-Keşmîrî (ö. 1933) – Feyzü’l-Bârî ilâ Sahîhi’l-Buhârî: Hint alt kıtası hadis ekolünün en özgün şerhlerinden biridir. Hadislerin fıkhî ve felsefî arka planına dair derin analizler içerir. Fuad Sezgin – Buhârî’nin Kaynakları Hakkında Araştırmalar (1956): Hadis tarihindeki en devrimsel çalışmalardan biridir. Buhârî'nin eserini yazılı kaynaklara dayandırdığını ispat ederek \"hadislerin sadece sözlü rivayetle geldiği\" iddiasını bilimsel olarak çürütmüştür. Ahmed Naim ve Kâmil Miras – Sahîh-i Buhârî Muhtasarı Tecrîd-i Sarîh","Tercümesi ve Şerhi: Diyanet İşleri Başkanlığı'nın talimatıyla hazırlanan, Cumhuriyet tarihinin en önemli hadis projesidir. Sadece bir tercüme değil, devasa bir şerhtir. Mustafa el-Buga – Nüzhetü’l-Müttakîn: Daha çok eğitim odaklı, güncel bir şerh çalışmasıdır."]},{"alan":"Hadis","alt":"","soru":"\"Sünen-i Erbaa\" (Dört Sünen) hangileridir? Bunları \"Câmi\" türü eserlerden ayıran temel fark nedir?","cevap":["Ebû Dâvûd, Tirmizî, Nesâî ve İbn Mâce'nin eserleridir.","Fark: \"Câmi\"ler (Buhârî ve Müslim gibi) akideden siyer ve tefsire kadar her konuyu içerirken; \"Sünen\"ler esas olarak ahkâm hadislerini (fıkhî konuları) merkeze alır."]},{"alan":"Hadis","alt":"","soru":"Ebû Dâvûd’un es-Sünen’ini fıkıhçılar için \"başucu kitabı\" yapan temel özellik nedir?","cevap":["Ebû Dâvûd, eserine özellikle ahkâm (hukukî/amelî) hadislerini almış ve bu hadislerin zayıflıklarını veya illetlerini hadislerin hemen peşine not düşerek açıklamıştır. Fıkıh mezheplerinin delil olarak kullandığı hadislerin büyük çoğunluğu bu eserde toplanmıştır."]},{"alan":"Hadis","alt":"","soru":"Tirmizî’nin hadis usulü ilmine kazandırdığı en önemli yenilik (terim) nedir?","cevap":["\"Hasen\" kavramıdır. Tirmizî'den önce hadisler genellikle \"Sahih\" ve \"Zayıf\" olarak ikiye ayrılırken, Tirmizî bu ikisinin arasında yer alan, ancak delil olarak kullanılabilen \"Hasen\" derecesini literatüre yerleştirmiş ve her hadisin sıhhat derecesini bizzat belirtmiştir."]},{"alan":"Hadis","alt":"","soru":"İbn Mâce’yi Kütüb-i Sitte’nin altıncı kitabı yapan ayırt edici özellik nedir?","cevap":["Zevâid hadisleridir. Yani diğer beş büyük hadis kitabında (Buhârî, Müslim, Ebû Dâvûd, Tirmizî, Nesâî) bulunmayan pek çok hadisi bünyesinde barındırması ve fıkıh bablarına göre tertibinin mükemmelliğidir.","Mülakat İçin Kritik \"Derecelendirme\" Notu:","En Sahih Eser: Sahîh-i Buhârî.","Şartları En Ağır Müellif: Müslim (bazı yönlerden Nesâî de çok titizdir).","En İyi Fıkhî Tasnif: Ebû Dâvûd.","Hadis Tekniği ve Mezhep Görüşleri: Tirmizî"]},{"alan":"Hadis","alt":"","soru":"Hadis literatüründeki \"Kütüb-i Tis’a\" kavramı hangi eserleri kapsar?","cevap":["Kütüb-i Sitte’ye (Altı Kitap) üç önemli eserin daha eklenmesiyle oluşan dokuz temel hadis kaynağıdır. Bu eserler şunlardır:","1. Buhârî – el-Câmiu’s-Sahîh","2. Müslim – el-Câmiu’s-Sahîh","3. Ebû Dâvûd – es-Sünen","4. Tirmizî – es-Sünen","5. Nesâî – es-Sünen","6. İbn Mâce – es-Sünen","7. Dârimî – es-Sünen","8. İmam Mâlik – el-Muvatta","9. Ahmed b. Hanbel – el-Müsned"]},{"alan":"Hadis","alt":"","soru":"Ebû Dâvûd’un es-Sünen’i üzerine yapılan en meşhur şerhleri sayınız.","cevap":["Ebû Dâvûd üzerine pek çok çalışma yapılmış olsa da şu üçü en çok bilinenidir:","Hattâbî – Meâlimü’s-Sünen: (Sünen üzerine yazılan ilk şerh olması bakımından çok önemlidir.)","Azîmâbâdî – Avnü’l-Ma’bûd: (Kısa, öz ve fıkhî açıklamalara odaklanan bir şerhtir.)","Sehârenfûrî – Bezhü’l-Mechûd: (Geniş hacimli ve ayrıntılı bir şerhtir.)"]},{"alan":"Hadis","alt":"","soru":"Tirmizî süneninin önemli şerhleri nelerdir?","cevap":["Ebû Dâvûd:","Hattâbî’nin Meâlimü’s-Sünen’i (ilk şerh) Azîmâbâdî’nin Avnü’l-Ma’bûd’u.","Tirmizî:","İbnü’l-Arabî’nin Ârizatü’l-Ahvezî’si Mübârekfûrî’nin Tuhfetü’l-Ahvezî’si."]},{"alan":"Hadis","alt":"","soru":"Sadece sahih hadisleri toplama amacı güden (veya içinde sadece sahih bulunduğu kabul edilen) temel eserler hangileridir?","cevap":["Sahîh-i Buhârî Sahîh-i Müslim İbn Huzeyme – es-Sahîh İbn Hibbân – el-İhsân (Sahîh-i İbn Hibbân) Hâkim en-Nîsâbûrî – el-Müstedrek (Buhârî ve Müslim'in şartlarına uyduğu halde almadığı hadisleri toplar.)"]},{"alan":"Hadis","alt":"","soru":"Tecrîd-i Sarîh nedir, içeriği ve müellifi kimdir?","cevap":["Tam Adı: Sahîh-i Buhârî Muhtasarı Tecrîd-i Sarîh Tercemesi ve Şerhi.","Asıl Müellif: Zeynüddin ez-Zebîdî (Buhârî'deki tekrarları çıkararak özetlemiştir).","İçerik: Sahîh-i Buhârî'deki mükerrer hadisleri çıkarıp, sadece asıl hadis metinlerini (senedsiz) bırakan bir \"tecrîd\" çalışmasıdır.","Önemi: Türkiye’de Diyanet İşleri Başkanlığı tarafından Ahmet Naim ve Kamil Miras’a tercüme ettirilen resmi çalışmadır."]},{"alan":"Hadis","alt":"","soru":"Babanzâde Ahmed Naim’in katkısı nedir?","cevap":["Diyanet'in görevlendirmesiyle Tecrîd-i Sarîh Tercemesi’ni başlatmıştır. Akademik ve titiz çalışmasıyla Türkiye’de sahih hadis anlayışının yerleşmesinde köprü olmuştur."]},{"alan":"Hadis","alt":"","soru":"Ahmed b. Hanbel’in Ebû Dâvûd’a yazdığı mektubun mahiyeti nedir?","cevap":["İmam Ahmed b. Hanbel, talebesi Ebû Dâvûd’a (Sünen müellifi) hitaben bir mektup yazmıştır. Bu mektup, özellikle itikadi konularda (Ehl-i Sünnet akidesi, Kur’an’ın mahluk olup olmaması meselesi vb.) ve hadis ilmindeki metodolojisi üzerine önemli tavsiyeler içerir. Ebû Dâvûd’un Sünen'ini hazırlarken hocasının bu prensiplerine bağlı kaldığı görülür.","HADİS USULÜ (ULÛMÜ’L-HADİS) LİTERATÜRÜ"]},{"alan":"Hadis Usulü","alt":"","soru":"Hadis usulü sahasında yazılmış ilk müstakil eser ve diğer temel eserler hangileridir?","cevap":["er-Râmehürmüzî: el-Muhaddisü’l-Fâsıl (Müstakil olarak yazılan ilk usul eseridir).","Hâkim en-Nîsâbûrî: Ma‘rifetü Ulûmi’l-Hadîs.","Hatîb el-Bağdâdî: el-Kifâye fî İlmi’r-Rivâye.","İbnü’s-Salâh: Ulûmü’l-Hadîs (Kendi adıyla Mukaddime olarak bilinir, usulün dönüm noktasıdır).","Süyûtî: Tedrîbü’r-Râvî (İbnü’s-Salâh sisteminin en geniş şerhlerindendir)."]},{"alan":"Hadis Usulü","alt":"","soru":"Hadis usulü ilminin \"Mütekaddimûn\" (İlk Dönem) kaynaklarını ve ilk müstakil eserini sayınız.","cevap":["Hadis usulü müstakil bir ilim haline gelmeden önce diğer eserlerin içinde zikredilmiştir:","İlk Kaynaklar: İmam Şâfiî – er-Risâle, Müslim – el-Câmiu’s-Sahîh Mukaddimesi, Tirmizî – Kitâbü’l-İlel.","İlk Müstakil Eserler: * Râmehürmüzî (ö. 360): el-Muhaddisü’l-Fâsıl (Sahanın ilk müstakil eseri). o Hâkim en-Nîsâbûrî (ö. 405): Ma’rifetü Ulûmi’l-Hadîs. o Hatîb el-Bağdâdî (ö. 463): el-Kifâye fî İlmi’r-Rivâye."]},{"alan":"Hadis Usulü","alt":"","soru":"İbnü’s-Salâh’ın eserini tanıtır mısın?","cevap":["Tam adı: Ma'rifetü envâi ulûmi'l-hadîs (Mukaddimetü İbni's-Salâh). Müellif: İbnü's-Salâh eş-Şehrezûrî (ö. 643/1245). Müteahhirûn dönemi hadis usulünün kurucu metnidir.","Amacı: Kendinden önceki dağınık usul birikimini, özellikle Hatîb el-Bağdâdî'nin eserlerini, tek bir disiplin altında toplamak.","Yapısı: Hadis ilimlerini 65 nev'e (başlığa) ayırır. Şam'daki Dârü'l-hadîsi'l-Eşrefiyye'de verilen derslerden oluştuğu için sistematik ve pedagojiktir. Sonraki âlimlerin hepsi bu esere bağlı kalmıştır.","İçerik: (1) Hadislerin derecelendirilmesi (sahih, hasen, zayıf; nâsih-mensûh, muhtelif); (2) senet ve ravi analizi (adalet, zabt, cerh-ta'dil; muttasıl, mürsel, mu'dal, munkatı; illetli ve şâz hadisler); (3) hadis alma-aktarma yolları ve kitabet kuralları.","Üzerine yapılan çalışmalar:","• el-İrşâd (ihtisar) – Nevevî (ö. 676) → bunun ihtisarı et-Takrîb → onun şerhi Tedrîbü'r-râvî (Suyûtî).","• İhtisâru Ulûmi'l-hadîs – İbn Kesîr (ö. 774) → şerhi el-Bâisü'l-hasîs (Ahmed Muhammed Şâkir).","• Nazmü'd-dürer / Elfiyye (manzum) – Irâkî (ö. 806) → şerhi Fethu'l-muğîs.","• et-Takyîd ve'l-îzâh – Irâkî (ö. 806): Doğrudan İbnü's-Salâh metni üzerine şerh/haşiye.","• Nuhbetü'l-fiker – İbn Hacer (ö. 852) → kendi şerhi Nüzhetü'n-nazar → onun şerhi Şerhu'ş-Şerh (Ali el-Kārî)."]},{"alan":"Hadis Usulü","alt":"","soru":"İbnü’s-Salâh’ın eserinin neden bu kadar önemlidir","cevap":["\"Ondan önceki tüm dağınık usul bilgilerini (Râmehürmüzî, Hâkim ve Hatîb elBağdâdî'nin çalışmalarını) tek bir sistemde birleştirip 65 nev'e ayırdığı için usulün anayasası kabul edilir\""]},{"alan":"Hadis Usulü","alt":"","soru":"İbn Hacer el-Askalânî’nin hadis usulündeki en meşhur eseri ve şerhi nedir?","cevap":["İbn Hacer’in Nuhbetü’l-Fiker adlı muhtasar metni çok meşhurdur. Bu eseri bizzat kendisi Nüzhetü’n-Nazar adıyla şerhetmiştir. Daha sonra Ali el-Kārî bu şerhe Şerhu’ş-Şerh yazmıştır."]},{"alan":"Hadis Usulü","alt":"","soru":"Hatip el-Bağdadi’nin hadis ilmindeki yeri nedir?","cevap":["Hatîb el-Bağdâdî (ö. 463/1071), hadis ilminin \"tedvin ve tasnif sonrası en büyük otoritesi\" olarak kabul edilir. Onun ilmi ağırlığını şu üç madde ile özetlemek mümkündür:","İlmin Mimarı: Hadis ilminin hemen hemen her alt dalı için müstakil bir eser kaleme almıştır. Bu özelliğiyle hadis ilminin kurallarını (usulünü) sistemleştiren ana figürdür. \"Bütün Hadisçiler Ona Muhtaçtır\": Meşhur alim Ebû Bekir b. Nukta’nın ifadesiyle: \"İnsaflı olan herkes bilir ki, Hatîb el-Bağdâdî'den sonra gelen tüm hadis ehli, onun kitaplarına muhtaçtır.\" Bu, onun otoritesini tescilleyen en ünlü sözdür.","Köprü Şahsiyet: Mütekaddimîn (ilk dönem) ile Müteahhirîn (sonraki dönem) arasında bir köprüdür. İbnü’s-Salâh gibi daha sonra gelen büyük usulcülerin en temel kaynağı Hatîb’in eserleridir.","En Önemli Eserleri Hatîb el-Bağdâdî, usulün \"anayasalarını\" yazmıştır:","1. el-Kifâye fî ilmi’r-rivâye: Hadis usulünün rivayet tekniği ve kurallarıyla ilgili temel kaynağıdır.","2. el-Câmi‘ li-ahlâki’r-râvî ve âdâbi’s-sâmi‘: Hadis talebesi ve hocasının uyması gereken ahlak ve edep kurallarını anlatır.","3. Târîhu Bağdâd: Sadece bir tarih kitabı değil, binlerce ravinin cerh ve ta’dil (güvenilirlik) bilgisini içeren devasa bir biyografi kaynağıdır"]},{"alan":"Hadis Usulü","alt":"","soru":"Hadis alanında mütekaddim (erken dönem) 4 eser sayar mısın?","cevap":["1. Muvatta - İmam Mâlik","2. el-Musannef - Abdurrezzak b. Hemmâm","3. el-Müsned - Ahmed b. Hanbel","4. es-Sahîh – Buhârî"]},{"alan":"Hadis Usulü","alt":"","soru":"Hadis usulünde \"Müteahhirûn\" (Son Dönem) genel eserlerine örnek veriniz.","cevap":["Subhî es-Sâlih: Ulûmü’l-Hadîs ve Mustalahuhû.","Nûreddin Itr: Menhecü’n-Nakd fî Ulûmi’l-Hadîs.","Muhammed Accâc el-Hatîb: es-Sünne Kable’t-Tedvîn.","M. Mustafa es-Sibâî: es-Sünne ve Mekânetühâ fi’t-Teşrîi’l-İslâmî."]},{"alan":"Hadis Usulü","alt":"","soru":"Hadis inkarcılığına karşı yazılmış güncel bir eser söyleyiniz.","cevap":["Öne Çıkan Yazar / Kurum Özellik","Hadis İnkarcılığı: Hadis Prof. Dr. Modern dönemdeki hadis eleştirilerini Karşıtlarının İddiaları ve Saffet madde madde ele alıp akademik Cevaplar Sancaklı cevaplar verir. I. ALE’L-EBVÂB METODU (KONULARINA GÖRE TASNİF)"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Ale’l-Ebvâb ne demektir? Bu metotla yazılan eser türleri hangileridir?","cevap":["Hadislerin fıkıh konularına (namaz, zekât, nikâh vb.) göre düzenlendiği tasnif metodudur.","Başlıca türleri: Musannef, Câmi ve Sünen’dir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Musannef türü eserlerin özelliği nedir ve en meşhur örnekleri hangileridir?","cevap":["Merfû (Hz. Peygamber’e ait) hadislerin yanı sıra mevkuf (sahabe sözü) ve maktû (tabiun sözü) rivayetleri de içeren kapsamlı eserlerdir.","İmam Mâlik (ö. 179) – el-Muvatta Abdürrezzâk b. Hemmâm (ö. 211) – el-Musannef İbn Ebî Şeybe (ö. 235) – el-Musannef"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"İmam Mâlik’in Muvatta’sı neden Musannef kategorisindedir?","cevap":["\"Çünkü içinde sadece Peygamberimizden gelen merfû hadisler değil, sahabe ve tabiun fetvaları ile Medine ehlinin ameli de bulunmaktadır\""]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Câmi türü eserler neleri kapsar? Önemli temsilcilerini sayınız.","cevap":["Dinin tüm alanlarını (akaid, ahkâm, siyer, tefsir, edep vb.) kapsayan sekiz ana bölümü içeren eserlerdir.","Buhârî (ö. 256) – el-Câmiu’s-Sahîh Müslim (ö. 261) – el-Câmiu’s-Sahîh Tirmizî (ö. 279) – el-Câmiu’s-Sahîh İbn Huzeyme (ö. 311) – es-Sahîh İbn Hibbân (ö. 354) – es-Sahîh"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Modern dönemde Buhârî üzerine Türkiye'de yapılan en önemli çalışma nedir?","cevap":["Ahmed Naim ve Kâmil Miras tarafından hazırlanan Sahîh-i Buhârî Muhtasarı Tecrîd-i Sarîh Tercümesi ve Şerhi'dir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Sünen türü eserlerin temel farkı nedir? Örnek veriniz.","cevap":["Sadece ahkâm (hukuki) hadislerini fıkıh bablarına göre sıralayan eserlerdir.","Dârimî (ö. 255) – es-Sünen İbn Mâce (ö. 273) – es-Sünen Ebû Dâvûd (ö. 275) – es-Sünen Nesâî (ö. 303) – es-Sünen (el-Müctebâ) Dârekutnî (ö. 385) – es-Sünen Beyhakî (ö. 458) – es-Sünenü’l-Kübrâ","II. ALE’R-RİCÂL METODU (RÂVİLERİNE GÖRE TASNİF)"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Ale’r-Ricâl ne demektir? Bu metotla yazılan eser türleri hangileridir?","cevap":["Hadislerin, konularına bakılmaksızın ilk râvisi olan sahabe isimlerine göre sıralandığı metodur.","Başlıca türleri: Müsned, Mu’cem ve Etrâf’tır."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Musannef ve Müsned türü eserlerin farkı nedir?","cevap":["Musannef: Hadisleri fıkıh konularına göre (Kitâbü's-Salât, Kitâbü'z-Zekât gibi) tasnif eden eserlerdir. (Örn: Abdurrezzâk ve İbn Ebî Şeybe'nin musannefleri).","Müsned: Hadisleri râvilerine göre (Hz. Ebû Bekir'in rivayetleri, Hz. Ömer'in rivayetleri gibi) tasnif eden eserlerdir. (Örn: Ahmed b. Hanbel’in Müsned'i, Tayâlisî’nin Müsned'i)."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Müsned türü eserlere hangi örnekleri verebilirsiniz?","cevap":["Hadisleri sahabe isimlerine göre (alfabetik veya müslüman oluş sırasına göre) sıralayan eserlerdir.","Ebû Dâvûd et-Tayâlisî (ö. 204) – el-Müsned Humeydî (ö. 219) – el-Müsned Ahmed b. Hanbel (ö. 241) – el-Müsned Bezzâr (ö. 292) – el-Müsned Ebû Ya’lâ el-Mevsılî (ö. 307) – el-Müsned"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Mu’cem türü eserler nedir?","cevap":["Hadislerin alfabetik olarak hocalara veya sahabi isimlerine göre dizildiği eserlerdir. Örn: Taberani'nin el-Mu’cemü’l-Kebîr'i."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Mu’cem türü eserlerin özelliği nedir? Taberânî’nin çalışmalarını sayınız.","cevap":["Hadislerin genellikle müellifin kendi hocalarının isimlerine göre sıralandığı eserlerdir. Bu sahanın en meşhur müellifi Taberânî (ö. 360)’dir ve üç önemli eseri vardır:","1. el-Mu’cemü’l-Kebîr","2. el-Mu’cemü’l-Evsat","3. el-Mu’cemü’s-Sağîr"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Etrâf türü eserlerin hadis ilmindeki işlevi nedir?","cevap":["Hadisin sadece baş tarafı (bir kısmı) verilerek, o hadisin farklı kaynaklardaki tüm senetlerinin bir arada görüldüğü fihrist mahiyetindeki eserlerdir.","En meşhur örnek: Mizzî (ö. 742) – Tuhfetü’l-Eşrâf."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Müstedrek ve Müstahrec nedir? Örnek veriniz.","cevap":["Müstedrek: Bir müellifin şartlarına uyduğu halde kitabına almadığı hadisleri toplayan eserdir.","Örn: Hâkim en-Nîsâbûrî – el-Müstedrek ale’s-Sahîhayn.","Müstahrec: Bir hadis kitabındaki hadisleri, o kitabın müellifinden farklı senetlerle rivayet eden eserdir.","Örn: Ebû Nuaym – el-Müstahrec ale’s-Sahîhayn."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Zevâid ve Cem türü eserler neyi ifade eder?","cevap":["Zevâid: Bir kitapta olup diğerinde olmayan hadisleri toplayan çalışmalardır.","Örn: Heysemî – Mecmeu’z-Zevâid.","Cem (Toplama): Birden fazla hadis kitabını tek bir eserde birleştiren çalışmalardır. o İbnü’l-Esîr – Câmiu’l-Usûl o Süyûtî – Cem’u’l-Cevâmi’ o Ali el-Müttakî – Kenzü’l-Ummâl"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Miftah ve Şerh çalışmalarına örnek veriniz.","cevap":["Miftah (Anahtar/Fihrist): Hadisleri bulmayı kolaylaştıran çalışmalardır. o Tokâdî – Miftâhu’s-Sahîhayn o Wensinck – Miftâhu Künûzi’s-Sünne / el-Mu’cemü’l-Müfehres.","Şerh: Begavî – Şerhu’s-Sünne."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Mevzu (Uydurma) hadisleri tanımak için hangi eserlere bakılmalıdır?","cevap":["İbnü’l-Cevzî (ö. 597) – el-Mevzûât. Süyûtî (ö. 911) – el-Leâli’l-Masnû’a."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Hadis derleme (antoloji) çalışmalarına örnek veriniz.","cevap":["Begavî – Mesâbîhu’s-Sünne. Hatîb et-Tebrîzî – Mişkâtü’l-Mesâbîh."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Hadis râvilerini ve güvenilirliklerini inceleyen temel rical eserleri nelerdir?","cevap":["İbn Ebî Hâtim: el-Cerh ve’t-Ta’dîl.","Mizzî: Tehzîbü’l-Kemâl (Kütüb-i Sitte râvileri için temeldir).","Zehebî: Mîzânü’l-İ’tidâl ve Siyeru A’lâmi’n-Nübelâ.","İbn Hacer: Tehzîbü’t-Tehzîb ve Takrîbü’t-Tehzîb."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Ricâl kitaplarını \"Genel\" ve \"Özel\" olarak ikiye ayırdığımızda, her iki türe hangi temel eserleri örnek verirsiniz?","cevap":["Genel Ricâl Kitapları: Belli bir dönem veya eserle sınırlı kalmadan geniş bir râvi kitlesini ele alan eserlerdir.","* İbn Sa’d (ö. 230): et-Tabakātü’l-Kübrâ * Buhârî (ö. 256): et-Târîhu’l-Kebîr * Zehebî (ö. 748): Siyeru A’lâmi’n-Nübelâ","Özel Ricâl Kitapları: Sahabe bilgisi, belli kitap râvileri (Kütüb-i Sitte gibi) veya râvilerin sika/zayıf olma vasıflarına göre yazılan eserlerdir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Ricâl Eserleri Nedir?","cevap":["Tanım: Hadisleri rivayet eden râvilerin hayatlarını, güvenilirlik durumlarını (cerh
