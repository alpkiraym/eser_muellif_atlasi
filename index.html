 ve ta'dil), doğum ve ölüm tarihlerini inceleyen eserlerdir.","Sahabe Bilgisi: İbn Hacer – el-İsâbe, İbnü’l-Esîr – Üsdü’l-Gābe.","Genel Râvi Bilgisi: İbn Ebî Hâtim – el-Cerh ve’t-Ta’dîl, Zehebî – Siyeru A’lâmi’n-Nübelâ.","Kütüb-i Sitte Râvileri: Mizzî – Tehzîbü’l-Kemâl, İbn Hacer – Tehzîbü’tTehzîb."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Ricâl edebiyatında Sahabe neslini tanımak (Marifetü's-Sahabe) amacıyla yazılan en meşhur eserler hangileridir?","cevap":["İbn Abdülber (ö. 463): el-İstîâb fî Ma’rifeti’l-Ashâb","İzzeddin İbnü’l-Esîr (ö. 630): Üsdü’l-Gābe fî Ma’rifeti’s-Sahâbe","İbn Hacer el-Askalânî (ö. 852): el-İsâbe fî Temyîzi’s-Sahâbe(Bu alanın en tekâmül etmiş eseridir)."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Kütüb-i Sitte râvilerini tanımak isteyen bir araştırmacı hangi literatür zincirini takip etmelidir?","cevap":["Bu alanda birbirine bağlı bir silsile vardır:","1. Abdülganî el-Makdisî (ö. 600): el-Kemâl fî Esmâi’r-Ricâl (Bu sahanın temelidir).","2. Mizzî (ö. 742): Tehzîbü’l-Kemâl (En kapsamlı geliştirilmiş versiyonudur).","3. Zehebî (ö. 748): Tezhîbü’t-Tehzîb ve el-Kâşif.","4. İbn Hacer (ö. 852): Tehzîbü’t-Tehzîb ve daha muhtasarı olan Takrîbü’tTehzîb.","5. el-Hazreci (ö. 900): Hulâsatü Tezhîbi’l-Kemâl."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Râvilerin sika (güvenilir) veya duafâ (zayıf) olma durumlarına göre yazılmış özel eserler hangileridir?","cevap":["Sikāt (Güvenilirler): İbn Hibbân (ö. 354) – Kitâbü’s-Sikāt.","Duafâ (Zayıf Râviler): İbn Adî (ö. 363) – el-Kâmil fî Duafâi'r-Ricâl, Zehebî (ö.","748) – el-Muğnî fî’d-Duafâ ve Mîzânü’l-İ’tidâl.","Hâfızlar (Hadis Otoriteleri): Zehebî (ö. 748) – Tezkiratü’l-Huffâz."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Cerh ve Ta’dil ilminin en temel kaynak eseri olarak kimi zikredebilirsiniz?","cevap":["İbn Ebî Hâtim (ö. 327) tarafından kaleme alınan Kitâbü’l-Cerh ve’t-Ta’dîl bu sahanın en köklü ve referans kabul edilen eseridir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Tehzîbü'l-Kemâl ile Tehzîbü't-Tehzîb arasındaki fark nedir?","cevap":["Mizzî'nin eserinin çok hacimli ve detaylı olduğundan, İbn Hacer'in ise bu eseri özetleyerek sadece cerh-tadil açısından en gerekli bilgileri rafine hale getirdiği (Tehzîbü't-Tehzîb) denilebilir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Mizzî kimdir ve hadis ilmindeki yeri nedir?","cevap":["Yûsuf b. Abdurrahman el-Mizzî, Şâfiî mezhebine mensup, Suriyeli büyük bir muhaddistir. Hadis râvilerini tanıma ve hadisleri sistemleştirme konusunda otoritedir.","En Önemli İki Eseri:","1. Tehzîbü’l-Kemâl: Kütüb-i Sitte’deki râvilerin hayatlarını ve cerh-tadil durumlarını inceleyen en kapsamlı biyografik eserdir. (İbn Hacer’in Tehzîbü’tTehzîb’i bu eserin özetidir).","2. Tuhfetü’l-Eşrâf bi-Ma’rifeti’l-Etrâf: Kütüb-i Sitte ve diğer bazı eserlerdeki hadisleri, ilk râvilerine (sahabelerine) göre tasnif eden muazzam bir \"etrâf\" kitabıdır.","Mülakat Notu (Kritik Bilgi): Mizzî, İbn Teymiyye ve Zehebî ile aynı dönemde yaşamıştır. Zehebî ve İbn Kesir gibi dev isimlerin hocasıdır. Mülakatta Mizzî sorulduğunda özellikle \"Rical ilminin (râvi bilgisi) zirve isimlerindendir\" demeniz mülakat puanınızı artıracaktır"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"\"Feyzü’l-Kadîr\" adlı eseri tanıtınız.","cevap":["Münâvî tarafından yazılmış, Süyûtî’nin el-Câmiu’s-Sağîr isimli hadis kitabının şerhidir. Eser, hadisleri genişçe şerhetmesi ve râviler hakkında bilgi vermesiyle meşhurdur; ancak müellif hadislerin sıhhati konusunda her zaman kesin yargıda bulunmaz."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"İhtilâfü’l-Hadis alanındaki eser hangisidir?","cevap":["Eser: İhtilâfü’l-Hadîs","Müellif: İmam Şafiî (Bu alandaki ilk eserdir)."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"\"Tahkik\" bir esere ne katar?","cevap":["Yazma Nüsha Karşılaştırması: Eserin müelliften çıktığı orijinal haline en yakın metni ortaya koyar.","Tahrîc: Hadislerin kaynaklarını ve sıhhat derecelerini belirler.","Ta’lik: Anlaşılması zor yerlere açıklayıcı notlar ekler.","İndeksleme: Şahıs, yer ve konu indeksleri oluşturarak eserin kullanımını"]},{"alan":"Hadis","alt":"Hadis türleri","soru":"\"Tahric\" ve \"Etrâf\" kitapları nedir? Örnek veriniz.","cevap":["Etrâf Kitapları: Hadislerin ilk kısmını (baş tarafını) vererek tüm senet zincirlerini görmeyi sağlar. En meşhuru Mizzî’nin Tuhfetü’l-Eşrâf'ıdır.","Tahric Kitapları: Fıkıh kitaplarında geçen kaynakları belirsiz hadislerin asıllarını bulup sıhhatini inceleyen eserlerdir. En meşhuru Zeylaî’nin Nasbü’r-Râye'sidir (Hidâye hadislerinin tahricidir)."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Konularına göre derlenen (Ahkâm Hadisleri) eserlere örnek veriniz.","cevap":["İbn Hacer: Bulûğu’l-Merâm.","İmam Nevevî: Riyâzü’s-Sâlihîn (Ahlak ve zühd ağırlıklı).","Mecdüddin İbn Teymiyye: Münteka’l-Ahbâr."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Garîbü’l-hadîs Nedir ve temel eserleri nelerdir?","cevap":["Tanım: Hadislerde geçen, az kullanıldığı için anlaşılması zor olan (garîb) kelimeleri ve deyimleri açıklayan ilim dalıdır.","İbnü’l-Esîr: en-Nihâye fî Garîbi’l-Hadîs (Bu sahanın en kapsamlı ve en meşhur eseridir).","Zemahşerî: el-Fâik fî Garîbi’l-Hadîs.","Kasım b. Sellâm: Garîbü’l-Hadîs."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Garîbü’l-Hadîs sahasında öne çıkan temel eserler ve müellifleri hangileridir?","cevap":["Hadislerdeki anlaşılması zor, nadir kelimeleri açıklayan bu ilim dalında şu eserler meşhurdur:","Kasım b. Sellâm (ö. 223) – Garîbü’l-Hadîs İbn Kuteybe (ö. 276) – Garîbü’l-Hadîs Zemahşerî (ö. 538) – el-Fâik fî Garîbi’l-Hadîs İbnü’l-Esîr (ö. 606) – en-Nihâye fî Garîbi’l-Hadîs (Bu sahanın en kapsamlı eseridir)."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Zemahşerî'nin hadis ilmindeki yeri nedir?","cevap":["Zemahşerî bir müfessir (Keşşâf müellifi) olmasının yanında, el-Fâik eseriyle Garîbü'l-Hadîs sahasında dil bilimci kimliğini hadis ilmine taşımıştır."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"İhtilâfü’l-Hadîs (birbiriyle çelişir gibi görünen hadisler) alanında hangi eserlere bakılır?","cevap":["İmam Şâfiî (ö. 204) – İhtilâfü’l-Hadîs (Bu sahada yazılan ilk eserdir). İbn Kuteybe (ö. 276) – Te’vîlü Muhtelifi’l-Hadîs. Tahâvî (ö. 321) – Müşkilü’l-Âsâr."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Nâsih ve Mensûh hadisleri konu alan çalışmalar nelerdir?","cevap":["Hâni Esrem (ö. 261) – Nâsihu’l-Hadîs ve Mensûhuhû. İbn Şâhin (ö. 385) – Nâsihu’l-Hadîs ve Mensûhuhû. Hâzimî (ö. 584) – el-İ’tibâr fî’n-Nâsih ve’l-Mensûh mine’l-Âsâr."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"İlelü’l-Hadîs (hadislerdeki gizli kusurlar) üzerine yazılmış eserler hangileridir?","cevap":["Ali b. el-Medînî (ö. 234) – el-İlel. Ahmed b. Hanbel (ö. 241) – Kitâbü İleli’l-Hadîs. Tirmizî (ö. 279) – Kitâbü’l-İlel. Ebû Hâtim (ö. 327) – İlelü’l-Hadîs."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Diyanet İşleri Başkanlığı’nın yayınladığı hadis eserleri nelerdir?","cevap":["• Hadislerle İslam (7 cilt, şerhli antoloji): Hadislerin konulara göre tasnif edilip açıklandığı modern külliyat; hadisleri güncel ve tematik okumak için.","• Sahîh-i Buhârî Muhtasarı Tecrîd-i Sarîh Tercemesi ve Şerhi (13 cilt): Cumhuriyet dönemindeki en kapsamlı Türkçe Buhârî tercüme ve şerhi.","• Riyâzü's-sâlihîn (3 cilt, metin ve çeviri): İmam Nevevî'nin eserinin Diyanet tarafından hazırlanan tercümesi; ahlak ve edep rehberi.","• Konulu Hadis Dizisi (çok sayıda kitapçık): \"Aile\", \"Ticaret\", \"Gençlik\" gibi başlıklarda hadis seçkileri.","• Hadislerin Dünyası (tek cilt, seçki): Genel okuyucu için sadeleştirilmiş hadis seçkisi."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Fuat Sezgin’in hadisle ilgili meşhur eseri nedir?","cevap":["Eser: Buhârî’nin Kaynakları Hakkında Araştırmalar.","Önemi: Hadislerin ilk dönemden itibaren yazılı kaynaklara dayandığını ispat eden devrim niteliğinde bir tezdir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Günümüz hadisçilerinin eserlerinden örnek veriniz.","cevap":["1. M. Yaşar Kandemir, İsmail Lütfi Çakan, Raşit Küçük: Riyâzü’s-Sâlihîn Şerhi","2. İbrahim Canan: Kütüb-i Sitte Muhtasarı Şerhi","3. Mehmet Görmez: Sünnet ve Hadisin Aktüel Değeri","4. M. Emin Özafşar: Hadis ve Kültür Yazıları","5. Enbiya Yıldırım: Hadis Problemleri","6. İsmail Lütfi Çakan: Hadis Usulü ve Hadis Edebiyatı.","7. Yaşar Kandemir: Peygamberimin Sevdiği Müslüman.","8. Yavuz Ünal: Hadis Verilerinin Değerlendirilmesinde Yöntem.","9. Salahattin Polat: Hadis Araştırmaları."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Nurettin Boyacılar kimdir ve hangi önemli tahkikleri yapmıştır?","cevap":["Kimlik: Günümüzün önemli muhakkiklerinden olup özellikle hadis ve rical alanında titiz çalışmalarıyla tanınır.","Önemli Tahkikleri: o el-Kâşif: Zehebî’nin rical ilmine dair eserinin tahkiki. o Tehzîbü’l-Kemâl: Mizzî’nin dev eserinin tahkik heyetinde yer almıştır. o Musannef (İbn Ebî Şeybe): Bu büyük hadis külliyatının en muteber tahkiklerinden biri ona aittir."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Şuayb el-Arnavut (Şuayb el-Arnâût) kimdir ve literatüre kazandırdığı dev eserler nelerdir?","cevap":["Kimlik: 20. yüzyılın en üretken ve titiz muhakkiklerinden biridir; binlerce ciltlik eseri ilim dünyasına kazandırmıştır.","Önemli Tahkikleri: o Müsned-i Ahmed b. Hanbel: 50 ciltlik devasa tahkiki en meşhur çalışmasıdır. o Siyeru Alâmi’n-Nübelâ: Zehebî’nin bu biyografik eserini 25 cilt halinde tahkik etmiştir. o Sahîh-i İbn Hibbân: Hadislerin sıhhat durumlarını belirterek tahkik etmiştir. o Şerhu Müşkili’l-Âsâr: Tahâvî’nin eserini tahkik ederek yayınlamıştır."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Muhammed Zâhid el-Kevserî’nin tahkik ve ihya çalışmaları nelerdir?","cevap":["Kimlik: Son devir Osmanlı ulemasından olup, sürgünde bulunduğu Mısır'da unutulmaya yüz tutmuş pek çok temel eseri tahkik ederek yeniden ilim dünyasına kazandırmıştır. \"Ehl-i Sünnet’in müdafii\" olarak bilinir.","Önemli Tahkik ve İhya Çalışmaları: o Nasbü’r-Râye: Zeylaî’nin bu devasa hadis-fıkıh eserinin neşrine öncülük etmiş ve mukaddimesini yazmıştır. o el-Esmâ ve’s-Sıfât: Beyhakî’nin akideye dair eserini tahkik etmiştir.","Te’nîbü’l-Hatîb: Daha önce geçtiği üzere, İmam Ebû Hanîfe savunmasıdır.","İhkāku’l-Hakk: Şiî ve Mutezilî görüşlere karşı Ehl-i Sünnet savunması içeren eserlerin ihyası."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Türkiye’deki hadis çalışmalarını açısından öncü hocalardan sayınız.","cevap":["M. Emin Saraç (ö. 2021): Klasik medrese geleneğini İstanbul'da devam ettiren, pek çok hadis talebesi yetiştiren ve Sahîh-i Buhârî okutmalarıyla bilinen bir otoritedir.","Muhammed Tayyip Okiç (ö. 1977): Türkiye’deki İlahiyat fakültelerinde hadis metodolojisinin kurucusu kabul edilir. Boşnak asıllıdır ve akademik hadisçiliğin öncüsüdür.","Talat Koçyiğit (ö. 2011): Hadis Usulü ve Hadis Tarihi kitapları, Türkiye'deki akademik eğitimin temel taşlarındandır.","M. Yaşar Kandemir: Özellikle hadislerin halkın anlayacağı şekilde şerh edilmesi (Riyâzu's-Sâlihîn Şerhi gibi) ve hadis edebiyatı alanında çok kıymetli çalışmaları vardır.","İsmail Lütfi Çakan: Hadis usulü, hadis edebiyatı ve sünnetin savunulması konularında yetkindir.","Raşit Küçük (ö. 2022): Hadis ve siyer ilmine yaptığı katkılar ve Riyâzu'sSâlihîn şerhindeki emeği ile tanınır."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"İslam Dünyasındaki Tanınmış Hadisçilerden sayınız.","cevap":["Muhammed Avvâme: Suriye asıllı yaşayan büyük bir muhaddistir. Hadislerin fıkıhla ilişkisi ve tahkik (eserlerin aslına uygun yayını) konusunda dünya çapında otoritedir.","Nâsıruddin el-Elbânî (ö. 1999): Hadislerin sıhhati üzerine yaptığı devasa çalışmalarla (Silsiletü'l-Ehâdîsi's-Sahîha gibi) tanınır.","Abdülfettâh Ebû Gudde (ö. 1997): Hadis usulü ve rical ilmi üzerine yaptığı tahkikler ve yazdığı eserlerle modern dönemin en büyük muhaddislerinden biri sayılır.","Şuayb el-Arnavût (ö. 2016): Onlarca klasik hadis kitabının (Müsned-i Ahmed gibi) tahkikini yaparak ilim dünyasına kazandırmıştır."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Tayyip Okiç'in önemi nedir?","cevap":["Kendisi Türkiye'de akademik hadis usulünün kurucusudur. Hem klasik Arapça literatüre hem de Batı dillerine hakimiyetiyle, hadis ilmini modern akademik bir disiplin olarak sistemleştirmiştir.\""]},{"alan":"Hadis","alt":"Hadis türleri","soru":"\"Muvafakat-ı Ömer\" nedir ve bu konudaki eser hangisidir?","cevap":["Tanım: Hz. Ömer’in içtihat ve görüşlerinin, daha sonra inen vahiyle teyit edilmesi durumudur.","Eser: Nurü'l-Gurer fî Muvâfakāti Ömer","Müellif: Celâleddin es-Süyûtî."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Muhammed Hamidullah’ın İslam düşüncesine katkıları nelerdir?","cevap":["• Hukuk: İslam devletler hukukunu bilimsel bir disiplin olarak modern dünyaya tanıtmıştır (İslam'da Devlet İdaresi).","• Siyer: Hz. Peygamber'in hayatını diplomatik, askerî ve idarî açılardan belge ve coğrafi verilere dayanarak incelemiştir (İslam Peygamberi).","• Hadis: Hadislerin erken dönemde yazıldığını gösteren en eski yazılı metinlerden Hemmâm b. Münebbih'in Sahîfe'sini bulup yayımlamıştır.","• Diplomasi tarihi: İlk İslam devletine ait mektup, antlaşma ve siyasi belgeleri derlemiştir (el-Vesâiku's-siyâsiyye).","• Tebliğ: Fransızca Kur'an meali ile İslam'ın Batı'da doğru tanınmasına katkı sağlamıştır.","• Akademik metot: Hukuk, tarih ve filolojiyi birleştiren disiplinlerarası bir yöntem geliştirmiştir (İslam'a Giriş).","• Literatür ihyası: Avrupa kütüphanelerinde unutulmuş nadir yazmaları bulup ilim dünyasına kazandırmıştır."]},{"alan":"Hadis","alt":"Hadis türleri","soru":"Diyanet İşleri Başkanlığı'nın Siyer alanındaki temel yayınlarından örnekler veriniz.","cevap":["Peygamberimizin Hayatı - İrfan Yücel Hz. Muhammed ve Hayatı - Casim Avcı, Mevlâna İdris Siyer-i Nebi - Osman Keskioğlu Alemlere Rahmet Hz. Muhammed- İsmail Karagöz Hâtemü’l-Enbiya Hz. Muhammed ve Hayatı - Ali Himmet Berki, Osman Keskioğlu Hz. Muhammed'in Hayatı - İbrahim Sarıçam"]},{"alan":"Tefsir","alt":"","soru":"Tefsirler yöntem (metot) bakımından kaça ayrılır? Temel farkları nelerdir?","cevap":["Temel olarak ikiye ayrılır:","1. Rivayet Tefsirleri: Ayetleri; hadisler, sahabi ve tabiin sözleriyle açıklayan, nakle dayalı tefsirlerdir.","2. Dirayet Tefsirleri: Naklin yanında akıl, dil, fıkıh ve kelâm gibi ilmi çıkarımlara dayanan, içtihadın ön planda olduğu tefsirlerdir."]},{"alan":"Tefsir","alt":"","soru":"Rivayet tefsiri sahasında en önemli eserler ve müellifleri hangileridir?","cevap":["Taberî: Câmiu’l-Beyân fî Te’vîli Âyi’l-Kur’ân (Rivayet tefsirlerinin anası kabul edilir).","Ebû’l-Leys es-Semerkandî: Tefsîru’l-Kur’âni’l-Azîm.","Begavî: Meâlimü’t-Tenzîl.","İbn Kesîr: Tefsîru’l-Kur’âni’l-Azîm (Hadislerle tefsir konusunda en çok tercih edilendir).","Süyûtî: ed-Dürrü’l-Mensûr (Tamamen rivayetlerden oluşur, yorum içermez)."]},{"alan":"Tefsir","alt":"","soru":"Dirayet (Aklî/İlmî) tefsir ekolünün \"olmazsa olmaz\" 5 temel eserini sayınız.","cevap":["1. Maturidi: Te’vîlâtü’l-Kur’ân (Ekolün öncüsüdür).","2. Zemahşerî: el-Keşşâf (Dil ve belâgat zirvesidir).","3. Beyzâvî: Envâru’t-Tenzîl (Medreselerin temel ders kitabıdır).","4. Nesefî: Medârikü’t-Tenzîl.","5. Ebüssuûd Efendi: İrşâdü’l-Akli’s-Selîm (Osmanlı tefsir geleneğinin zirvesidir)."]},{"alan":"Tefsir","alt":"","soru":"Dirayet tefsirlerini kendi içinde hangi alt dallara ayırabiliriz?","cevap":["1. Lügavî (Dilbilimsel) Tefsirler","Kur’an’ın belagatı, i’cazı, kelime anlamları ve nahiv (gramer) kuralları üzerine yoğunlaşan tefsirlerdir.","Örnek: Zemahşerî – el-Keşşâf","2. Fıkhî (Hukuki) Tefsirler","Ahkâm ayetlerini inceleyerek İslam hukukuna dair hükümler çıkaran tefsirlerdir.","Örnek: Kurtubî – el-Câmi' li-Ahkâmi'l-Kur'ân","3. Kelâmî (İtikadi) Tefsirler","İnanç esaslarını akli delillerle savunmayı ve farklı mezheplerin görüşlerini temellendirmeyi amaçlayan tefsirlerdir.","Örnek: Fahreddin er-Râzî – Mefâtîhu’l-Gayb","4. İşârî (Tasavvufi) Tefsirler","Ayetlerin zahiri anlamlarının yanı sıra, manevi işaretler ve keşif yoluyla elde edilen batıni anlamlarını ele alan tefsirlerdir.","Örnek: Kuşeyrî – Letâifü’l-İşârât","5. Felsefî Tefsirler","Ayetleri felsefi teoriler ve akli çıkarımlarla, varlık ve kozmoloji ekseninde yorumlayan tefsirlerdir.","Örnek: İbn Sînâ ve İhvan-ı Safa’nın tefsir risaleleri.","6. İçtimaî (Sosyal) Tefsirler","Modern dönemde ortaya çıkan, Kur’an’ın sosyal sorunlara çözüm getirmesini ve toplumun ıslahını hedefleyen tefsirlerdir.","Örnek: Reşid Rıza – Tefsîru’l-Menâr veya Mevdudi – Tefhimu’l-Kur’an","7. Bilimsel (İlmî) Tefsirler","Ayetleri modern bilimsel keşifler ve fen bilimlerindeki veriler ışığında yorumlayan tefsirlerdir.","Örnek: Tantâvî Cevherî – el-Cevâhir fî Tefsîri’l-Kur’âni’l-Kerîm"]},{"alan":"Tefsir","alt":"","soru":"Kelâmî (Mezhebî) tefsirler ve temsilcileri hangileridir?","cevap":["Zemahşerî: el-Keşşâf (Mu’tezile ekolünün en güçlü tefsiridir).","Fahreddin er-Râzî: Mefâtîhu’l-Gayb (Eş’arî ekolü, aklî ve felsefî derinliği yüksektir).","Maturidi: Te’vîlâtü’l-Kur’ân (Maturidi ekolünün kurucu metnidir).","Tabatabai: el-Mîzân (Şîa dünyasının önemli eserlerindendir).","Zeydiye: Şevkânî – Fethu’l-Kadîr.(Rivayet ve dirayeti birleştiren, ahkâm ağırlıklı ve mezhepler üstü bir tefsirdir.)"]},{"alan":"Tefsir","alt":"","soru":"Fıkhî (Ahkâm) tefsirleri mezheplerine göre sayınız.","cevap":["Mukātil b. Süleyman: Tefsîru’l-Hams Mie Âye (İlk fıkhî tefsir).","Cessâs: Ahkâmu’l-Kur’ân (Hanefî).","İmam Şâfiî: Ahkâmu’l-Kur’ân (Şâfiî).","Ebû Bekir İbnü’l-Arabî: Ahkâmu’l-Kur’ân (Mâlikî).","Kurtubî: el-Câmi’ li-Ahkâmi’l-Kur’ân (Mâlikî - En kapsamlı ahkâm tefsiridir)."]},{"alan":"Tefsir","alt":"","soru":"Zemahşerî’nin el-Keşşâf’ı tefsir tarihinde neden bir \"devrim\" olarak kabul edilir?","cevap":["Çünkü Kur’an-ı Kerîm’in belâgat, i’câz ve dil inceliklerini sistemli bir şekilde ortaya koyan ilk ve en güçlü dirayet tefsiridir. Kur'an'ın edebî mucizesini ispat etmek için Arap dilinin tüm imkanlarını kullanmıştır. Kendisinden sonra gelen hemen hemen tüm dirayet tefsirleri (Beydâvî ve Nesefî dahil) onun dil analizlerini temel almıştır."]},{"alan":"Tefsir","alt":"","soru":"Zemahşerî’nin tefsiri bu kadar başarılıyken, Ehl-i Sünnet alimleri neden ona karşı mesafeli durmuş veya şerhler yazma ihtiyacı duymuştur?","cevap":["Temel sebep itikat farkıdır. Zemahşerî, Mu’tezile mezhebine mensuptur ve tefsirinde Mu’tezile’nin beş esasını (usûl-i hamse) savunmak için ayetleri bu doğrultuda tevil etmiştir Ehl-i Sünnet alimleri, onun dil dehasından faydalanmak istemiş ancak itikadi hatalarını ayıklamak için üzerine şerh ve hâşiyeler yazmışlardır."]},{"alan":"Tefsir","alt":"","soru":"Kadı Beydâvî’nin tefsir tarihindeki yeri nedir? Eserinin ayırıcı özellikleri nelerdir?","cevap":["Müellif: Kadı Beydâvî (ö. 685/1286), İran’ın Beyzâ bölgesinde doğmuş, Şâfiî fakihi ve Eş’arî kelâmcısıdır.","Eserin Mahiyeti: Tam adı Envâru’t-Tenzîl ve Esrâru’t-Te’vîl’dir.","Kaynakları: Beydâvî, tefsirini hazırlarken üç ana kaynaktan beslenmiştir:","1. Zemahşerî (el-Keşşâf): Dil ve belâgat yönünü almıştır.","2. Fahreddin er-Râzî (Mefâtîhu’l-Gayb): Kelâmi ve felsefi derinliğini almıştır.","3. Râgıb el-İsfahânî (Müfredât): Kelime analizlerini almıştır.","Önemi: * İcâz (Özlülük): Çok derin meseleleri çok az kelimeyle anlatma (veciz üslup) sanatının zirvesidir. ▪ Osmanlı Geleneği: Osmanlı medreselerinde \"Tefsir-i Şerîf\" olarak bilinir ve en üst düzey ders kitabı olarak yüzyıllarca okutulmuştur. ▪ Hâşiyeleri: Üzerine 300'den fazla çalışma yapılmıştır. En meşhuru Osmanlı şeyhülislamlarından Şeyhzâde’nin hâşiyesidir.","Özellikle: Beydâvî, Zemahşerî’nin Keşşâf’ındaki Mu’tezilî fikirleri ayıklayarak Ehl-i Sünnet akidesine göre yeniden harmanladığı için Ehl-i Sünnet dünyasında Keşşâf'ın yerini almıştır."]},{"alan":"Tefsir","alt":"","soru":"Kadı Beydâvî’nin Envâru’t-Tenzîl eserini Zemahşerî’nin tefsirinden ayıran en temel özellik nedir?","cevap":["Beydâvî, Zemahşerî’nin Keşşâf’ındaki üstün belâgat bilgilerini almış, ancak bunları Ehl-i Sünnet (Eş’arî) akidesiyle yeniden harmanlamıştır. Ayrıca Fahreddin er-Râzî’nin felsefi-kelami derinliğini de ekleyerek daha rafine, daha kısa (veciz) ve itikadi açıdan \"güvenli\" bir sentez oluşturmuştur."]},{"alan":"Tefsir","alt":"","soru":"Osmanlı medreselerinde tefsir derslerinde neden özellikle Beydâvî tefsiri tercih edilmiştir?","cevap":["İki temel sebebi vardır:","1. İcâz (Özlülük): Beydâvî çok derin meseleleri çok az kelimeyle anlatır, bu da talebenin zihnini keskinleştirir.","2. Akademik Seviye: Hem dil hem kelâm hem de fıkıh konularını dengeli bir şekilde içermesi, onu bir \"üst ihtisas\" kitabı haline getirmiştir. Üzerine yazılan Şeyhzâde Hâşiyesi ile Osmanlı tefsir kültürünün merkezine yerleşmiştir."]},{"alan":"Tefsir","alt":"","soru":"Ebu’l-Berekat en-Nesefî Kimdir ve eserleri nelerdir?","cevap":["Asıl adı Abdullah b. Ahmed b. Mahmûd en-Nesefî'dir; künyesi Ebü'l-Berekât, lakabı Hâfızüddîn'dir (ö. 710). Nesef'te doğmuş, ömrünün büyük kısmını orada ve Buhara'da geçirmiştir. Fıkıh, usul, kelam ve tefsirde yazdığı eserler yüzyıllarca medreselerde ders kitabı olarak okutulmuştur.","• Tefsir – Medârikü't-tenzîl ve hakāiku't-te'vîl: Ehl-i sünnet çizgisinde, dil ve fıkhî hükümlere odaklanan, medreselerde en çok okunan tefsirlerden.","• Fıkıh – Kenzü'd-dekâik: Hanefî mütûn-i erbaasından; son derece sistematik.","• Fıkıh usulü – Menârü'l-envâr: Hanefî usulünün en meşhur metni; üzerine onlarca şerh yazılmıştır.","• Kelam – el-Umde / el-İ'timâd: Mâtürîdî akidesini savunan ve sistemleştiren temel eseri."]},{"alan":"Tefsir","alt":"","soru":"Ebü’l-Berekât en-Nesefî ve tefsiri hakkında bilgi veriniz.","cevap":["1. Müellif: Ebü’l-Berekât en-Nesefî (v. 710)","Kimliği: Asıl adı Abdullah b. Ahmed’dir. Hanefî fakihi, usulcü ve kelâm âlimidir.","İlmi Derecesi: Sadece tefsirde değil, fıkıhta (Kenzü’d-Dekāik) ve usulde (elMenâr) temel metinlerin yazarıdır.","Çizgisi: İtikatta Mâtürîdî, amelde Hanefî ekolünün en sadık savunucularındandır.","2. Eser: Medârikü’t-Tenzîl ve Hakāikü’t-Te’vîl Bu tefsir, klasik dönem tefsirlerinin bir \"özeti ve rafineleri\" mahiyetindedir.","Temel Metodolojik Özellikleri:","Mûtedil Hacim: Ne çok uzun (hacimli tefsirler gibi) ne de çok kısadır; orta yolu tercih etmiştir.","Dirayet Ağırlıklı: Dil, belâgat ve akli istidlal ön plandadır.","Kaynakları: Zemahşerî’nin (Keşşâf) dil inceliklerini ve Beyzâvî’nin (Envârü’tTenzîl) metodolojisini esas almış, ancak onları Ehl-i Sünnet süzgecinden geçirmiştir.","3. İçerik ve Tasnif Yapısı Kategori Nesefî'nin Yaklaşımı Mâtürîdî çizgisindedir. Mutezile ve Cebriyye gibi fırkaların görüşlerini İtikad (Kelâm) reddeder. Hanefî mezhebinin delillerini ayetlerle temellendirir; ihtilaflı Fıkıh (Ahkâm) konularda kısa ve öz bilgi verir. Ayetlerin i'rabı, bedî ve beyân inceliklerine yoğunlaşır. Kelime Dil ve Belâgat analizleri çok güçlüdür. Yedi meşhur kıraate (Seb'a) yer vererek anlamın nasıl değiştiğini Kıraat açıklar. Rivayet / İsrailiyat türü hurafelerden ve uydurma rivayetlerden titizlikle kaçınır. İsrailiyat","4. Eserin Tarihsel Önemi","Medrese Müfredatı: Osmanlı medreselerinde yüzyıllarca tefsir derslerinin ana kitabı (ders kitabı) olarak okutulmuştur.","Güvenilirlik: Ehl-i Sünnet akidesini dil ve mantık kurallarıyla en saf haliyle savunduğu için \"muteber\" kabul edilmiştir.","Edebi Değer: Kur'an'ın mucizevi yönünü (i'caz) belâgat kurallarıyla açıklamada oldukça başarılıdır.","Özetle: Nesefî Tefsiri; Zemahşerî’nin dilini, Beyzâvî’nin metodunu ve Mâtürîdî’nin akidesini tek bir potada eriten akademik bir şaheserdir."]},{"alan":"Tefsir","alt":"","soru":"Ebü’l-Berekât en-Nesefî’nin Medârikü’t-Tenzîl tefsirinin \"Hanefî dünyası\" için önemi nedir?","cevap":["Nesefî, hem Beydâvî’den hem de Zemahşerî’den beslenmiş ancak tefsirini tamamen Hanefî fıkhı ve Mâtürîdî akidesi üzerine inşa etmiştir.","Ahkâm ayetlerinde Hanefî mezhebini savunur. Beydâvî’ye göre dili daha sade ve anlaşılırdır. İsrailiyata ve felsefi boğulmalara girmediği için Hanefî camiasında en çok güvenilen \"müfredat tefsiri\" olmuştur."]},{"alan":"Tefsir","alt":"","soru":"Fahreddin Râzî ve eseri hakkında bilgi veriniz.","cevap":["Fahreddin Râzî Kimdir? (1149 - 1209)","Aklî ve Naklî İlimlerin Köprüsü: Râzî, Eş'arî kelâmı ile Meşşâî felsefesini (İbn Sînâ geleneği) sentezlemeye çalışmıştır. Gazâlî’den sonra felsefeyi kelâm ilminin içine tam anlamıyla dâhil eden isimdir.","Eleştirel Düşünce: \"İmâmü’l-Müşekkikîn\" (Şüphecilerin Önderi) olarak anılır. Bu lakabı, yerleşik kanaatleri derinlemesine sorgulaması ve bir konudaki tüm ihtimalleri, karşı görüşleri en güçlü şekilde ortaya koyup sonra cevaplaması nedeniyle almıştır.","Mefâtîhu’l-Gayb (Tefsîr-i Kebîr) Bu eser, yaklaşık 32 ciltten oluşan devasa bir bilgi hazinesidir. Onu diğer tefsirlerden ayıran temel özellikler şunlardır:","Ansiklopedik Karakter: Râzî, bir ayeti açıklarken o ayetin işaret ettiği felsefi, mantıki veya bilimsel bir mesele varsa konuyu tüm boyutlarıyla tartışır. Örneğin, bir ayette göklerden bahsediliyorsa dönemin astronomi bilgisini; bir hukuk kuralından bahsediliyorsa fıkıh usulü tartışmalarını esere taşır.","Sistematik ve Mantık: Râzî, konuyu maddeler halinde, \"meseleler\" ve \"vecihler\" (yönler) şeklinde bölerek anlatır. Bu yöntem, karmaşık konuların bile sistemli bir şekilde kavranmasını sağlar.","İtirazlara Cevap: Özellikle kendi dönemindeki Mutezile gibi farklı ekollerin görüşlerini dürüstçe zikreder ve ardından kendi delilleriyle onları çürütmeye çalışır.","\"İçinde Tefsirden Başka Her Şey Var\" Eleştirisi Bu meşhur söz, genellikle Ebû Hayyân el-Endelüsî'ye atfedilir. Ancak bu ifade aslında bir \"yerme\" değil, eserin hacmine ve derinliğine yönelik hayranlık karışık bir tespittir. Râzî’ye göre kainattaki her ilim Allah'ı tanımaya (marifetullah) bir vesiledir; dolayısıyla astronomi veya tıp anlatmak, Kur'an'ın \"bakmaz mısınız, düşünmez misiniz?\" çağrısını yerine getirmektir. Diğer Önemli Eserleri Râzî sadece tefsiriyle değil, şu eserleriyle de otoritedir:","1. el-Mahsûl: Fıkıh usulü alanında yazılmış en temel dört kaynaktan biri sayılır.","2. el-Metâlibü’l-Âliye: Kelâm ve felsefenin zirve noktası kabul edilen, ömrünün sonunda yazdığı eseridir.","3. Muhassal: Felsefe ve kelâm düşüncelerini özetlediği, medreselerde yüzyıllarca okutulan el kitabıdır."]},{"alan":"Tefsir","alt":"","soru":"Bu üç müfessiri kronolojik olarak sıralayıp vefat tarihlerini söyleyebilir misiniz?","cevap":["1. Zemahşerî: (v. 538/1144) - Ekolün öncüsü.","2. Kadı Beydâvî: (v. 685/1286) - Ekolü Ehl-i Sünnet'e taşıyan.","3. Nesefî: (v. 710/1310) - Ekolü Hanefî-Maturidî çizgide sabitleyen."]},{"alan":"Tefsir","alt":"","soru":"Elimizde üç tefsir var: Biri Mu'tezilî belâgat zirvesi, biri Eş'arî veciz sentez, biri Hanefî-Maturidî muhtasar metin. Hangisi hangisidir?","cevap":["Belâgat zirvesi Zemahşerî'nin Keşşâf'ı, Eş'arî veciz sentez Beydâvî'nin Envâru't-Tenzîl'i, Hanefî-Maturidî muhtasar metin ise Nesefî'nin Medârik'idir.\""]},{"alan":"Tefsir","alt":"","soru":"Edebi, Filolojik ve Mezhebî tefsirleri örneklerle açıklayınız.","cevap":["Edebi Tefsir: Kur’an’ın i'câzını ve belagatını ön plana çıkarır. Örn: Âişe Abdurrahman (Bintü’ş-Şâtî) – et-Tefsîru’l-Beyânî li’l-Kur’âni’l-Kerîm","Filolojik Tefsir: Ayetleri dil kuralları, lügat ve şiirle açıklar. Örn: Ferrâ Meâni’l-Kur’ân","Mezhebî Tefsir: Mensup olunan ekolün (Şia, Mutezile vb.) görüşlerini destekleyen yorumlar içerir. Örn: Tabersî - Mecmau’l-Beyân (Şia)."]},{"alan":"Tefsir","alt":"","soru":"Seyyid Kutub’un \"Fî Zılâli’l-Kur’ân\"ı hakkındaki düşünceleriniz nelerdir?","cevap":["Bu tefsir Edebî-İçtimâî bir tefsirdir. Kur’an’ı teorik bir bilgi kaynağı değil, pratik bir hayat rehberi ve hareket metodu olarak görür.","Değerlendirme: Kur’an’ın \"rabbani nizam\" oluşuna yaptığı vurgu ve modern cahiliye kavramına getirdiği eleştirilerle etkili olmuştur. Ancak yer yer sert siyasi üslubu, ilmi derinlikten ziyade davetçi kimliğiyle değerlendirilmelidir."]},{"alan":"Tefsir","alt":"","soru":"İlhâdi ve Bilimsel tefsir nedir?","cevap":["İlhâdi Tefsir: Kur’an’ı İslam’ın temel inançlarına aykırı, saptırıcı (Bâtınî, Marksist vb.) ideolojilerle yorumlama çabasıdır.","Bilimsel Tefsir: Ayetleri modern astronomi, fizik ve tıp gibi fen ilimleriyle açıklama metodudur. Örn: Tantâvî Cevherî - el-Cevâhir."]},{"alan":"Tefsir","alt":"","soru":"Tefsir ilminde \"İlmî Tefsir\" ve \"İçtimâî Tefsir\" arasındaki fark nedir? Birer örnek veriniz.","cevap":["İlmî Tefsir: Kur’an ayetlerini modern bilimsel keşiflerle açıklama çabasıdır. En meşhur örneği Tantâvî Cevherî’nin el-Cevâhir’idir.","İçtimâî Tefsir: Kur’an’ın doğrudan hayatın içinde olduğunu ve toplumsal sorunlara (cehalet, sömürü vb.) çözüm sunduğunu savunan modern ekoldür. En meşhur örneği Abduh ve Reşid Rıza’nın el-Menâr tefsiridir."]},{"alan":"Tefsir","alt":"","soru":"Aşağıdaki tefsirlerin müelliflerini belirtiniz.","cevap":["Mefâtîhu’l-Gayb: Fahreddin er-Râzî (Tefsir-i Kebîr olarak da bilinir).","et-Tahrîr ve’t-Tenvîr: İbn Âşûr (Tunuslu alim, makâsıd odaklı modern bir dirayet tefsiridir).","Mehâsinü’t-Te’vîl: Kāsımî."]},{"alan":"Tefsir","alt":"","soru":"Dil bilimsel (Lüğavî) ve Tasavvufî (İşârî) tefsirlere örnekler veriniz.","cevap":["1. Dil Bilimsel (Lüğavî) Tefsirler Bu eserler Kur'an'ın kelime yapısı, i'rabı (grameri), belâgatı ve edebî incelikleri üzerine yoğunlaşır.","el-Keşşâf: Zemahşerî (Bu alanın en zirve eseridir; Kur'an'ın edebî mucizeliğini ortaya koyar).","el-Bahrü’l-Muhît: Ebû Hayyân el-Endelüsî (Nahiv ve gramer ağırlıklı bir tefsirdir).","Envârü’t-Tenzîl ve Esrârü’t-Te’vîl: Beyzâvî (Dil inceliklerini kısa ve öz bir şekilde sunar).","İrşâdü’l-Akli’s-Selîm: Ebüssuûd Efendi (Osmanlı dönemi belâgat tefsirinin en önemli örneğidir).","Mecâzü’l-Kur’ân: Ebû Ubeyde (Dilsel tefsirin ilk ve en eski örneklerinden biridir).","2. Tasavvufî (İşârî) Tefsirler Bu eserler, ayetlerin zahirî (görünen) anlamlarının ötesinde, manevi tecrübe ve keşif yoluyla kalbe doğan derin işaretleri (işâret) konu alır.","Letâifü’l-İşârât: Kuşeyrî (İşârî tefsirin en dengeli ve sistemli örneği kabul edilir).","Tefsîrü’l-Kur’âni’l-Azîm: Sehl b. Abdullah et-Tüsterî (Tasavvufî tefsirin ilk nüvelerini taşıyan klasik bir eserdir).","Rûhu’l-Beyân: İsmail Hakkı Bursevî (Anadolu coğrafyasında en çok okunan, vaaz ve irşad diliyle yazılmış kapsamlı bir eserdir).","Hakâiku’t-Tefsîr: Sülemî (İlk dönem sûfîlerin ayet yorumlarını derleyen bir kaynaktır).","Rûhu’l-Meânî: Âlûsî (Aslında genel bir dirayet tefsiri olsa da, ayetlerin sonunda yaptığı işârî yorumlarla bu alanda da çok güçlüdür).","Mülakat İçin Bilgi Notları:","\"Tefsirlerin Şahı\" Kimdir? Mülakatta sorulursa, dil ve belâgat yönünden Zemahşerî'nin el-Keşşâf'ı, aklî derinlik yönünden Râzî'nin Mefâtîhu’l-Gayb'ı zikredilir.","Beyzâvî’nin Önemi: Envâru’t-Tenzîl adlı eseri hem dil bilimsel hem de kelâmî (Eş’arî) unsurları birleştirdiği için Osmanlı medreselerinde yüzyıllarca temel ders kitabı olarak okutulmuştur.","Zemahşerî Notu: Zemahşerî Mu'tezilî olsa da, Kur'an'ın belâgatını açıklamaktaki başarısından dolayı Ehl-i Sünnet alimleri tarafından da takdir edilmiş ve eserine birçok şerh/hâşiye yazılmıştır."]},{"alan":"Tefsir","alt":"","soru":"Ebüssuûd Efendi hangi dönemde yaşamıştır ve meşhur eseri nedir?","cevap":["16. yüzyıl Osmanlı (Kanuni Sultan Süleyman) döneminde yaşamıştır. En meşhur eseri, belagat yönüyle çok kuvvetli bir dirayet tefsiri olan İrşâdü’lakli’s-selîm’dir."]},{"alan":"Tefsir","alt":"","soru":"Ebüssuûd Efendi tefsirinin ayırıcı özelliği nedir?","cevap":["Kur'an'ın nazmındaki belâgat inceliklerini (münasebetü'l-âyât) ve Osmanlı hukuk/fıkıh anlayışını dirayet metoduyla en iyi yansıtan eser olmasıdır."]},{"alan":"Tefsir","alt":"","soru":"\"Tefsîru’l-Celâleyn\" ismi nereden gelmektedir?","cevap":["İki Celâl’in (Celâleddin el-Mahallî ve öğrencisi Celâleddin es-Süyûtî) ortak çalışması olduğu için bu ismi almıştır. Mahallî’nin yarım bıraktığı eseri Süyûtî kırk günde tamamlamıştır. Celâleddin el-Mahallî (Kehf suresinden sona kadar ve Fatiha) ile öğrencisi Celâleddin es-Süyûtî (Bakara’dan İsra’ya kadar) tarafından yazılmıştır. Ayetlerin i'rabını, kelime anlamlarını ve nüzul sebeplerini en az kelimeyle ifade eden, \"hacmi Kur'an kadardır\" denilen çok bereketli bir tefsirdir."]},{"alan":"Tefsir","alt":"","soru":"Sâvî’nin kitabı hangi alandadır?","cevap":["Hâşiyetü’s-Sâvî, Tefsir alanındadır (Celaleyn tefsiri üzerine yazılmış bir haşiyedir)."]},{"alan":"Tefsir","alt":"","soru":"\"Hulâsatü’l-Beyân fî Tefsîri’l-Kur’ân\" kimin eseridir?","cevap":["Müellif: Mehmed Vehbi Efendi (Konyalı)."]},{"alan":"Tefsir","alt":"","soru":"Safvetü’t-Tefâsir ne demektir, nasıl bir tefsirdir ve müellifi kimdir?","cevap":["Müellif: Muhammed Ali es-Sâbûnî.","Anlamı: \"Tefsirlerin Özü\" demektir.","Metodu: Taberî, Keşşaf, Râzî, Kurtubî ve İbn Kesîr gibi temel tefsirlerin bir özeti mahiyetindedir. Modern, anlaşılır ve eğitim odaklı (ders kitabı niteliğinde) bir tefsirdir."]},{"alan":"Tefsir","alt":"","soru":"Cumhuriyet Dönemi ilk tefsir ve ilk meal çalışması kime aittir?","cevap":["Tefsir Çalışması: Hak Dini Kur’an Dili - Elmalılı Hamdi Yazır.","Meal Çalışması (İlk Müstakil): Kur’ân-ı Kerîm ve Meâl-i Şerîfi - İzmirli İsmail Hakkı. (Elmalılı'nın tefsiri meal de içerir ancak İzmirli'ninki doğrudan bu amaçla basılmıştır)."]},{"alan":"Tefsir","alt":"","soru":"İlim dünyasındaki “Nesefi” ismiyle meşhur alimler kimlerdir?","cevap":["İlim dünyasındaki en meşhur Nesefîler şunlardır:","1. Ebu’l-Muîn en-Nesefî (v. 508/1114) (Kelamın Zirvesi) Mâtürîdî akidesinin İmam Mâtürîdî’den sonraki en büyük savunucusu ve sistemleştiricisidir.","Önemi: Mâtürîdîliği delilleriyle temellendirmiş ve Eş'arîlik karşısında bağımsız bir ekol olarak güçlenmesini sağlamıştır.","En Meşhur Eseri: Tabsiratü’l-Edille. Bu eser, Mâtürîdî kelamının en kapsamlı kaynağıdır.","Alanı: Kelam (Akait).","2. Ömer en-Nesefî (Ebû Hafs Necmeddin en-Nesefî)(v. 537/1142) (Akait Metni Yazarı) İslam dünyasında en çok bilinen ve ezberlenen \"akide\" metninin yazarıdır. Çok yönlü bir âlim olması hasebiyle \"Müftiyü’s-sekaleyn\" (insanların ve cinlerin müftüsü) lakabıyla anılır.","Önemi: İslam inanç esaslarını çok kısa, öz ve anlaşılır bir metin haline getirmiştir. Bu metin üzerine onlarca şerh yazılmıştır (en meşhuru Teftâzânî’nin şerhidir).","En Meşhur Eseri: el-Akāidü’n-Nesefiyye (Nesefî Akaidi).","Alanı: Kelam, fıkıh, tefsir ve tarih.","3. Ebu’l-Berekat en-Nesefî (v. 710/1310) (Fıkıh ve Tefsir Otoritesi) Hanefî mezhebinin sistem kurucularından olan alimdir.","Önemi: Hem hukukçu (fakih) hem de müfessirdir. Eserleri Osmanlı ve dünya medreselerinde yüzyıllarca \"ders kitabı\" olarak okutulmuştur.","En Meşhur Eserleri: Kenzü’d-Dakāik (Fıkıh), Medârik (Tefsir).","Öne Çıkan Eserleri: o Medârikü’t-Tenzîl: Çok rağbet gören bir tefsir kitabıdır. o Kenzü’d-Dekāik: Hanefî fıkhının en temel dört metninden (mütûn-ı erbaa) biridir. o Menârü’l-Envâr: Fıkıh usulü alanında yazılmış çok meşhur bir eserdir.","Alanı: Fıkıh, Fıkıh Usulü, Tefsir.","4. Azizüddin en-Nesefî (v. 700/1300 [?] (Tasavvuf ve Felsefe) Bu isim diğerlerinden farklı olarak tasavvufi ve işrâkī (felsefi) yönüyle öne çıkar.","Önemi: Vahdet-i vücud düşüncesini sistematik bir şekilde anlatmıştır. İnsan-ı kâmil kavramı üzerine derinlikli çalışmaları vardır.","En Meşhur Eseri: İnsan-ı Kâmil"]},{"alan":"Tefsir","alt":"","soru":"Kendisine nispet edilen Tenvîrü'l-Mikbâs adlı tefsir çalışmasıyla tanınan, 'Tercümanü’l-Kur’an' lakabıyla bilinen sahabi kimdir?","cevap":["İbn Abbas","el-Kâmúsü'l-Muhît adlı sözlüğün yazarı Firuzâbâdî (ö. 817/1414), bu rivayetleri düzenleyen kişi olarak kabul edilir."]},{"alan":"Tefsir","alt":"","soru":"Türkiye'de (Osmanlı ve Cumhuriyet dönemi) öne çıkan tefsirleri ve müelliflerini sayınız.","cevap":["• Osmanlı (klasik) – Ebüssuûd Efendi – İrşâdü'l-akli's-selîm: Osmanlı tefsirinin zirvesi; belâgat ve fıkıh ağırlıklı.","• Osmanlı (işârî) – İsmâil Hakkı Bursevî – Rûhu'l-beyân: Tasavvufî yorumların en meşhur örneği.","• Cumhuriyet (başyapıt) – Elmalılı Hamdi Yazır – Hak Dini Kur'an Dili: Akademik, felsefî ve dilbilimsel derinliği en yüksek eser.","• Cumhuriyet (sade) – Ömer Nasuhi Bilmen – Kur'ân-ı Kerîm'in Türkçe Meâl-i Âlîsi ve Tefsiri: Klasik Ehl-i sünnet çizgisini halkın anlayacağı dille sunar.","• Modern (tematik) – Said Nursî – Risâle-i Nur: Ayetleri iman hakikatleri ekseninde yorumlar.","• Modern (akademik) – Bayraktar Bayraklı – Yeni Bir Anlayışın Işığında Kur'an Tefsiri: Eğitim ve sosyoloji odaklı, akılcı yaklaşım.","• Modern (sosyolojik) – M. Sait Şimşek – Hayat Kaynağı Kur'an Tefsiri: Ayetleri nüzul ortamı ve çağdaş hayatla ilişkilendirir.","• Modern (meal) – Hasan Basri Çantay – Kur'ân-ı Hakîm ve Meâl-i Kerîm: Tefsirli meal ekolünün en güçlü temsilcisi.","• Heyet (sıralı) – Diyanet heyeti – Kur'an Yolu: Güncel sorunları dikkate alan resmî heyet tefsiri.","• Heyet (tematik) – Diyanet heyeti – Hayat Rehberi Kur'an: Konulu, güncel ve pratik tefsir."]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"Tefsir usulü alanında yazılmış ilk, kapsamlı ve zirve kabul edilen temel eserleri gelişim aşamalarına göre sıralayınız?","cevap":["İlk Usul Eseri: Haris el-Muhasibî - el-Akl ve Fehmu'l-Kur'an","Kapsamlı İlk Eser: Muhammed b. Halef el-Merzebân - el-Havî fî Ulûmi'lKur'an","Usulün Altın Çağı: İbnü'l-Cevzî - Fünûnü'l-Efnân ve Zerkeşî - el-Burhân fî Ulûmi'l-Kur'ân","Zirve Eser: Süyûtî - el-İtkân fî Ulûmi'l-Kur'ân (Bu eser, tefsir usulü alanında yazılmış en kapsamlı klasiklerden biri olarak kabul edilir.) [1, 2]"]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"Tefsir usulü alanında yazılan ilk dönem eserleri ve öne çıkan özellikleri nelerdir?","cevap":["Tefsir usulü, başlangıçta müstakil bir ilimden ziyade tefsir mukaddimeleri veya Kur'an ilimleri şeklinde ortaya çıkmıştır:","Haris el-Muhâsibî (ö. 243): el-Akl ve Fehmu'l-Kur'ân (Kur'an'ın anlaşılması ve akıl-vahiy ilişkisi üzerine ilk önemli eserlerdendir).","el-Hûfî (ö. 430): el-Burhân fî Ulûmi'l-Kur'ân (Eserinde tefsir ilmini \"Ulûmu'lKur'ân\" tabiriyle sistemleştiren öncü isimlerdendir).","İbnu'l-Cevzî (ö. 597): Fünûnu'l-Efnân (Kur'an ilimlerini farklı nevilere ayırarak incelemiştir)."]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"\"Mukaddime\" veya \"Kavâid\" (Kurallar) tarzında yazılan tefsir usulü eserlerini sayınız.","cevap":["et-Tûfî (ö. 716): el-İksîr fî İlmi't-Tefsîr.","İbn Teymiyye (ö. 728): Mukaddime fî Usûli't-Tefsîr (Tefsir yöntemleri ve ihtilafların kaynağı üzerine çok etkili bir eserdir).","el-Kâfiyecî (ö. 879): et-Teysîr fî Kavâidi İlmi't-Tefsir (Usul kurallarını sistematik hale getirmiştir)."]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"Ulûmu’l-Kur’ân sahasının \"Zirve\" kabul edilen iki büyük eseri hangisidir?","cevap":["Bu ilmin anayasası sayılan ve kendinden sonraki tüm çalışmaları etkileyen iki dev eser şunlardır:","1. ez-Zerkeşî (ö. 794): el-Burhân fî Ulûmi'l-Kur'ân (Kendi alanında en kapsamlı ilk eserdir).","2. es-Suyûtî (ö. 911): el-İtkân fî Ulûmi'l-Kur'ân (Zerkeşî'nin eserini geliştirmiş ve Kur'an ilimlerini 80 neviye ayırarak zirveye taşımıştır)."]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"Modern dönem (Yakın dönem) Tefsir usulü çalışmalarına hangi örnekleri verebilirsiniz?","cevap":["ed-Dihlevî (ö. 1764): el-Fevzu'l-Kebîr (Hindistan coğrafyasının en özgün usul çalışmasıdır).","ez-Zerkânî (ö. 1948): Menâhilu'l-İrfân (Modern dönemde en çok referans verilen ders kitaplarındandır).","ez-Zehebî (ö. 1978): et-Tefsîr ve'l-Müfessirûn (Tefsir tarihini ve müfessirlerin ekollerini inceleyen en meşhur eserdir)."]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"Günümüzde eğitim kurumlarında yaygın olarak kullanılan \"Mebâhis\" (Konular) tarzı eserleri sayınız.","cevap":["• Subhî es-Sâlih (ö. 1986): Mebâhis fî ulûmi'l-Kur'ân.","• Mennâ' el-Kattân: Mebâhis fî ulûmi'l-Kur'ân (İmam hatip ve ilahiyat müfredatının temel kaynağı).","• Ebû Şehbe: el-Medhal li-dirâseti'l-Kur'âni'l-Kerîm.","Mülakat için özet tablo:","• İbn Teymiyye – Mukaddime fî usûli't-tefsîr: Tefsir metodolojisini ele alır.","• Zerkeşî – el-Burhân: Alanın ilk dev ansiklopedisi.","• Suyûtî – el-İtkân: Ulûmü'l-Kur'ân'ın en kâmil hali.","• Dihlevî – el-Fevzü'l-kebîr: Kur'an'ın beş temel konusunu işler.","• ez-Zehebî – et-Tefsîr ve'l-müfessirûn: Tefsir ekollerini tanımak için temel eser."]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"İtkân varken neden hâlâ modern usul kitapları okunuyor?","cevap":["\"İtkân ve Burhân gibi klasik eserler birer ansiklopedi mahiyetindedir; Subhî es-Sâlih ve Mennâu'l-Kattân gibi modern müellifler ise bu bilgileri daha pedagojik, sistematik ve güncel oryantalist iddialara cevap verecek şekilde tasnif etmişlerdir.\""]},{"alan":"Kur'an İlimleri","alt":"Tefsir usulü","soru":"Tefsir usulü ve tarihi ile Kur’an Tarihi alanında yazılmış temel eserler nelerdir?","cevap":["• Tefsir tarihi – Tefsir Tarihi – Bergamalı Ahmed Cevdet: II. Meşrutiyet sonrası, Batılı çalışmalara cevap niteliğindeki ilk modern tefsir tarihlerinden.","• Tefsir tarihi – Büyük Tefsir Tarihi – Ömer Nasuhi Bilmen: Tabakat usulüyle, müfessir biyografileri ve ekoller üzerine kapsamlı klasik eser.","• Tefsir tarihi – Tefsir Tarihi (2 cilt) – İsmail Cerrahoğlu: İlahiyat müfredatının temel taşı.","• Tefsir tarihi – Ana Hatlarıyla Tefsir Tarihi – Muhsin Demirci: Kronolojik akışı ve ekolleri öğrenci dostu dille sunar.","• Tefsir usulü – Tefsir Usulü – İsmail Cerrahoğlu: Metodoloji, terim ve kuralların standart kaynağı.","• Tefsir usulü – Kur'an-ı Kerim'in Anlaşılması ve Tefsiri – Muhsin Demirci: Çağdaş tefsir problemlerini işleyen güncel usul çalışması.","• Kur'an tarihi – Târîh-i Kur'ân – İzmirli İsmail Hakkı: Mushaf tarihine dair köşe taşı eser.","• Kur'an tarihi – Kur'ân Tarihi – Muhammed Hamidullah: Nüzul ve korunmuşluk üzerine uluslararası düzeyde ilmî perspektif.","• Kur'an tarihi – Kur'ân Tarihi – Abdurrahman Çetin: Cem', hat ve kıraat farklarını detaylandırır.","• Kur'an tarihi – Kur'ân Tarihi / Kur'ân-ı Kerîm Bilgileri – Osman Keskioğlu / Muhsin Demirci: Metinleşme sürecini yalın dille aktaran temel kaynaklar."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Kur'an'daki nadir kelimeleri inceleyen ilme ne denir? Bu sahadaki en meşhur eser hangisidir?","cevap":["Bu ilme Garîbü’l-Kur’ân denir. Bu sahanın en otorite eseri ise Râgıb el-İsfahânî’nin el-Müfredât adlı kitabıdır.","İbn Kuteybe: Garîbü’l-Kur’ân."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Garîbu’l-Kur’ân ve Vücûh-Nezâir arasındaki fark nedir? Eserlerle örnekleyiniz.","cevap":["Garbi: Kur'an'daki az kullanılan, anlaşılması güç kelimeleri açıklar.","Örnek: Râgıb el-İsfahânî – el-Müfredât (Başucu eseridir).","Vücûh-Nezâir: Aynı kelimenin farklı yerlerde farklı anlamlara gelmesini (Vücûh) ve farklı kelimelerin aynı anlamı taşımasını (Nezâir) inceler.","Örnek: Mukatil b. Süleyman – el-Vücûh ve’n-Nezâir."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Esbâb-ı Nüzûl (İniş Sebepleri) denilince akla gelen ilk üç eser nedir?","cevap":["1. Vâhidî: Esbâbü’n-Nüzûl (Alanın ilk ve temel kaynağı).","2. İbn Teymiyye: et-Tibyân.","3. Süyûtî: Lübâbü’n-Nükûl."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Türkiye’de son dönemde Sebeb-i Nüzûl (ayetlerin iniş sebepleri) üzerine yapılmış en kapsamlı Türkçe çalışma kime aittir?","cevap":["Bedrettin Çetiner hocamızın \"Esbâb-ı Nüzûl\" adlı eseri, bu alanda ülkemizde telif edilmiş en önemli çalışmalardan biridir."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Müşkilü’l-Kur’ân nedir ve bir örnek eser söyler misin?","cevap":["Tanım: İlk bakışta çelişkili gibi görünen veya anlaşılması zor olan ayetlerin açıklanması ilmidir.","Eser Örneği: Te’vîlü Müşkili’l-Kur’ân - İbn Kuteybe."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Meâni’l-Kur’ân türünde eser-müellif örnek veriniz.","cevap":["Meâni'l-Kur'ân - Ferrâ (Bu alanda yazılan en hacimli ve en meşhur eserlerden biri kabul edilir.) Meâni'l-Kur'ân - Ebu Ubeyde (Mecâzü'l-Kur'ân olarak da bilinen eser, dilbilimsel tefsirin erken dönem başyapıtlarındandır.)","Meâni'l-Kur'ân ve İ'râbuhu - Zeccâc (Kur'an'ı dil yönünden açıklayan, filolojik açıdan günümüze ulaşan en zengin kaynaklardandır"]},{"alan":"Kur'an İlimleri","alt":"","soru":"Mübhemâtü’l-Kur’ân nedir ve bu alanda hangi eserleri tanıyorsunuz?","cevap":["Kur'an'da ismi açıkça zikredilmeyip \"adam, kadın, topluluk\" gibi ifadelerle kapalı bırakılan isimlerin kim olduğunu inceleyen ilimdir.","Süheylî: et-Taʿrîf ve’l-iʿlâm (Bu sahanın en meşhur eseridir).","İbn Cemâa: et-Tibyân.","Süyûtî: Müfhimâtü’l-aḳrân."]},{"alan":"Kur'an İlimleri","alt":"","soru":"İ‘câzü’l-Kur’ân (Kur'an'ın Mucizeliği) üzerine yazılmış klasik eserleri sayınız.","cevap":["Rummânî – en-Nüket. Hattâbî – Beyânu İ‘câzi’l-Kur’ân. Bâkıllânî – İ‘câzü’l-Kur’ân (Bu sahanın en meşhur savunmalarından biridir)."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Aksâmü’l-Kur’ân ve Fezâilü’l-Kur’ân hakkında bilgi veriniz.","cevap":["Aksâm: Kur'an'daki yeminleri konu alır. En önemli eseri İbn Kayyim elCevziyye’nin et-Tibyân fî Aksâmi’l-Kur’ân’ıdır.","Fezâil: Kur'an okumanın ve bazı surelerin faziletlerini anlatır. İmam Şâfiî’nin Menâfiʿu’l-Ḳurʾân’ı ve Kurtubî’nin el-Vecîz’i meşhurdur."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Mecâzü’l-Kur’ân ve Müşkilü’l-Kur’ân sahalarında kimleri tanıyorsunuz?","cevap":["Mecâz: Kur'an'daki söz sanatlarını inceler. Ma‘mer b. Müsennâ ve Abdülkāhir el-Cürcânî (Delâilü’l-İ‘câz) bu sahanın devleridir.","Müşkil: Ayetler arasında varmış gibi görünen ihtilafları giderir. İbn Fûrek’in Müşkilü’l-Ḳurʾân’ı ve er-Râzî’nin Müşkilâtü’l-Ḳurʾân’ı önemlidir."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Türkiye'de \"Tefsirde İsrâiliyyat\" denilince akla gelen en önemli akademik çalışma kime aittir ve içeriği hakkında ne söylenebilir?","cevap":["Müellif: Doç. Dr. Abdullah Aydemir.","Eser: Tefsirde İsrâiliyyat.","Önemi: Bu çalışma, Türkiye'deki ilahiyat akademik camiasında İsrâiliyyat konusunu müstakil, sistemli ve eleştirel bir yaklaşımla ele alan ilk ve en köklü temel eserlerden biri kabul edilir.","İçeriği: Eser, Yahudi, Hristiyan ve diğer eski kültürlerden tefsir literatürüne giren bilgilerin kaynağını, giriş yollarını ve bu bilgilerin ayetlerin anlaşılmasındaki olumlu/olumsuz etkilerini bilimsel bir süzgeçten geçirir."]},{"alan":"Kur'an İlimleri","alt":"","soru":"“İsrâiliyyat” konusunda başka hangi isimleri veya eserleri biliyorsunuz?","cevap":["1. Muhammed Hüseyin ez-Zehebî: el-İsrâiliyyât fi't-Tefsîr ve'l-Hadîs (Arap dünyasındaki en meşhur ve kapsamlı çalışmadır).","2. M. Reşid Rıza: Tefsîru’l-Menâr (Modern dönemde İsrâiliyyat konusunda en sert ve eleştirel duruş sergileyen tefsirlerin başında gelir).","3. M. Fuad Abdülbâkī: Hadislerdeki yabancı unsurlar üzerine çalışmaları mevcuttur."]},{"alan":"Kur'an İlimleri","alt":"","soru":"İsrâiliyyat'a bakış açımız nasıl olmalıdır?","cevap":["İmam Şâfiî ve diğer ulemanın şu üçlü tasnifini hatırlatmanız sizi çok bilgili gösterecektir:","1. İslam'a Uygun Olanlar: Tasdik edilir (Kur'an ve Sünnet ile örtüşenler).","2. İslam'a Zıt Olanlar: Reddedilir (Vahye aykırı olan hurafeler).","3. Meskit (Sessiz Kalınanlar): Ne tasdik ne de tekzip edilir (Dinin aslına zarar vermeyen, sadece hikaye kabilinden olan bilgiler)."]},{"alan":"Kur'an İlimleri","alt":"","soru":"Ömer Nasuhi Bilmen’in eserlerinden söyler misin?","cevap":["İslam Hukuku","8 cilttir. Modern dönemde yazılmış en kapsamlı fıkıh ansiklopedisidir. Mezhepler arası karşılaştırmalı hukuk analizi yapar.","Büyük İslam İlmihali","İlmihal","Türkiye'de en çok basılan ve okunan dinî bilgi kitabıdır. Hanefî mezhebi esaslarına göre pratik hayatı düzenler.","Kur’an-ı Kerim’in Türkçe Meal-i Âlisi ve Tefsiri","Tefsir","8 cilttir. Ayetlerin açıklamasında klasik tefsir geleneğini modern bir Türkçe ile harmanlar.","Hukuk-ı İslâmiyye ve Istılahât-ı Fıkhiyye Kamusu","Büyük Tefsir Tarihi Tefsir (Tabakatü’l-Müfessirîn) Tarihi","Sahabe döneminden günümüze kadar yaşamış yüzlerce müfessiri ve tefsir ekollerini tanıtan devasa bir biyografi eseridir.","Kur'an-ı Kerim'den Dersler ve Öğütler","Halkın anlayacağı dille ayetlerin ahlaki ve toplumsal yorumlarını içerir.","Vaaz/İrşad"]},{"alan":"Kur'an İlimleri","alt":"","soru":"Kıraat alanında temel bir eser söyler misin?","cevap":["en-Neşr fi'l-kırââti'l-aşr – İbnü'l-Cezerî: On kıraat üzerine yazılmış en kapsamlı ve teknik eser; kıraat ilminin \"anayasası\" kabul edilir.","Mülakat notları:","• Zemahşerî neden önemlidir? Mu'tezilî olmasına rağmen Kur'an'ın dil, belâgat ve mecaz yönünü eşsiz biçimde açıkladığı için Ehl-i sünnet âlimlerince de başucu eseri kabul edilmiştir.","• Mukātil b. Süleymân: Vücûh ve nezâir sahasında ilk müstakil eseri yazan kişidir; günümüze ulaşan ilk tam tefsirin (Tefsîru Mukātil) müellifidir."]},{"alan":"Kelam","alt":"","soru":"Günümüz kelamcılarından kimleri tanıyorsunuz?","cevap":["• Bekir Topaloğlu – Sistematik kelam ve terminoloji: Kelamın akademik standartlara kavuşması.","• Şerafettin Gölcük – Genel kelam ve eğitim: Kelamın ders kitaplarıyla sadeleşip yaygınlaşması.","• Yusuf Şevki Yavuz – Klasik kelam ve metodoloji: Sıfatlar ve klasik metinlerin güncel akademik dile aktarılması.","• Cağfer Karadaş – Mâtürîdîlik ve mezhepler: Geleneksel çizgide güncel itikadi sorunlara cevap.","• Metin Özdemir – Felsefi kelam ve teodise: Kötülük problemi, ilahi adalet, deizm/ateizm.","• Ramazan Biçer – Mâtürîdî literatürü: Ekolün tarihsel gelişimi ve modern izdüşümleri.","• İlyas Çelebi – Ansiklopedik kelam: İlahiyat ve nübüvvet konularının ansiklopedik titizlikle işlenmesi.","• Şaban Ali Düzgün – Varoluşçu ve antropolojik kelam: Din-siyaset ilişkisi, insan merkezli kelam dili.","• Mehmet Evkuran – Siyasal kelam ve eleştiri: Mezheplerin siyasi arka planı ve zihniyet analizi.","• Temel Yeşilyurt – Epistemoloji ve dinler arası kelam: Bilgi teorisi ve diğer inanç sistemleriyle mukayese."]},{"alan":"Kelam","alt":"","soru":"Güncel Kelam problemleri ile ilgili hangi eseri tavsiye edersiniz?","cevap":["• Günümüz Kelam Problemleri – Mehmet Evkuran, Harun Çağlayan (akademik): Modern inanç sorunlarını sistematik ele alan temel başvuru kaynağı.","• Kafama Takılanlar (1-2) – Cağfer Karadaş (DİB Yayınları): Deizm, ateizm, agnostisizm gibi akımlara dair gençlerin sorularına pratik cevaplar.","• Çağdaş İnanç Problemleri – Temel Yeşilyurt (DİB Yayınları): Modernite ve sekülerleşmenin inanca etkilerinin felsefi ve kelâmî eleştirisi."]},{"alan":"Kelam","alt":"","soru":"Ehl-i Sünnet akaidinin sistemleştiği iki ana ekolü, kurucularını ve literatürdeki temel eserlerini sayınız.","cevap":["1. Mâtürîdiyye Ekolü (Semerkand) Hanefî fıkıh geleneğinin itikadi yorumudur. Akıl ile nakil arasında orta bir yol izler, \"hikmet\" kavramını merkeze alır.","Kurucu İmam: Ebû Mansûr el-Mâtürîdî (ö. 333).","Temel Eserleri: o Kitâbü’t-Tevhîd: Mezhebin kurucu metnidir. Bilgi teorisi, Allah'ın varlığı ve sıfatları konularında aklî ve naklî delilleri sistemleştirmiştir. o Te’vîlâtü’l-Kur’ân: Ehl-i Sünnet'in en hacimli ve ilk büyük dirayet tefsiridir.","Diğer Önemli Alimler: o Ebû'l-Muîn en-Nesefî: Mezhebi asıl sistemleştiren kişidir. En meşhur eseri Tebsıratü'l-Edille'dir. o Ömer en-Nesefî: Meşhur el-Akāid metninin müellifidir.","2. Eş’ariyye Ekolü (Bağdat/Nişabur) Mu'tezile'ye karşı bir savunma olarak doğmuştur. Şâfiî ve Mâlikî çevrelerinde yaygındır. Zamanla felsefî metotları kelâmın içine dâhil etmiştir.","Kurucu İmam: Ebü’l-Hasan el-Eş’arî (ö. 324).","Temel Eserleri: o el-İbâne 'an Usûli'd-Diyâne: Selef akidesini destekleyen, halka yönelik yazdığı eseri. o Makālâtü’l-İslâmiyyîn: İslam mezheplerini ve görüşlerini tarafsızca anlattığı dev eseri. o el-Luma‘: Kendi kelâm sistemini akli delillerle açıkladığı teknik eseridir. o Risâle fî İstiḥsâni’l-Ḫavż fî ʿİlmi’l-Kelâm: Kelâm ilmiyle uğraşmanın gerekliliğini savunduğu risalesi.","Zirve İsimler ve Eserleri:","Bâkıllânî: et-Temhîd (Kelâmı klasik mantıkla sistemleştiren isimdir).","Cüveynî (İmâmü'l-Haremeyn): el-İrşâd.","İmam Gazzâlî: el-İktisâd fi’l-İ’tikād (Mantığı kelâmın bir cüzü haline getirmiştir).","Fahreddin er-Râzî: el-Muhassal (Kelâm-felsefe mezcini zirveye taşımıştır)."]},{"alan":"Kelam","alt":"","soru":"İmam Maturidi ve İmam Eş’ari’nin eserleri nelerdir?","cevap":["Maturidi:","Kitâbü’t-Tevhîd (Akaiddeki ana eseri), Te’vîlâtü’l-Kur’ân (Ehl-i sünnet tefsirinin zirvesidir).","Eş’ari:","el-İbâne (Selef çizgisindeki eseri), el-Lüma’ (Kelami yöntemle yazdığı eseri), Makalâtü’l-İslâmiyyîn (Mezhepler tarihi)."]},{"alan":"Kelam","alt":"","soru":"İmam Mâtüridi'nin Kitâbü't-Tevhîd eserini hem tahkik edip hem de Türkçeye tercüme eden, aynı zamanda Mâtüridiyye Akâidi şerhiyle tanınan ilim adamı kimdir?","cevap":["Prof. Dr. Bekir Topaloğlu"]},{"alan":"Kelam","alt":"","soru":"Mâtürîdiyye ekolünde \"Mütekaddimûn\" ve \"Müteahhirûn\" dönemlerini birbirinden ayıran temel eser ve müellif hangisidir?","cevap":["Ebû’l-Muîn en-Nesefî (v. 508) ve onun Tabsıratü’l-Edille isimli eseridir. Mâtürîdîliğin \"Müteahhirûn\" (sonraki dönem) devrini başlatan ve ekolü sistemleştiren en büyük isim Bu eserle birlikte Mâtürîdî kelâmı tam bir sistem kazanarak Müteahhirûn dönemine geçmiştir. \"Mâtürîdîliğin Gazzâlî'si\""]},{"alan":"Kelam","alt":"","soru":"Mâtürîdiyye ekolünün Mütekaddimûn döneminde, İmam Mâtürîdî’den sonra ekolün en önemli savunucusu sayılan alim kimdir?","cevap":["Hakîm es-Semerkandî veya Ebû’l-Yüsr el-Pezdevî. (Pezdevî, Usûlü'd-Dîn eseriyle bilinir.)"]},{"alan":"Kelam","alt":"","soru":"Osmanlı kelâmcılarından olup akideyi bir şiir (manzum) şeklinde özetleyen \"Hızır Bey\" kimdir?","cevap":["İstanbul'un ilk kadısıdır. Mâtürîdî kelâmını manzum bir şekilde özetlediği Kasîde-i Nûniyye eseridir."]},{"alan":"Kelam","alt":"","soru":"Medreselerde en çok okutulan ve üzerine pek çok şerh yazılan \"el-Akâid\" (Nesefî Akâidi) kitabının müellifi kimdir?","cevap":["Necmeddin en-Nesefî."]},{"alan":"Kelam","alt":"","soru":"\"el-Bidâye fî usûli’d-dîn\" ve \"el-Kifâye fî’l-hidâye\" gibi önemli ders kitaplarını telif eden alim kimdir?","cevap":["Nûreddin es-Sâbûnî."]},{"alan":"Kelam","alt":"","soru":"Nesefîleri (Ebû'l-Muîn, Necmeddin, Ebû'l-Berekât) birbirine karıştırmadan görevlerini söyleyebilir misin?","cevap":["Ebû’l-Muîn (Delillendiren/Sistemleştiren), Necmeddin (Metni yazan/Akâid), Ebû’l-Berekât (Umdetü'l-Akâid müellifi, aynı zamanda meşhur bir müfessirdir)."]},{"alan":"Kelam","alt":"","soru":"\"el-Emâlî\" kimindir ve neden meşhurdur?","cevap":["\"el-Emâlî\" (veya Kasîdetü'l-Emâlî) adlı ünlü akaid risâlesi, Maveraünnehir bölgesinde yetişmiş Türk âlim, Mâtürîdî kelâmcısı ve Hanefî fakihi olan Sirâceddin Ali b. Osman el-Ûşî'ye (v. 575/1179) aittir Manzum bir akaid metni olduğu için ezberlenmesi kolaydır ve İslam dünyasında geniş kitlelerce okunmuştur."]},{"alan":"Kelam","alt":"","soru":"Sevâdül Azam nedir, böyle bir eser var mıdır?","cevap":["Eser Mevcut mu: Evet, vardır.","Müellif: Hakîm es-Semerkandî.","Önemi: Maturidi akidesini halk seviyesine indiren, Ehl-i Sünnet’in çoğunluğunu (\"Büyük Karaltı\") temsil eden temel kelam kitabıdır."]},{"alan":"Kelam","alt":"","soru":"Eş’ârî ekolünde mütekaddimun ve müteahhirun dönemi farklarını ve alimlerini sayınız.","cevap":["Mütekaddimun:","İmam Gazzâlî öncesidir. Mantık kullanılmaz Mantık ve felsefenin kelâmdan uzak tutulduğu dönem.","Alimler: Bâkıllânî, İmamü’l-Haremeyn el-Cüveynî.","Müteahhirun:","Gazzâlî ile mantığın kelama girmesiyle başlar. Mantığın kelâmın bir mukaddimesi olduğu dönem. Kelam ile felsefe mezcolunur. Gazzâlî, mantığı kelâmın içine dâhil ederek yöntemsel bir devrim yapmıştır.","Alimler: Fahreddin er-Râzî, Adudüddin el-Îcî, Seyyid Şerîf el-Cürcânî."]},{"alan":"Kelam","alt":"","soru":"Eş'ârîlikte \"Müteahhirûn\" dönemini başlatan, mantığı kelâmın içine sokan ve \"Hüccetü’l-İslâm\" lakabıyla bilinen alim kimdir?","cevap":["İmam Gazzâlî."]},{"alan":"Kelam","alt":"","soru":"İmam Gazzâlî’nin, mantığı kelâmın bir mukaddimesi olarak gördüğü ve Müteahhirûn dönemini başlatan temel kelâm eseri hangisidir?","cevap":["el-İktisâd fi’l-itikād."]},{"alan":"Kelam","alt":"","soru":"İmam Gazâlî’nin en önemli eserleri nelerdir?","cevap":["İhyâu Ulûmi’d-Dîn: Tasavvuf, fıkıh ve ahlakı mezceden ansiklopedik eseri.","el-Mustasfâ: Fıkıh usulü alanında şaheser kabul edilen dört temel eserden biri.","Tehâfütü’l-Felâsife: Aristotelesçi felsefe geleneğine yönelik eleştirisi.","el-Münkızü mine’d-Dalâl: Hakikat arayışını anlattığı otobiyografisi.","el-Vecîz / el-Vasît / el-Basît: Şafii füru fıkhına dair sistematik serisi."]},{"alan":"Kelam","alt":"","soru":"Münkızü mine’d-Dalâl eseri kimindir?","cevap":["Müellif: İmam Gazzâlî.","İçerik: Kendi hakikat arayışını ve felsefe, kelam, tasavvuf gibi ilimleri değerlendirdiği otobiyografik eseridir."]},{"alan":"Kelam","alt":"","soru":"İmam Gazâlî’ye (özellikle felsefe eleştirisine) karşı yazılmış en meşhur eser hangisidir?","cevap":["Eser: Tehâfütü’t-Tehâfüt (Tutarsızlığın Tutarsızlığı).","Müellif: İbn Rüşd.","İçerik: Gazâlî’nin Tehâfütü’l-Felâsife adlı eserinde filozoflara yönelttiği eleştirilere verilen felsefi cevaptır."]},{"alan":"Kelam","alt":"","soru":"Eş'ârî ekolünde \"Mütekaddimûn\" döneminin zirve ismi, \"İmâmü'lHaremeyn\" lakaplı Gazali’nin hocası kimdir?","cevap":["el-Cüveynî. (En önemli eseri el-İrşâd'dır.)"]},{"alan":"Kelam","alt":"","soru":"Kelâm ile Felsefeyi tamamen mezceden (el-müttasıl), felsefî kelâmın öncüsü olarak sorulan isim kimdir?","cevap":["Fahruddin er-Râzî."]},{"alan":"Kelam","alt":"","soru":"Osmanlı medreselerinde çokça okutulan \"Şerhu'l-Mevâkıf\" ve \"Şerhu'lMakāsıd\" eserleri hangi iki büyük Eş'ârî alime aittir?","cevap":["Şerhu'l-Mevâkıf Seyyid Şerif Cürcânî'ye, Şerhu'l-Makāsıd ise Sa’düddin etTeftâzânî'ye aittir."]},{"alan":"Kelam","alt":"","soru":"İmam el-Eş'arî’nin, Selef çizgisine en yakın olduğu ve Ehli Sünnet akidesini savunduğu meşhur eseri hangisidir?","cevap":["el-İbâne an usûli’d-diyâne."]},{"alan":"Kelam","alt":"","soru":"İmam el-Eş'arî’nin, bid'atçılara ve mülhidlere cevap mahiyetinde yazdığı eser hangisidir?","cevap":["el-Lüma’ fî’r-red alâ ehli’z-zeyğ ve’l-bida."]},{"alan":"Kelam","alt":"","soru":"Eş'arîlikte \"Mütekaddimûn\" döneminin kurucu isimlerinden Bâkıllânî’nin en önemli kelâm eseri nedir?","cevap":["Temhîdü’l-evâil ve telhîsü’d-delâil."]},{"alan":"Kelam","alt":"","soru":"\"İmâmü’l-Haremeyn\" ismiyle tanınan el-Cüveynî’nin, Mütekaddimûn döneminin zirve eseri sayılan kitabı hangisidir?","cevap":["eş-Şâmil fî usûli’d-dîn"]},{"alan":"Kelam","alt":"","soru":"Şehristânî’nin, kelâmcıların ve filozofların ayaklarının kaydığı (yanıldığı) noktaları eleştirdiği eseri nedir?","cevap":["Nihâyetü’l-ikdâm fî ilmi’l-kelâm."]},{"alan":"Kelam","alt":"","soru":"Fahruddin er-Râzî’nin kelâm ile felsefeyi tam anlamıyla mezceden ve mülakatlarda çok sorulan iki önemli eseri hangisidir?","cevap":["el-Metâlibü’l-âliye ve el-Muhassal."]},{"alan":"Kelam","alt":"","soru":"Adudüddin el-Îcî’ye ait olan ve üzerine Seyyid Şerif Cürcânî tarafından şerh yazılan meşhur metin hangisidir?","cevap":["el-Mevâkıf fî ilmi’l-kelâm. (Şerhi ise Şerhu’l-Mevâkıf'tır.)"]},{"alan":"Kelam","alt":"","soru":"Sa’düddin et-Teftâzânî’nin mülakatlarda en çok sorulan ve üzerine pek çok haşiye yazılan iki büyük eseri nedir?","cevap":["Şerhu’l-Akāid (Nesefî Şerhi) ve Şerhu’l-Makāsıd."]},{"alan":"Kelam","alt":"","soru":"Müteahhirûn döneminde \"İmam\" denilince kim kastedilir?","cevap":["Kelâm ve felsefe sentezi nedeniyle Fahruddin er-Râzî kastedilir."]},{"alan":"Kelam","alt":"","soru":"İbn Rüşd kimdir ve neden \"Şârih\" (Yorumcu) ünvanıyla anılır?","cevap":["Endülüslü büyük felsefeci, hekim ve fıkıhçıdır. Aristo’nun eserlerine yaptığı şerhlerle Batı’da \"Commentator\" (Yorumcu) olarak tanınmış, Gazzâlî’nin felsefeye yönelik eleştirilerine Tehâfüt el-Tehâfüt eseriyle cevap vermiştir."]},{"alan":"Kelam","alt":"","soru":"İslami ilimler alanında son dönemde öne çıkmış alimlerden sayınız.","cevap":["Branş Kelâm (Son Dönem) Hadis Fıkıh Tefsir","Önemli Temsilciler İzmirli İsmail Hakkı, Abdüllatif Harputi, Mustafa Sabri Efendi, Ömer Nasuhi Bilmen. Emin Saraç, Tayyip Okiç, Talat Koçyiğit, Muhammed Enver elKeşmîrî (Feyzu'l-Bârî). Halil Gönenç, Mehmet Savaş, Hayrettin Karaman. Elmalılı Hamdi Yazır (Hak Dini Kur’an Dili), İsmail Cerrahoğlu, M. Ali Sabuni."]},{"alan":"Kelam","alt":"","soru":"Yeni İlm-i Kelâm döneminin öncü eserlerinden sayılan ve Abdüllatif Harpûtî tarafından kaleme alınan eser hangisidir?","cevap":["Tenkîhu’l-kelâm fî akāidi ehli’l-İslâm. Bu eser, klasik kelâmı modern çağın itirazlarına (materyalizm vb.) göre revize etme çabasının ilk sistemli örneklerindendir."]},{"alan":"Kelam","alt":"","soru":"\"Yeni İlm-i Kelâm\" tabirini bizzat eserine isim olarak veren ve bu alanın metodolojisini belirleyen müellif kimdir?","cevap":["İzmirli İsmail Hakkı. Eserinin adı da doğrudan Yeni İlm-i Kelâm'dır. Müellif, kelâmın konularının değil, delillerinin ve anlatım tarzının yenilenmesi gerektiğini savunur."]},{"alan":"Kelam","alt":"","soru":"Mısırlı meşhur modernist alim Muhammed Abduh’un, kelâm ilmini sadeleştirerek sunduğu ve akıl-vahiy dengesini vurguladığı eseri hangisidir?","cevap":["Risâletü’t-tevhîd. Abduh bu eserinde, klasik kelâmın ağır felsefi yükünden kurtulup özlü bir tevhid anlayışı sunmayı amaçlamıştır."]},{"alan":"Kelam","alt":"","soru":"Hindistan coğrafyasında modern kelâmın temellerini atan Şiblî Nu’mânî’nin mülakatlarda sıkça sorulan eseri hangisidir?","cevap":["İlmü’l-kelâm. Nu’mânî bu eserinde kelâmın tarihsel gelişimini inceleyerek modern dönem savunmasını bu tarihsel birikim üzerine inşa eder."]},{"alan":"Kelam","alt":"","soru":"Şehbenderzâde Filibeli Ahmed Hilmi’nin, materyalist fikirlerin İslam dünyasındaki etkisini kırmak amacıyla yazdığı eser nedir?","cevap":["Üss-i İslâm - Yeni Akaid. Filibeli bu eserinde, \"yeni fenler\" karşısında İslam inancının sarsılmazlığını rasyonel bir dille ispatlamaya çalışır."]},{"alan":"Kelam","alt":"","soru":"Son devir Osmanlı ve Cumhuriyet dönemi alimlerinden Ömer Nasuhi Bilmen’in, kelâm ilmini muvazzah (açık ve net) bir şekilde ele aldığı eseri hangisidir?","cevap":["Muvazzah İlm-i Kelâm. Bu eser, klasik dönem literatürünü modern dönemin anlayışına köprü kurarak aktaran temel bir ders kitabı niteliğindedir."]},{"alan":"Kelam","alt":"","soru":"İslam dünyasının uyanışında büyük rolü olan Muhammed İkbal’in, felsefi ve kelâmî görüşlerini içeren temel İngilizce eseri nedir?","cevap":["The Reconstruction of Religious Thought in Islam (İslam’da Dinî Düşüncenin Yeniden Teşekkülü). İkbal bu eserinde, İslam metafiziğini modern Batı felsefesi ve bilimsel keşifler (izafiyet teorisi vb.) ışığında yeniden yorumlamıştır."]},{"alan":"Kelam","alt":"","soru":"Metâlib ve Mezâhib eseri kime aittir?","cevap":["Metâlib ve Mezâhib (Maba'de't-Tabi'a ve Felsefe-i İlahiye), asıl olarak Fransız felsefe tarihçileri Paul Janet ve Gabriel Séailles tarafından kaleme alınan \"Histoire de la Philosophie\" (Felsefe Tarihi) adlı eserin, büyük İslâm âlimi Elmalılı Hamdi Yazır tarafından yapılan tercümesi ve şerhidir.","Orijinal Yazarlar: Paul Janet ve Gabriel Séailles.","Tercüme/Şerh Eden: Elmalılı M. Hamdi Yazır."]},{"alan":"Kelam","alt":"","soru":"Mutezile’nin 3 alimi ve eserini sayınız.","cevap":["1. Kâdı Abdülcebbâr: el-Muğnî (Kelam ansiklopedisidir).","2. Zemahşerî: el-Keşşâf (Belagat yönüyle eşsiz tefsir).","3. Ebû Ali el-Cübbâî: Ebu’l-Hasan el-Eş’ari’nin de hocasıdır."]},{"alan":"Kelam","alt":"","soru":"Mu’tezile ekolünün kurucu ve sistemleştirici isimleri kimlerdir?","cevap":["Kurucular: Vâsıl b. Atâ ve Amr b. Ubeyd.","Sistemleştiriciler: Ebû Ali el-Cübbâî, Nazzâm, Câhiz, Kādî Abdülcebbâr ve tefsiriyle ünlü Zemahşerî."]},{"alan":"Kelam","alt":"","soru":"Mu'tezile ekolünün kurucusu kabul edilen ve Hasan-ı Basrî’nin meclisinden ayrılan isim kimdir?","cevap":["Vâsıl b. Atâ. (Beraberinde Amr b. Ubeyd ile ekolün temellerini atmışlardır.)"]},{"alan":"Kelam","alt":"","soru":"Mu'tezile'nin sistematikleşmesinde büyük rol oynayan, \"Cübbâîler\" olarak bilinen baba-oğul alimler kimlerdir?","cevap":["Ebû Ali el-Cübbâî ve oğlu Ebû Hâşim el-Cübbâî."]},{"alan":"Kelam","alt":"","soru":"Mu'tezile'nin \"Beş Esas\" (Usûl-i Hamse) teorisini en geniş şekilde şerh eden ve mülakatlarda sıkça sorulan alim kimdir?","cevap":["Kādî Abdülcebbâr. (En meşhur eseri el-Muğnî'dir.)"]},{"alan":"Kelam","alt":"","soru":"Mu'tezile ekolünün en önemli isimlerinden Kādî Abdülcebbâr’ın \"Usûl-i Hamse\"yi (Beş Esas) açıkladığı eseri nedir?","cevap":["Şerhu’l-Usûli’l-Hamse. Ayrıca bu ekolde delillerin detaylandırıldığı el-Muğnî isimli meşhur eser de ona aittir"]},{"alan":"Kelam","alt":"","soru":"\"Müteşâbihü’l-Kur’ân\" ve \"Tenzîhü’l-Kur’ân\" gibi eserleriyle Mu'tezile'nin rasyonel yorum yöntemini savunan alim kimdir?","cevap":["Kādî Abdülcebbâr."]},{"alan":"Kelam","alt":"","soru":"Mu'tezile'nin en büyük kelâmcılarından biri olan Kadı Abdülcebbâr kaçıncı yüzyılda yaşamıştır ve en meşhur eserleri nelerdir?","cevap":["Yüzyıl: 4. ve 5. yüzyıl alimidir (ö. 415/1025). Basra Mu'tezilesi'nin reisidir.","Eserleri: o el-Muğnî: Mu'tezile kelâmının ansiklopedik en büyük eseridir (20 cilttir). o Şerhu’l-Usûli’l-Hamse: Mu'tezile'nin \"beş temel esası\"nı açıkladığı eseridir. o Tesbîtü Delâili’n-Nübüvve: Peygamberlik delillerini işler."]},{"alan":"Kelam","alt":"","soru":"Mu'tezile alimlerinden Câhiz’in, düşüncelerini ve mezhebî görüşlerini serpiştirdiği meşhur risaleler topluluğu nedir?","cevap":["Resâilü’l-Câhiz."]},{"alan":"Kelam","alt":"","soru":"Şia’nın 5 büyük alimi, eseri ve dönemleri nelerdir?","cevap":["1. Kuleynî: el-Kâfî (Mütekaddim)","2. Şeyh Saduk: Men lâ yahduruhu’l-fakîh (Mütekaddim)","3. Şeyh Müfîd: el-İrşâd (Sistemleşme dönemi - Müteahhir başlangıcı)","4. Şerîf el-Murtazâ: ez-Zehîra (Müteahhir)","5. Şeyh Tûsî: Tehzîbü’l-Ahkâm (Müteahhir)"]},{"alan":"Kelam","alt":"","soru":"\"Milel ve Nihal\" (Dinler ve Mezhepler Tarihi) sahasında en meşhur eserler hangileridir?","cevap":["Şehristânî: el-Milel ve’n-Nihal.","İbn Hazm: el-Fasl.","Fahreddin er-Râzî: İ’tikādâtü fırakı’l-müslimîn."]},{"alan":"Tasavvuf","alt":"","soru":"Fusûsü’l-Hikem kime aittir?","cevap":["Şeyhü’l-Ekber Muhyiddin İbnü’l-Arabî’ye aittir. 27 peygamberin hikmetleri üzerinden tasavvufi hakikatleri açıklar."]},{"alan":"Tasavvuf","alt":"","soru":"Hikem-i Atâiyye’nin müellifi kimdir?","cevap":["Şâzelî şeyhlerinden Ataullah el-İskenderî’ye aittir. Zühd ve marifetullahı kısa hikmetlerle anlatan klasik bir eserdir."]},{"alan":"Tasavvuf","alt":"","soru":"Tasavvufta klasik kaynaklar erken dönem kaynaklarını sayınız.","cevap":["• er-Riâye li-hukūkıllâh – Hâris el-Muhâsibî: Nefis muhasebesi ve ahlak psikolojisi üzerine ilk derinlikli eser.","• el-Lüma' – Ebû Nasr es-Serrâc: Tasavvufun ilk ansiklopedisi; tasavvufi terimleri ilk kez sistemleştirmiştir.","• Kūtü'l-kulûb – Ebû Tâlib el-Mekkî: \"Kalplerin azığı\"; Gazzâlî'nin İhyâ'sına en önemli kaynaklık eden eser.","• et-Taarruf – Kelâbâzî: \"Tasavvufu tanıtan\" eser; sufi inançların Ehl-i sünnet akidesiyle uyumunu anlatır."]},{"alan":"Tasavvuf","alt":"","soru":"Büyük tasavvuf klasikleri ve ahlak eserleri sayın.","cevap":["• er-Risâle – Abdülkerîm el-Kuşeyrî: \"Tasavvufun anayasası\"; sufi halleri, makamları ve büyük velilerin hayatları üzerinden tasavvufi ahlakı anlatır.","• Keşfü'l-mahcûb – Hücvîrî: Farsça yazılmış ilk büyük tasavvuf klasiği; tasavvufi fırkaları ve hakikat yolundaki perdelerin aralanmasını işler.","• İhyâü ulûmi'd-dîn – İmam Gazzâlî: İslam dünyasının en etkili eserlerinden; İslam ilimlerini tasavvufi bir ruhla yeniden canlandırır, zâhir-bâtın dengesini kurar.","• Avârifü'l-meârif – Şehâbeddin es-Sühreverdî: Tarikatların teşekkül döneminin başucu kitabı; tekke adabını ve dervişlik kurallarını ayrıntılı sunar."]},{"alan":"Tasavvuf","alt":"","soru":"İrfânî ve Felsefî Tasavvuf türü eserlerden sayınız.","cevap":["• Fusûsü'l-hikem – İbnü'l-Arabî: Vahdet-i vücûd düşüncesinin en meşhur metni; 27 peygamberin hikmetleri üzerinden metafizik hakikatleri anlatır.","• el-Fütûhâtü'l-Mekkiyye – İbnü'l-Arabî: Tasavvufun teorik ve pratik bütün konularını içeren en kapsamlı ansiklopedi.","• Mesnevî – Mevlânâ Celâleddîn-i Rûmî: Tasavvufun irfânî yönünün zirvesi; Kur'an ayetleri ve hikâyelerle anlatılan 6 ciltlik manzum eser."]},{"alan":"Tasavvuf","alt":"","soru":"Tasavvuf literatüründe \"Tasavvufun Anayasası\" kabul edilen eser hangisidir ve müellifi kimdir?","cevap":["er-Risâle’dir. Müellifi Abdülkerim el-Kuşeyrî’dir. Bu eser, sufi hallerini, makamlarını ve büyük velilerin hayatlarını anlatarak tasavvufun çerçevesini belirlediği için bu isimle anılır."]},{"alan":"Tasavvuf","alt":"","soru":"Farsça kaleme alınmış ilk büyük tasavvuf klasiği olma özelliğini taşıyan eser hangisidir?","cevap":["Keşfü’l-mahcûb’dur. Müellifi Hücvîrî’dir. Eser, tasavvufi fırkaları ve manevi hakikatlerin önündeki perdeleri aralamayı (keşif) konu edinir."]},{"alan":"Tasavvuf","alt":"","soru":"İslam ilimlerini tasavvufi bir ruhla yeniden canlandırmayı amaçlayan ve İslam dünyasının en etkili eserlerinden biri kabul edilen kitap hangisidir?","cevap":["İhyâü Ulûmi’d-Dîn’dir. Müellifi İmâm-ı Gazzâlî’dir. Hem medreselerde hem de tekkelerde yüzyıllarca temel kaynak olarak okutulmuştur."]},{"alan":"Tasavvuf","alt":"","soru":"Tarikatların teşekkül döneminde başucu kitabı kabul edilen ve tekke/tarikat adabını en iyi anlatan eser hangisidir?","cevap":["Avârifü’l-Maârif’tir. Müellifi Şehâbeddin es-Sühreverdî’dir. Özellikle tasavvufun kurumsal yapısını ve dervişlik adabını sistemleştirmesiyle bilinir."]},{"alan":"Tasavvuf","alt":"","soru":"Tasavvuf literatüründe \"Vahdet-i Vücud\" düşüncesini sistemleştiren en meşhur ve en zor eser hangisidir?","cevap":["Füsûsü’l-Hikem’dir. Müellifi İbnü’l-Arâbîdir. Bu eser, 27 peygamberin her birine atfedilen özel hikmetler üzerinden varlığın birliği ve ilahi tecellileri derin bir metafizik dille anlatır."]},{"alan":"Tasavvuf","alt":"","soru":"Tasavvuf ilminin \"en kapsamlı ansiklopedisi\" olarak kabul edilen devasa eser hangisidir?","cevap":["Fütûhât-ı Mekkiyye’dir. İbnü’l-Arâbî tarafından kaleme alınan bu eser; fıkıh, kelam ve tasavvufun tüm konularını manevi keşifler ve sırlar çerçevesinde ele alan devasa bir külliyattır."]},{"alan":"Tasavvuf","alt":"","soru":"İlahi aşkı, varlık hakikatlerini ve insanın kemalat yolculuğunu hikayeler ve sembollerle anlatan evrensel şaheser hangisidir?","cevap":["Mesnevî’dir. Müellifi Mevlânâ Celâleddîn-i Rûmîdir. Bu eser, tasavvufi hakikatleri herkesin anlayabileceği didaktik ve edebi bir üslupla sunan bir irfan hazinesidir."]},{"alan":"Tasavvuf","alt":"","soru":"Tasavvuf literatüründe nefis muhasebesi ve ahlak psikolojisi üzerine yazılan ilk derinlikli eser hangisidir?","cevap":["er-Riâye li-hukūkıllâh'tır. Müellifi Haris el-Muhâsibî'dir."]},{"alan":"Tasavvuf","alt":"","soru":"\"Tasavvufun ilk ansiklopedisi\" olarak kabul edilen ve tasavvufi terimleri ilk kez sistemleştiren klasik eser hangisidir?","cevap":["el-Lüma'dır. Müellifi Ebû Nasr es-Serrâc'dır."]},{"alan":"Tasavvuf","alt":"","soru":"İmam Gazzâlî’nin meşhur eseri İhyâü Ulûmi’d-Dîn’e en önemli kaynaklık eden ve \"Kalbin Azığı\" anlamına gelen eser hangisidir?","cevap":["Kūtü’l-kulûb'dur. Müellifi Ebû Tâlib el-Mekkî'dir."]},{"alan":"Tasavvuf","alt":"","soru":"Tasavvufi inançların Ehl-i Sünnet akidesiyle uyumunu anlatmak amacıyla yazılan ve \"Tasavvufu Tanıtan\" anlamına gelen eser hangisidir?","cevap":["et-Taarruf'tur. Müellifi Kelâbâzî'dir"]},{"alan":"Tasavvuf","alt":"","soru":"On ciltlik devasa hacmiyle tasavvuf tarihinin en geniş kapsamlı biyografi eseri hangisidir ve müellifi kimdir?","cevap":["Hilyetü’l-Evliyâ’dır. Müellifi Ebû Nuaym el-İsfahânîdir. Bu eser, sahabe döneminden başlayarak sufi hayatlarını ve rivayetlerini çok geniş bir perspektifle ele alır."]},{"alan":"Tasavvuf","alt":"","soru":"Büyük sufilerin menkıbelerini, ibretli hayat hikayelerini ve hikmetli sözlerini içeren en meşhur klasik tabakat eseri hangisidir?","cevap":["Tezkiretü’l-Evliyâ’dır. Müellifi Feridüddin Attârdır.Bu eser, hem edebi diliyle hem de manevi etkisiyle tasavvuf edebiyatının en önemli biyografi kaynaklarından biridir."]},{"alan":"Tasavvuf","alt":"","soru":"Velilerin hayatlarını anlatan ve özellikle Osmanlı ilim ve kültür sahasında çokça rağbet görmüş olan tabakat kitabı hangisidir?","cevap":["Nefahâtü’l-Üns’tür. Müellifi Molla Câmîdir. Bu eser, tasavvuf büyüklerinin hayatlarını sistemli bir şekilde sunmasıyla Osmanlı medrese ve tekke çevrelerinde başucu kaynağı olmuştur"]},{"alan":"Diğer","alt":"","soru":"İslam literatüründe \"el-Kitâb\" ismiyle özdeşleşen, Arap dili gramerine dair günümüze ulaşan ilk, en hacimli ve sistematik eserin müellifi kimdir ve bu eserin bilim tarihindeki yeri nedir?","cevap":["Bu isim Basra nahiv mektebinin imamı kabul edilen Sibeveyh'tir (v. 180). Kendisi, dilbilgisini bir sistem dahilinde ilk defa kitaplaştıran müelliftir. Bu eser, nahiv ilminin kurallarına dair anayasa niteliği taşıması bakımından İslam literatüründe benzersiz bir konuma sahiptir."]},{"alan":"Diğer","alt":"","soru":"\"Diriliş Neslinin Amentüsü\" eseri kime aittir?","cevap":["Mütefekkir ve şair Sezai Karakoç’a aittir."]},{"alan":"Diğer","alt":"","soru":"\"Şeytan Ayetleri\" kitabının yazarı kimdir?","cevap":["Hint asıllı İngiliz yazar Salman Rüşdi’dir. İslam'ın kutsallarına hakaret içerdiği gerekçesiyle İslam dünyasında büyük tepki çeken bir romandır."]},{"alan":"Diğer","alt":"","soru":"\"Vesîletü’n-Necât\" kime aittir ve halk arasındaki adı nedir?","cevap":["Bu eser Süleyman Çelebi’ye aittir. Halk arasında yaygın olarak \"Mevlid\" adıyla bilinir. Peygamber Efendimizin (sav) doğumunu, mucizelerini ve vefatını anlatan manzum bir eserdir."]},{"alan":"Diğer","alt":"","soru":"Ahmet Hamdi Tanpınar’ın \"Beş Şehir\" eserindeki şehirler:","cevap":["İstanbul, Ankara, Konya, Bursa ve Erzurum."]},{"alan":"Diğer","alt":"","soru":"Osmanlı âlimi Kemalpaşazâde (İbn Kemal) kimdir?","cevap":["Osmanlı Şeyhülislamı ve çok yönlü bir alimdir. Fıkıhta mezhep imamlarının tabakalarını (Tabakātü'l-fukahâ) tasnif etmesi ve felsefi/kelami risaleleriyle (Varlık risalesi gibi) tanınır."]},{"alan":"Diğer","alt":"","soru":"Zâhidü’l-Kevserî’nin iki eserini söyler misin?","cevap":["Zâhidü’l-Kevserî, özellikle Cumhuriyet’in ilk yıllarında Mısır’a gitmiş ve orada Osmanlı ilim geleneğini sürdürmüş çok önemli bir alimdir. Yüzlerce eseri ve tahkiki bulunmakla birlikte en meşhur iki eseri şunlardır:","Makālâtü’l-Kevserî: Onun en temel eseridir. Dinî, tarihî ve ilmî konularda yazdığı makalelerin bir araya getirilmesiyle oluşmuştur. Ehl-i Sünnet müdafaası ve modern dönemdeki tartışmalı konulara verdiği cevaplar açısından bir başvuru kaynağıdır.","Te'nîbü'l-Hatîb: Hatîb el-Bağdâdî’nin Târîhu Bağdâd adlı eserinde İmam-ı Azam Ebû Hanîfe hakkında yer verdiği bazı tenkitlere cevap mahiyetinde kaleme aldığı çok ses getiren bir reddiyedir."]},{"alan":"Diğer","alt":"","soru":"Mehmed Zihnî Efendi kimdir ve yazdığı kitaplar nelerdir?","cevap":["Başlık Doğum / Vefat Ünvanı Temel Alanı Eğitim Metodu","Detay 1846 - 1913 Osmanlı Alimi, Müderris, Filolog Arap Dili (Sarf/Nahiv), Fıkıh ve Belagat Klasik Medrese ilmini, modern okul (Mülkiye/Galatasaray) müfredatına uyarlamıştır.","Kimdir? Tanzimat sonrası Osmanlı’nın en önemli eğitimci ve dil alimlerinden biridir. Medrese birikimini modern okul metotlarıyla birleştirerek Arapça hocalığı yapmıştır.","En Meşhur Eserleri: o Ni'met-i İslâm: Günümüzde hâlâ kullanılan çok kapsamlı bir fıkıh ve ilmihal kitabıdır. o El-Müntehab: Arapça dil bilgisini Türkçeye sistemli şekilde aktaran temel ders kitabıdır. o Meşâhirü’n-Nisâ: Tarihteki meşhur kadınların biyografilerini içeren nadir eserlerden biridir.","Önemi: Zor ve karmaşık dini/linguistik konuları, halkın ve öğrencilerin anlayabileceği sade bir Osmanlı Türkçesi ile kaleme almasıdır"]},{"alan":"Diğer","alt":"","soru":"Hayrettin Karaman’ın kendi hayatını anlattığı eserinin adı nedir?","cevap":["Eser: Bir Süvari Çelebi (Kendi hayatını ve anılarını kaleme aldığı otobiyografik çalışmasıdır)."]},{"alan":"Diğer","alt":"","soru":"\"Çöl Kaplanı\" olarak bilinen şahsiyet ve bu konudaki eser hangisidir?","cevap":["Şahsiyet: Medine Müdafii Fahreddin Paşa.","Meşhur Eser: Medine Müdafaası / Bir Avuç Türk'ün Medine Müdafaası Feridun Kandemir."]}];
